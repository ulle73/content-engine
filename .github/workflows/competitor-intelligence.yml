name: Content Engine Daily
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: competitor-intelligence
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.CONTENT_INTELLIGENCE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.CONTENT_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.CONTENT_DJANGO_SECRET }}
      POSTIZ_ENCRYPTION_SECRET: ${{ secrets.CONTENT_POSTIZ_ENCRYPTION_SECRET }}
      APIFY_API_TOKEN: ${{ secrets.CONTENT_APIFY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.CONTENT_OPENAI_KEY }}
      # Competitor/market analysis classifies through OpenRouter (engine/signals.py).
      OPENROUTER_API_KEY: ${{ secrets.CONTENT_OPENROUTER_KEY }}
      OPENROUTER_ANALYSIS_MODEL: ${{ vars.OPENROUTER_ANALYSIS_MODEL || '@preset/gk-free' }}
      OPENROUTER_ANALYSIS_FALLBACK_MODEL: ${{ vars.OPENROUTER_ANALYSIS_FALLBACK_MODEL || 'z-ai/glm-5.3-flash' }}
      VIRLO_API_KEY: ${{ secrets.CONTENT_VIRLO_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.CONTENT_R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.CONTENT_R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.CONTENT_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.CONTENT_R2_SECRET_ACCESS_KEY }}
      HIGGSFIELD_API_KEY: ${{ secrets.CONTENT_HIGGSFIELD_API_KEY }}
      HIGGSFIELD_API_SECRET: ${{ secrets.CONTENT_HIGGSFIELD_API_SECRET }}
      HIGGSFIELD_API_KEY_GK: ${{ secrets.CONTENT_HIGGSFIELD_API_KEY_GK }}
      MEDIA_STORAGE: r2
      APP_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Show unapplied migrations (diagnostic)
        run: python manage.py showmigrations --plan | grep -F "[ ]" || echo "All migrations applied."
      - run: python manage.py migrate --check
      - run: python manage.py run_daily
