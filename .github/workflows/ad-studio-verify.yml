name: Ad Studio
on:
  push:
    branches: [main, 'ad-studio/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check engine/ad_studio engine/test_ad_studio.py engine/test_ad_brief.py
      - run: python manage.py makemigrations --check --dry-run --settings=engine.test_settings
      - run: python manage.py test engine.test_ad_brief engine.test_ad_studio --settings=engine.test_settings
