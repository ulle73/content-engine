name: Creator acceptance
on:
  push:
    branches: [codex/product-flow-integration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt playwright ruff
      - run: ruff check engine/creative_budget.py engine/creative_controls.py engine/test_creator.py scripts/creator_browser_smoke.py
      - run: node --check engine/static/js/creator.js
      - run: python manage.py check --settings=engine.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=engine.test_settings
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/creator_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-browser-evidence
          path: data/creator-browser
          retention-days: 7
