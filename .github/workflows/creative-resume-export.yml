name: Creative resume source export
on:
  push:
    branches: [feature/chatgpt-content-engine-mcp]
    paths: [.github/workflows/creative-resume-export.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Package current tracked workspace
        run: |
          printf '%s\n' "$GITHUB_SHA" > /tmp/source-commit.txt
          tar --exclude=.git --exclude='*/.git' -czf /tmp/creative-source-current.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: creative-resume-source
          path: |
            /tmp/creative-source-current.tar.gz
            /tmp/source-commit.txt
          retention-days: 1
      - name: Publish run pointer
        run: |
          printf '{"run_id":%s,"source_commit":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .creative-export-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .creative-export-run.json
          git commit -m "ci: record creative resume export run"
          git push origin HEAD:feature/chatgpt-content-engine-mcp
