name: Creative Engine isolated workspace
on:
  push:
    branches: [feature/chatgpt-content-engine-mcp]
    paths: [.github/workflows/creative-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package tracked sources only (no credentials or production data)
        run: |
          mkdir -p /tmp/creative-transfer
          python - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '--recurse-submodules', '-z']).decode().split('\0')
          with tarfile.open('/tmp/creative-transfer/source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  if not name:
                      continue
                  path = pathlib.Path(name)
                  if path.is_file() and not path.is_symlink():
                      if path.name.startswith('.env') and path.name != '.env.example':
                          continue
                      archive.add(path, arcname=name, recursive=False)
          pathlib.Path('/tmp/creative-transfer/source-commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode())
          plan = subprocess.check_output(['git', 'show', 'origin/main:docs/2026-09-21-higgsfield-creative-engine-mcp-plan.md'])
          pathlib.Path('/tmp/creative-transfer/original-main-plan.md').write_bytes(plan)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: creative-source
          path: |
            /tmp/creative-transfer/source.tar.gz
            /tmp/creative-transfer/source-commit.txt
            /tmp/creative-transfer/original-main-plan.md
          retention-days: 1
      - name: Download public dependency wheels for offline tests
        run: python -m pip download --only-binary=:all: -r requirements.txt --dest /tmp/creative-transfer/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: creative-test-wheels
          path: /tmp/creative-transfer/wheels
          retention-days: 1
