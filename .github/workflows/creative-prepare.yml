name: Creative Engine verified patch preparation
on:
  push:
    branches: [feature/chatgpt-content-engine-mcp]
    paths: [.creative-work.patch]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: content_engine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: test-only-mcp-secret
      POSTIZ_ENCRYPTION_SECRET: test-only-postiz-secret
      APP_URL: http://127.0.0.1:8765
      MEDIA_STORAGE: local
      MCP_ALLOW_INSECURE_LOCAL: 'true'
      MCP_DEV_BEARER_TOKEN: test-only-mcp-token
      MCP_DEV_USER_EMAIL: operator@example.com
      TEST_DATABASE_URL: postgres://postgres:isolated-test-only@localhost:5432/content_engine_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply exact verified patch without moving any branch
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          raw = pathlib.Path('.creative-work.patch').read_text()
          header, patch = raw.split('\n--- PATCH ---\n', 1)
          meta = json.loads(header)
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == meta['base_commit'], 'Base moved; regenerate patch'
          assert len(patch.encode()) <= 2000000, 'Patch too large'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, text=True, check=True)
          paths = subprocess.check_output(['git', 'apply', '--numstat', '-'], input=patch, text=True)
          changed = [line.split('\t', 2)[2] for line in paths.splitlines()]
          assert set(changed) == set(meta['hashes']), 'Manifest/path mismatch'
          allowed_roots = ('engine/', 'operator_bridge/', 'templates/', 'scripts/', 'docs/')
          allowed_files = {'README.md', '.env.example', 'requirements.txt', 'render.yaml', '.github/workflows/creative-workspace.yml', '.github/workflows/creative-prepare.yml'}
          for path in changed:
              assert path.startswith(allowed_roots) or path in allowed_files, 'Path outside approved scope'
              assert '..' not in pathlib.PurePosixPath(path).parts and not pathlib.Path(path).is_symlink(), 'Unsafe path'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, text=True, check=True)
          for path, expected in meta['hashes'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip() if pathlib.Path(path).exists() else None
              assert actual == expected, 'Transferred bytes differ from tested bytes: ' + path
          subprocess.run(['git', 'rm', '.creative-work.patch'], check=True)
          pathlib.Path('/tmp/creative-meta.json').write_text(json.dumps(meta))
          print('Verified exact file hashes:', len(meta['hashes']))
          PY
      - run: pip install -r requirements.txt
      - name: Verify migrations, startup and full SQLite/PostgreSQL suites
        run: |
          mkdir -p data
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check
          python manage.py collectstatic --noinput
          APP_URL=http://127.0.0.1:8766 DJANGO_SETTINGS_MODULE=engine.mcp_settings python -c 'from engine.mcp_app import app; assert app is not None'
          python manage.py test
          python manage.py test engine operator_bridge --settings=engine.postgres_test_settings
      - name: Prepare Git object only; connector must explicitly advance branch
        env:
          PREPARE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['GITHUB_SHA']
          meta = json.loads(pathlib.Path('/tmp/creative-meta.json').read_text())
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/' + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['PREPARE_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.load(response)
          base_tree = api('commits/' + head)['tree']['sha']
          entries = []
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, changed):
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if pathlib.Path(path).exists():
                  entry['content'] = subprocess.check_output(['git', 'show', ':' + path]).decode()
              else:
                  entry['sha'] = None
              entries.append(entry)
          tree = api('trees', {'base_tree': base_tree, 'tree': entries})['sha']
          commit = api('commits', {'message': meta['message'], 'tree': tree, 'parents': [head]})['sha']
          print('PREPARED_COMMIT=' + commit)
          print('PREPARED_TREE=' + tree)
          pathlib.Path('/tmp/creative-prepared.json').write_text(json.dumps({'commit': commit, 'tree': tree, 'parent': head, 'verified_hashes': meta['hashes']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: creative-prepared
          path: /tmp/creative-prepared.json
          retention-days: 1
