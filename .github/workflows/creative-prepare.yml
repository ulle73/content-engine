name: Creative Engine verified patch preparation
on:
  push:
    branches: [feature/chatgpt-content-engine-mcp]
    paths: [.creative-patch-ready]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: content_engine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: test-only-mcp-secret
      POSTIZ_ENCRYPTION_SECRET: test-only-postiz-secret
      APP_URL: http://127.0.0.1:8765
      MEDIA_STORAGE: local
      MCP_ALLOW_INSECURE_LOCAL: 'true'
      MCP_DEV_BEARER_TOKEN: test-only-mcp-token
      MCP_DEV_USER_EMAIL: operator@example.com
      TEST_DATABASE_URL: postgres://postgres:isolated-test-only@localhost:5432/content_engine_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Assemble and apply exact verified patch in isolated worktree
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, zlib, base64
          expected = pathlib.Path('.creative-patch-ready').read_text().strip()
          chunks = sorted(pathlib.Path('.creative-patch-chunks').glob('*.txt'))
          assert chunks, 'No patch chunks found'
          payload = b''.join(path.read_bytes() for path in chunks)
          assert hashlib.sha256(payload).hexdigest() == expected, 'Patch payload SHA-256 mismatch'
          raw = payload.decode('utf-8')
          header, patch = raw.split('\n--- PATCH ---\n', 1)
          meta = json.loads(header)
          assert meta.get('encoding') == 'zlib-base64', 'Unexpected patch encoding'
          decoder = zlib.decompressobj()
          decoded = decoder.decompress(base64.b64decode(''.join(patch.split()), validate=True), 2000001)
          assert decoder.eof and not decoder.unconsumed_tail and len(decoded) <= 2000000, 'Invalid compressed patch'
          patch = decoded.decode('utf-8')
          subprocess.run(['git', 'merge-base', '--is-ancestor', meta['base_commit'], 'HEAD'], check=True)
          product = pathlib.Path('/tmp/creative-product')
          subprocess.run(['git', 'worktree', 'add', '--detach', str(product), meta['base_commit']], check=True)
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, text=True, cwd=product, check=True)
          paths = subprocess.check_output(['git', 'apply', '--numstat', '-'], input=patch, text=True, cwd=product)
          changed = [line.split('\t', 2)[2] for line in paths.splitlines()]
          assert set(changed) == set(meta['hashes']), 'Manifest/path mismatch'
          allowed_roots = ('engine/', 'operator_bridge/', 'templates/', 'scripts/', 'docs/')
          allowed_files = {'README.md', '.env.example', 'requirements.txt', 'render.yaml'}
          for path in changed:
              assert path.startswith(allowed_roots) or path in allowed_files, 'Path outside approved scope'
              assert '..' not in pathlib.PurePosixPath(path).parts and not (product / path).is_symlink(), 'Unsafe path'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, text=True, cwd=product, check=True)
          for path, wanted in meta['hashes'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True, cwd=product).strip()
              assert actual == wanted, 'Transferred bytes differ from tested bytes: ' + path
          pathlib.Path('/tmp/creative-meta.json').write_text(json.dumps(meta))
          print('PAYLOAD_SHA256=' + expected)
          print('Verified exact file hashes:', len(meta['hashes']))
          PY
      - name: Populate pinned skills submodule in isolated worktree
        run: |
          python - <<'PY'
          import pathlib, shutil
          source = pathlib.Path('vendor/social-media-skills')
          target = pathlib.Path('/tmp/creative-product/vendor/social-media-skills')
          assert (source / 'skills/caption-writer/SKILL.md').is_file(), 'Pinned skills source missing'
          target.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, target, dirs_exist_ok=True, ignore=shutil.ignore_patterns('.git'))
          assert (target / 'skills/caption-writer/SKILL.md').is_file()
          assert (target / 'skills/idea-generation-and-ideation/SKILL.md').is_file()
          PY
      - name: Install dependencies
        run: pip install -r /tmp/creative-product/requirements.txt
      - name: Verify migrations, startup and full SQLite/PostgreSQL suites
        working-directory: /tmp/creative-product
        run: |
          mkdir -p data
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check
          python manage.py collectstatic --noinput
          APP_URL=http://127.0.0.1:8766 DJANGO_SETTINGS_MODULE=engine.mcp_settings python -c 'from engine.mcp_app import app; assert app is not None'
          python manage.py test
          python manage.py test engine operator_bridge --settings=engine.postgres_test_settings
      - name: Prepare verified Git commit object; connector advances branch explicitly
        env:
          PREPARE_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['GITHUB_SHA']
          product = pathlib.Path('/tmp/creative-product')
          meta = json.loads(pathlib.Path('/tmp/creative-meta.json').read_text())
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/' + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['PREPARE_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.load(response)
          base_tree = api('commits/' + meta['base_commit'])['tree']['sha']
          entries = []
          for path in meta['hashes']:
              mode = subprocess.check_output(['git', '-C', str(product), 'ls-files', '-s', '--', path], text=True).split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': (product / path).read_text()})
          entries.append({'path': '.creative-work.patch', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('trees', {'base_tree': base_tree, 'tree': entries})['sha']
          commit = api('commits', {'message': meta['message'], 'tree': tree, 'parents': [head]})['sha']
          result = {'commit': commit, 'tree': tree, 'parent': head, 'base_commit': meta['base_commit'], 'verified_hashes': meta['hashes']}
          pathlib.Path('/tmp/creative-prepared.json').write_text(json.dumps(result, indent=2))
          print('PREPARED_COMMIT=' + commit)
          print('PREPARED_TREE=' + tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: creative-prepared
          path: /tmp/creative-prepared.json
          retention-days: 1
