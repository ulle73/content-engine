name: Golf image enrichment final pass

on:
  push:
    branches:
      - automation/golf-image-enricher-20261006

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/golf-image-enricher/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/golf-image-enricher/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tools/golf-image-enricher/tests -v
      - name: Finish remaining golf images
        working-directory: tools/golf-image-enricher
        run: |
          python finish_remaining.py \
            input/golfbanor.json \
            output/golfbanor_med_bilder.json \
            output/summary.csv
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: golf-image-enrichment-final
          path: |
            tools/golf-image-enricher/output/golfbanor_med_bilder.json
            tools/golf-image-enricher/output/summary.csv
          if-no-files-found: error
          retention-days: 7