name: Motion Engine CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/motion-engine-production

permissions:
  contents: read

jobs:
  verify-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECRET_KEY: test-only-motion-secret
      POSTIZ_ENCRYPTION_SECRET: test-only-motion-postiz
      APP_URL: http://127.0.0.1:8765
      MEDIA_STORAGE: local
      DJANGO_SETTINGS_MODULE: engine.test_settings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion-renderer/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt psutil

      - name: Verify Django motion integration
        run: |
          python manage.py makemigrations --check --dry-run --settings=engine.test_settings
          python manage.py check --settings=engine.test_settings
          python manage.py test engine.test_motion_audio engine.test_motion_jobs engine.test_motion_planner engine.test_motion_schema engine.test_motion_worker --settings=engine.test_settings

      - name: Verify renderer contracts and build
        working-directory: motion-renderer
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Ensure Remotion browser
        working-directory: motion-renderer
        run: node --input-type=module -e "import {ensureBrowser} from '@remotion/renderer'; await ensureBrowser({logLevel:'info'});"

      - name: Render and decode representative videos
        run: python scripts/motion_render_smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-ci-evidence
          path: motion-evidence
          retention-days: 3
