name: Sequence G1 Browser Audit
on:
  push:
    branches:
      - feature/sequence-planner-g1
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: test-only-sequence-g1-secret
      POSTIZ_ENCRYPTION_SECRET: test-only-sequence-g1-postiz
      APP_URL: http://127.0.0.1:8765
      MEDIA_STORAGE: local
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p data artifacts/sequence-g1
      - run: python manage.py migrate --noinput
      - run: python scripts/sequence_g1_browser_audit.py --seed
      - name: Start local app
        run: |
          nohup python manage.py runserver 127.0.0.1:8765 --noreload > /tmp/g1-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/health/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/g1-server.log
          exit 1
      - run: python scripts/sequence_g1_browser_audit.py --audit
      - name: Upload G1 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-g1-screenshots
          path: artifacts/sequence-g1
