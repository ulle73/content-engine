name: Migration encrypted credential handoff
on:
  push:
    branches: [feature/chatgpt-content-engine-mcp]
    paths: [.github/migration-handoff-public.pem]
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: RSA PEM public key whose private key is held by the migration operator
        required: true
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/feature/chatgpt-content-engine-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cryptography==50.0.1
      - name: Encrypt existing deployment credentials for the migration operator
        env:
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          DATABASE_URL: ${{ secrets.CONTENT_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.CONTENT_DJANGO_SECRET }}
          POSTIZ_ENCRYPTION_SECRET: ${{ secrets.CONTENT_POSTIZ_ENCRYPTION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.CONTENT_OPENAI_KEY }}
          APIFY_API_TOKEN: ${{ secrets.CONTENT_APIFY_TOKEN }}
          R2_ENDPOINT_URL: ${{ secrets.CONTENT_R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.CONTENT_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.CONTENT_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CONTENT_R2_SECRET_ACCESS_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.CONTENT_HIGGSFIELD_API_KEY }}
          HIGGSFIELD_API_SECRET: ${{ secrets.CONTENT_HIGGSFIELD_API_SECRET }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          names = ['DATABASE_URL', 'SECRET_KEY', 'POSTIZ_ENCRYPTION_SECRET', 'OPENAI_API_KEY',
                   'APIFY_API_TOKEN', 'R2_ENDPOINT_URL', 'R2_BUCKET_NAME', 'R2_ACCESS_KEY_ID',
                   'R2_SECRET_ACCESS_KEY', 'HIGGSFIELD_API_KEY', 'HIGGSFIELD_API_SECRET']
          key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          pem = os.environ.get('RECIPIENT_PUBLIC_KEY') or Path('.github/migration-handoff-public.pem').read_text()
          public = serialization.load_pem_public_key(pem.encode())
          wrapped = public.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          data = json.dumps({name: os.environ.get(name, '') for name in names}).encode()
          sealed = AESGCM(key).encrypt(nonce, data, b'content-engine-migration-20260913')
          Path('sealed.json').write_text(json.dumps({k: base64.b64encode(v).decode() for k,v in
              {'key': wrapped, 'nonce': nonce, 'ciphertext': sealed}.items()}))
          print('Encrypted credential handoff prepared. No plaintext credentials written to disk.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-migration-handoff
          path: sealed.json
          retention-days: 1
