name: Finish isolated creator verification
on:
  push:
    branches: [codex/product-flow-integratio]
    paths: [.github/workflows/creator-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: github.repository == 'ulle73/content-engine' && github.ref == 'refs/heads/codex/product-flow-integratio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Fix only the four reported import-order diagnostics
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ae732cf7ad1ae4e9690d94f991da8e73e31507ab
          pip install ruff==0.16.9
          ruff check --select I --fix engine/creative_controls.py engine/test_creator.py scripts/creator_browser_smoke.py
          ruff check engine/creative_controls.py engine/test_creator.py scripts/creator_browser_smoke.py
          git diff --check
          git diff --stat
          git add -- engine/creative_controls.py engine/test_creator.py scripts/creator_browser_smoke.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: align creator imports with repository lint rules'
          git push origin HEAD:refs/heads/codex/product-flow-integratio
          git rev-parse HEAD
      - name: Dependencies for isolated acceptance
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Verify shared services and browser flows
        run: |
          set -euo pipefail
          mkdir -p data/creator-browser
          node --check engine/static/js/creator.js
          python manage.py check --settings=engine.test_settings
          python manage.py makemigrations --check --dry-run --settings=engine.test_settings
          python manage.py test --settings=engine.test_settings --noinput 2>&1 | tee data/creator-browser/django-tests.log
          python scripts/creator_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-browser-evidence
          path: data/creator-browser
          retention-days: 7
