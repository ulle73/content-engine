<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@TITLE@ · preview</title>
    <style>
      :root {
        --bg: #f2f2f4;
        --card: #ffffff;
        --ink: #111218;
        --muted: #6b6e7a;
        --line: #e3e4ea;
        --accent: #2041f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0e12;
          --card: #17181e;
          --ink: #f1f1f4;
          --muted: #9a9cab;
          --line: #2a2b33;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 28px 16px 40px;
      }
      .post {
        width: min(470px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
      }
      .av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: radial-gradient(circle at 36% 30%, #ff9a5c, #ff6a1f 45%, #e4500d);
      }
      .name {
        font-weight: 600;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .viewport {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        background: #1530c8;
        touch-action: pan-y;
        cursor: grab;
      }
      .track {
        display: flex;
        height: 100%;
        transition: transform 0.38s cubic-bezier(0.22, 0.8, 0.2, 1);
      }
      .track video {
        flex: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .counter {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 9px;
        border-radius: 12px;
      }
      .nav {
        position: absolute;
        top: 50%;
        width: 32px;
        height: 32px;
        margin-top: -16px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.88);
        color: #111;
        font-size: 18px;
        line-height: 32px;
        cursor: pointer;
      }
      .nav.prev {
        left: 10px;
      }
      .nav.next {
        right: 10px;
      }
      .nav[hidden] {
        display: none;
      }
      .sound {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      .start {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 40, 0.45);
        border: none;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .start span {
        background: #fff3e0;
        color: #0c1236;
        padding: 12px 20px;
        border-radius: 24px;
      }
      .dots {
        display: flex;
        justify-content: center;
        gap: 5px;
        padding: 12px 0 4px;
      }
      .dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--line);
      }
      .dots i.on {
        background: var(--accent);
      }
      .actions {
        display: flex;
        gap: 16px;
        padding: 6px 14px 4px;
      }
      .actions svg {
        width: 24px;
        height: 24px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 1.8;
      }
      .actions .save {
        margin-left: auto;
      }
      .caption {
        padding: 6px 14px 16px;
      }
      .caption b {
        font-weight: 600;
      }
      .note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        max-width: 470px;
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="head">
        <div class="av"></div>
        <div>
          <div class="name">@HANDLE@</div>
          <div class="sub">@TITLE@</div>
        </div>
      </div>
      <div class="viewport" id="vp">
        <div class="track" id="track">
<!--@VIDEOS@-->
        </div>
        <div class="counter" id="counter">1/@N@</div>
        <button class="nav prev" id="prev" aria-label="Previous" hidden>‹</button>
        <button class="nav next" id="next" aria-label="Next">›</button>
        <button class="sound" id="sound" aria-label="Toggle sound">🔇</button>
        <button class="start" id="start"><span>Tap to play with sound</span></button>
      </div>
      <div class="dots" id="dots"><!--@DOTS@--></div>
      <div class="actions">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3.2-6.4L20 4l-.6 4A8 8 0 0 1 20 12z" /></svg>
        <svg viewBox="0 0 24 24"><path d="M21 4 3 11l7 2 2 7z" /></svg>
        <svg class="save" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-5-6 5z" /></svg>
      </div>
      <div class="caption"><b>@HANDLE@</b> @CAPTION@</div>
    </div>
    <p class="note">Local preview of the live carousel: swipe or drag the post, use the arrows, or press ← →. Each slide plays from the start when it comes into view, like a carousel does.</p>

    <script>
      const track = document.getElementById("track");
      const vids = [...track.querySelectorAll("video")];
      const dots = [...document.querySelectorAll("#dots i")];
      const counter = document.getElementById("counter");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const soundBtn = document.getElementById("sound");
      const start = document.getElementById("start");
      let idx = 0;
      let soundOn = false;

      function go(i) {
        idx = Math.max(0, Math.min(vids.length - 1, i));
        track.style.transform = `translateX(${-idx * 100}%)`;
        dots.forEach((d, k) => d.classList.toggle("on", k === idx));
        counter.textContent = `${idx + 1}/${vids.length}`;
        prev.hidden = idx === 0;
        next.hidden = idx === vids.length - 1;
        vids.forEach((v, k) => {
          if (k === idx) {
            v.currentTime = 0;
            v.muted = !soundOn;
            v.play().catch(() => {});
          } else {
            v.pause();
          }
        });
      }
      function setSound(on) {
        soundOn = on;
        soundBtn.textContent = on ? "🔊" : "🔇";
        vids[idx].muted = !on;
      }
      prev.onclick = () => go(idx - 1);
      next.onclick = () => go(idx + 1);
      soundBtn.onclick = () => setSound(!soundOn);
      start.onclick = () => {
        start.remove();
        setSound(true);
        go(idx);
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") go(idx + 1);
        if (e.key === "ArrowLeft") go(idx - 1);
      });
      // drag / swipe
      const vp = document.getElementById("vp");
      let x0 = null;
      vp.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button")) return;
        x0 = e.clientX;
      });
      window.addEventListener("pointerup", (e) => {
        if (x0 === null) return;
        const dx = e.clientX - x0;
        x0 = null;
        if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
      });
      go(0);
    </script>
  </body>
</html>
