<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Live Carousel 03: Weight</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /*@CHROME@*/

      #small-top {
        position: absolute;
        left: 72px;
        top: 166px;
      }
      .wordbox {
        position: absolute;
        left: 72px;
        top: 676px;
        width: 936px;
        height: 290px;
      }
      .wordbox .big {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 936px;
        justify-content: center;
        transform-origin: 50% 100%;
      }
      #small-bot {
        position: absolute;
        left: 72px;
        top: 1000px;
        font-size: 54px;
        white-space: nowrap;
      }
      .strobe {
        position: absolute;
        left: 0;
        top: 0;
        width: 88px;
        height: 88px;
        opacity: 0;
      }
      .strobe .ball-squash,
      .strobe .ball-stretch {
        position: absolute;
        inset: 0;
      }
      .strobe .ball-squash {
        transform-origin: 50% 100%;
      }
      .strobe .ball-stretch {
        border-radius: 50%;
        border: 3px solid var(--cream);
        background: none;
        box-shadow: none;
      }
      .strobe.hot .ball-stretch {
        border-color: var(--orange);
        border-width: 5px;
      }
      .note {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 6px;
        opacity: 0;
      }
      .note .k {
        align-self: flex-start;
      }
      .note .v {
        font-family: "Fraunces", Georgia, serif;
        font-style: italic;
        font-weight: 420;
        font-size: 44px;
        line-height: 1;
        color: var(--cream);
        white-space: nowrap;
      }
      #leaders {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
      }
      #leaders path {
        fill: none;
        stroke: var(--cream);
        stroke-width: 3;
        stroke-linecap: round;
      }
      #leaders circle {
        fill: var(--cream);
      }
      .callout {
        position: absolute;
        left: 72px;
        top: 1114px;
        font-family: var(--mono);
        font-size: 25px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--cream);
        white-space: nowrap;
      }
      .callout {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .callout .vol {
        display: block;
        font-weight: 700;
        background: var(--cream);
        color: var(--ink);
        padding: 4px 12px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1350">
      <div id="scene" class="scene clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="world" class="world">
          <canvas id="grid" class="grid" width="1080" height="1350"></canvas>
          <div id="glow" class="glow"></div>

          <div class="topbar">
            <div class="tb-left"><span class="dot"></span><span>Rule 02 — Squash &amp; Stretch</span></div>
            <div>03 / 04</div>
          </div>
          <div class="hairline"></div>

          <div id="small-top" class="small">give it</div>

          <div id="strobes" class="layer"></div>
          <svg id="leaders" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
          <div id="noteS" class="note">
            <span class="k pill solid">Stretch</span>
            <span class="v">= speed</span>
          </div>
          <div id="noteQ" class="note">
            <span class="k pill solid">Squash</span>
            <span class="v">= impact</span>
          </div>

          <div id="wordbox" class="wordbox">
            <div id="w-weight" class="big" data-word="WEIGHT."></div>
          </div>
          <div id="small-bot" class="small">stretch when it falls. squash when it lands.</div>

          <div id="callout" class="callout"><span>WIDER = SHORTER ·</span><span class="vol">THE VOLUME NEVER CHANGES</span></div>

          <div id="fx" class="layer"></div>
          <div id="balls" class="layer"></div>
          <div id="ruler" class="ruler"></div>
        </div>
        <!--@GRAIN@-->
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="8" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      //@ENGINE@
    </script>
    <script>
      (function () {
        const L = window.LC;
        const DUR = 8;
        const R = 44;
        const root = document.getElementById("root");

        function build() {
          const wEl = document.getElementById("w-weight");
          const chars = L.buildWord(wEl);
          const fit = L.fitWord(wEl, chars, 936, 330, 52);
          const w0 = fit.w;
          const m = L.measureWord(chars, fit.F, root);
          const baseY = m[0].base;

          // ---------- ball path: arc in, decaying bounces across the word ----------
          const cy = (g) => g.top - R;
          const LAND = [
            { t: 1.0, i: 1, h: 0, q: 0.62, A: 0.15 },
            { t: 2.0, i: 3, h: 380, q: 0.55, A: 0.12 },
            { t: 2.5, i: 4, h: 165, q: 0.42, A: 0.08 },
            { t: 2.75, i: 5, h: 64, q: 0.28, A: 0.045 },
            { t: 2.875, i: 5, h: 20, q: 0.14, A: 0.02 },
          ];
          const pts = [{ t: 0, x: -70, y: 800 }];
          LAND.forEach((l, n) => {
            pts.push({ t: l.t, x: m[l.i].cx, y: cy(m[l.i]), h: n === 0 ? 430 : l.h, contact: { q: l.q } });
          });
          const restX = m[5].cx,
            restY = cy(m[5]);
          const ANT = 0.17; // word anticipation squash before the launch
          const antDrop = (baseY - m[5].top) * ANT;
          pts.push({ t: 2.96, x: restX, y: restY, h: 6 });
          pts.push({ t: 6.0, x: restX, y: restY });
          pts.push({ t: 6.45, x: restX, y: restY + antDrop, ease: "inOut", contact: { q: 0.4 } });
          pts.push({ t: 7.2, x: 1290, y: 120, h: 260 });
          const path = L.makePath(pts);

          // ---------- strobe ghosts (chronophotograph), every 2 frames ----------
          const strobes = document.getElementById("strobes");
          const ghosts = [];
          const strobeTimes = [];
          for (let k = 0; ; k++) {
            const tk = 0.2 + k * 0.1;
            if (tk > 1.95) break;
            strobeTimes.push(tk);
          }
          strobeTimes.push(2.0, 2.5, 2.75);
          for (const tk of strobeTimes) {
            const s = L.ballState(path, tk, R, { stretch: 1.25 });
            const g = document.createElement("div");
            g.className = "strobe";
            g.innerHTML = '<div class="ball-squash"><div class="ball-stretch"></div></div>';
            strobes.appendChild(g);
            g.style.transform = `translate(${s.x - R}px, ${s.y - R}px)`;
            const sq = 1 + s.q;
            g.firstChild.style.transform = `scale(${sq}, ${1 / sq})`;
            const a = 1 + s.st;
            g.firstChild.firstChild.style.transform = `rotate(${s.ang}rad) scale(${a}, ${1 / a}) rotate(${-s.ang}rad)`;
            ghosts.push({ el: g, t: tk, s });
          }
          // the most stretched ghost in the first fall, and the first-contact squash
          const fall = ghosts.filter((g) => g.t > 0.6 && g.t < 0.98);
          const gS = fall.reduce((a, b) => (b.s.st > a.s.st ? b : a));
          const gQ = ghosts.reduce((a, b) => (Math.abs(b.t - 1.0) < Math.abs(a.t - 1.0) ? b : a));
          gS.el.classList.add("hot");
          gQ.el.classList.add("hot");

          // ---------- callouts with drawn leaders ----------
          const svg = document.getElementById("leaders");
          const NS = "http://www.w3.org/2000/svg";
          const noteS = document.getElementById("noteS");
          const noteQ = document.getElementById("noteQ");
          // STRETCH note sits to the right of the falling ghost, QUASH note to the left of the contact
          const sNote = { x: 700, y: 300 };
          const qNote = { x: 72, y: gQ.s.y - 250 };
          noteS.style.left = sNote.x + "px";
          noteS.style.top = sNote.y + "px";
          noteQ.style.left = qNote.x + "px";
          noteQ.style.top = qNote.y + "px";
          const mkLeader = (x0, y0, x1, y1) => {
            const p = document.createElementNS(NS, "path");
            const mx = x0,
              my = y1;
            p.setAttribute("d", `M ${x0} ${y0} Q ${mx} ${my} ${x1} ${y1}`);
            svg.appendChild(p);
            const len = p.getTotalLength();
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", x1);
            c.setAttribute("cy", y1);
            c.setAttribute("r", 7);
            c.style.opacity = 0;
            svg.appendChild(c);
            return { p, c, len };
          };
          const leadS = mkLeader(sNote.x + 4, sNote.y + 112, gS.s.x + 34, gS.s.y);
          const leadQ = mkLeader(qNote.x + 60, qNote.y + 112, gQ.s.x - 50, gQ.s.y + 20);

          // ---------- elements ----------
          const balls = document.getElementById("balls");
          const trail = [3, 2, 1].map((k) => ({ g: L.makeBall(balls, "ghost", R), k }));
          const ball = L.makeBall(balls, "", R);
          const grid = L.makeGrid(document.getElementById("grid"), { color: "#FFF3E0", gap: 45 });
          const waves = LAND.map((l) => ({ t: l.t, x: m[l.i].cx, y: m[l.i].top, a: l.A * 7, v: 1400 }));
          waves.push({ t: 6.45, x: restX, y: m[5].top, a: 1.1, v: 1700 });
          const burst = L.makeBurst(document.getElementById("fx"), 16, 33);
          const ruler = L.makeRuler(document.getElementById("ruler"), {
            frameStart: 420,
            frames: 240,
            width: 1080,
            duration: DUR,
            keys: [1.0, 2.0, 2.5, 2.75, 2.875, 6.45],
          });
          const world = document.getElementById("world");
          const glow = document.getElementById("glow");
          const word = wEl;

          function render(t) {
            // camera bump on hard landings + launch
            let sx = 0,
              sy = 0;
            [...LAND.slice(0, 3).map((l) => [l.t, l.A * 90]), [6.45, 10]].forEach(([t0, amp]) => {
              const dt = t - t0;
              if (dt < 0 || dt > 0.5) return;
              const e = Math.exp(-dt * 10) * amp;
              sx += Math.sin(dt * 57 + t0) * e * 0.5;
              sy += Math.cos(dt * 49 + t0) * e;
            });
            world.style.transform = `translate(${sx.toFixed(2)}px, ${sy.toFixed(2)}px)`;

            // ---------- the word has weight too ----------
            let squash = 0,
              widen = 0;
            LAND.forEach((l) => {
              const k = L.kick(t - l.t, 2.3, 6);
              squash += l.A * k;
              widen += l.A * 110 * Math.max(0, k);
            });
            // anticipation (crouch) then trampoline release with overshoot
            const crouch = L.easeInOut(L.prog(t, 6.0, 6.45));
            const release = t > 6.45 ? -0.9 * L.kick(t - 6.45, 2.0, 5.5) : 0;
            squash += t < 6.45 ? ANT * crouch : ANT * Math.exp(-(t - 6.45) * 30) + 0.12 * release;
            word.style.transform = `scale(${(1 + squash * 0.3).toFixed(4)}, ${(1 - squash).toFixed(4)})`;
            chars.forEach((c, i) => {
              let dip = 0;
              LAND.forEach((l) => {
                if (l.i === i) dip += l.A * 160 * L.kick(t - l.t, 2.8, 7);
              });
              c.el.style.setProperty("--w", (w0 + widen * (0.6 + 0.4 * Math.cos(i))).toFixed(2));
              c.el.style.transform = `translateY(${dip.toFixed(2)}px)`;
            });

            // ---------- strobe ghosts: appear as the ball passes, fade before the launch ----------
            const out = L.prog(t, 6.05, 6.4);
            for (const g of ghosts) {
              const dt = t - g.t;
              if (dt < 0 || out >= 1) {
                g.el.style.opacity = 0;
                continue;
              }
              const hot = g === gS || g === gQ;
              const base = hot ? 1 : 0.5;
              g.el.style.opacity = (base * L.clamp(dt / 0.12) * (1 - out)).toFixed(3);
            }

            // ---------- notes + leaders ----------
            const noteAnim = (note, lead, t0) => {
              const draw = L.easeInOut(L.prog(t, t0, t0 + 0.35));
              const vanish = L.prog(t, 6.0, 6.3);
              lead.p.style.strokeDashoffset = (lead.len * (1 - draw)).toFixed(2);
              lead.p.style.opacity = 1 - vanish;
              lead.c.style.opacity = draw > 0.98 ? 1 - vanish : 0;
              const pop = L.settle(t - (t0 + 0.12), 2.6, 7);
              note.style.opacity = t < t0 + 0.12 ? 0 : (1 - vanish).toFixed(3);
              note.style.transform = `translateY(${((1 - pop) * 24).toFixed(2)}px) scale(${(0.9 + 0.1 * pop).toFixed(4)})`;
            };
            noteAnim(noteS, leadS, 3.1);
            noteAnim(noteQ, leadQ, 3.6);

            // ---------- ball + trail ----------
            const bs = L.ballState(path, t, R, { stretch: 1.25 });
            // tiny idle breath while resting (it is still alive)
            if (t > 3.1 && t < 6.0) bs.q += 0.035 * Math.sin((t - 3.1) * Math.PI * 2) * L.prog(t, 3.1, 3.4);
            const vis = t <= 7.2;
            ball.pos.style.opacity = vis ? 1 : 0;
            L.applyBall(ball, bs);
            trail.forEach(({ g, k }) => {
              const gs = L.ballState(path, t - k * 0.04, R, { stretch: 1.25 });
              const speed = Math.hypot(gs.vx, gs.vy);
              g.pos.style.opacity = vis ? (L.clamp(speed / 1500) * (0.6 - k * 0.13)).toFixed(3) : 0;
              L.applyBall(g, gs);
            });
            burst(t, 6.45, restX, m[5].top, 1.0);

            const flash = t > 6.45 ? Math.exp(-(t - 6.45) * 3) : 0;
            glow.style.opacity = (0.35 + 0.5 * flash).toFixed(3);
            glow.style.transform = `translate(${(bs.x - 550).toFixed(1)}px, ${(bs.y - 520).toFixed(1)}px) scale(0.6)`;

            grid(t, waves, 1);
            ruler(t);
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
          render(0);
          window.__timelines["main"] = tl;
        }

        document.fonts.load("900 100px Anybody");
        document.fonts.load("500 26px 'JetBrains Mono'");
        document.fonts.load("italic 420 76px Fraunces");
        document.fonts.ready.then(build);
      })();
    </script>
  </body>
</html>
