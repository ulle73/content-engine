services:
  - type: web
    name: content-engine-mcp
    branch: main
    runtime: python
    # Current plan. Upgrade to starter for always-on operation after approving its cost.
    plan: free
    region: frankfurt
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start-mcp.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      # One service hosts the existing editor, OAuth and MCP on the same system of record.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # Preserve the source database's Postiz encryption secret exactly.
      - key: POSTIZ_ENCRYPTION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: APIFY_API_TOKEN
        sync: false
      - key: SCRAPER_DAILY_BUDGET_USD
        value: "0.50"
      - key: INTELLIGENCE_DAILY_ANALYSES
        value: "12"
      - key: OPENROUTER_API_KEY
        sync: false
      # Analysis route: free preset → low-cost GLM → last resort (engine/openrouter.analysis_route).
      - key: OPENROUTER_ANALYSIS_MODEL
        value: "@preset/gk-free"
      - key: OPENROUTER_ANALYSIS_FALLBACK_MODEL
        value: z-ai/glm-5.3-flash
      - key: OPENROUTER_ANALYSIS_LAST_RESORT_MODEL
        value: google/gemini-3.1-flash-lite
      - key: MEDIA_STORAGE
        value: r2
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: HIGGSFIELD_API_KEY_GK
        sync: false
      # Free stock video (pexels.com/api) for mood shots without own footage (engine/edit/stock.py).
      - key: PEXELS_API_KEY
        sync: false
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HIGGSFIELD_API_SECRET
        sync: false
      - key: HIGGSFIELD_WEBHOOK_ENABLED
        value: "true"
      # Legacy split credential names remain accepted in code during migration,
      # but production should use only Golfkuponger's dedicated complete key above.
      - key: HIGGSFIELD_MAX_USD
        value: "2"
      # OAuth is hosted by this service and uses normal Content Engine users. No external IdP.
      - key: MCP_REQUIRED_SCOPE
        value: content-engine.operate
      - key: MCP_OAUTH_ALLOWED_CLIENT_HOSTS
        value: chatgpt.com,openai.com,connectors.api.openai.org
      # Cloud editing (engine/edit): the GitHub Actions renderer authenticates with this token (≥ 32 characters);
      # the same value is the GitHub secret CONTENT_EDIT_WORKER_TOKEN.
      - key: EDIT_WORKER_TOKEN
        sync: false
      # Fine-grained GitHub token (repo ulle73/content-engine, permission Actions: read and write) used to start
      # the Edit Render workflow. Without it jobs wait for the daily workflow or a manual run.
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: ulle73/content-engine
