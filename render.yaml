services:
  - type: web
    name: content-engine
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: POSTIZ_ENCRYPTION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: SETUP_TOKEN
        generateValue: true
      - key: MEDIA_STORAGE
        value: r2
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HIGGSFIELD_API_SECRET
        sync: false

  - type: web
    name: content-engine-mcp
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start-mcp.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      # IMPORTANT: set these to the same values used by content-engine.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: POSTIZ_ENCRYPTION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: APIFY_API_TOKEN
        sync: false
      - key: SCRAPER_DAILY_BUDGET_USD
        value: "1.00"
      - key: INTELLIGENCE_DAILY_ANALYSES
        value: "12"
      - key: MEDIA_STORAGE
        value: r2
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HIGGSFIELD_API_SECRET
        sync: false
      - key: HIGGSFIELD_MAX_USD
        value: "2"
      - key: MCP_AUTH_ISSUER
        sync: false
      - key: MCP_AUTH_AUDIENCE
        sync: false
      - key: MCP_AUTH_USER_CLAIM
        value: preferred_username
      - key: MCP_REQUIRED_SCOPE
        value: content-engine.operate
