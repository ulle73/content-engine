<!doctype html>
<!--
  LOCAL background painter for the "Midnight Bioluminescent" carousel style.
  Everything is drawn procedurally in canvas — no API, no model, no network.
  carousel_localbg.py injects __CONFIG__ (see that file for the knobs) and
  screenshots this page at 1080x1350 * RENDER_SCALE.

  The world it paints, per the style sheet:
    - void black field, edges falling off to black (nothing touches the frame)
    - light comes from INSIDE the scene: a vertical plume rising behind the flora
    - flora is silhouette + rim light, never fully exposed; it grows in clumps
    - amber only as tiny warm accents in the foreground flora
    - the top ~45% stays unbroken black for the headline
-->
<html>
<head><meta charset="utf-8">
<style>
  *{margin:0;padding:0}
  html,body{width:1080px;height:1350px;background:#08080A;overflow:hidden}
  canvas{display:block;width:1080px;height:1350px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// IIFE: the renderer reuses one page for every slide, so nothing may leak to globals.
(function(){
const CFG = __CONFIG__;

const W = 1080, H = 1350, S = CFG.scale || 2;
const TEAL  = [63, 191, 178];     // #3FBFB2 bioluminescent teal — light only, never paint
const AMBER = [233, 163, 60];     // #E9A33C ember amber — tiny foreground accents only
const FOG   = [124, 124, 130];    // #7C7C82 fog gray
const VOID  = '#08080A';

const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
ctx.scale(S, S);

/* ---------- seeded RNG (mulberry32) so a slide always paints identically ---------- */
let _s = (CFG.seed >>> 0) || 1;
function rnd(){
  _s |= 0; _s = _s + 0x6D2B79F5 | 0;
  let t = Math.imul(_s ^ _s >>> 15, 1 | _s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;      // ~[-1,1], centre-weighted
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (c1, c2, t) => [c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t];

/* offscreen layer helper — blur once at composite time instead of per-shape */
function layer(){
  const o = document.createElement('canvas');
  o.width = W * S; o.height = H * S;
  const c = o.getContext('2d');
  c.scale(S, S);
  return { o, c };
}
function compose(l, blurPx, alpha){
  ctx.save();
  if (blurPx) ctx.filter = `blur(${blurPx}px)`;
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.drawImage(l.o, 0, 0, W, H);
  ctx.restore();
}

const B  = CFG.bloom;                        // {x, y, r, intensity}
const bx = B.x * W, by = B.y * H, br = B.r * W;
const horizon = (CFG.horizon || 0.80) * H;

// how strongly a point is lit by the plume (0..1) — drives every rim highlight
function litness(x, y){
  const dx = (x - bx) / (br * 1.5);
  const dy = (y - by) / (br * 1.9);
  return clamp(1 - Math.hypot(dx, dy), 0, 1);
}
// rim colour: fog-white far from the light, teal inside it
function rimAt(x, y, boost){
  const l = litness(x, y);
  const col = mix(FOG, TEAL, clamp(l * 1.25, 0, 1));
  return rgba(col.map(Math.round), clamp((0.04 + 0.34 * l) * (boost || 1), 0, 0.7));
}
// a stem's rim is brightest where it stands in the light and dies out toward the tip
function rimGradient(c, x, baseY, tipY, boost){
  const l = litness(x, (baseY + tipY) / 2);
  const col = mix(FOG, TEAL, clamp(l * 1.25, 0, 1)).map(Math.round);
  const a = clamp((0.05 + 0.42 * l) * (boost || 1), 0, 0.72);
  const g = c.createLinearGradient(0, baseY, 0, tipY);
  g.addColorStop(0,    rgba(col, a * 0.30));   // rooted in shadow
  g.addColorStop(0.35, rgba(col, a));          // catching the plume
  g.addColorStop(1,    rgba(col, a * 0.12));   // tip dissolves into black
  return g;
}

/* ---------- 1. base field ---------- */
ctx.fillStyle = VOID;
ctx.fillRect(0, 0, W, H);

const base = ctx.createLinearGradient(0, H * 0.42, 0, H);
base.addColorStop(0, 'rgba(12,16,17,0)');
base.addColorStop(0.68, 'rgba(15,21,22,0.5)');
base.addColorStop(1, 'rgba(8,8,10,0.95)');
ctx.fillStyle = base;
ctx.fillRect(0, 0, W, H);

/* ---------- 2. the plume — light emitted from inside the scene ---------- */
ctx.globalCompositeOperation = 'lighter';

function plume(x, y, rx, ry, i, tint){
  ctx.save();
  ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0,    rgba(tint || TEAL, 0.20 * i));
  g.addColorStop(0.18, rgba(TEAL, 0.095 * i));
  g.addColorStop(0.45, rgba(TEAL, 0.032 * i));
  g.addColorStop(0.78, rgba(TEAL, 0.008 * i));
  g.addColorStop(1,    rgba(TEAL, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// wide, tall halo (a column of light, not a ball)
plume(bx, by, br * 1.15, br * 1.75, B.intensity);
// bright core, tight and low
plume(bx, by + br * 0.12, br * 0.34, br * 0.52, B.intensity * 1.25, [206, 248, 242]);

(CFG.blooms2 || []).forEach(b =>
  plume(b.x * W, b.y * H, b.r * W, b.r * W * 1.5, b.i * 0.85));

// soft mist drifting across the light
if (CFG.mist) {
  const ml = layer();
  for (let i = 0; i < CFG.mist; i++) {
    const my = by + rr(-0.16, 0.12) * H;
    const mw = rr(0.42, 0.95) * W, mh = rr(20, 62);
    ml.c.fillStyle = rgba(TEAL, rr(0.02, 0.055) * B.intensity);
    ml.c.beginPath();
    ml.c.ellipse(bx + rr(-0.32, 0.32) * W, my, mw / 2, mh / 2, rr(-0.04, 0.04), 0, Math.PI * 2);
    ml.c.fill();
  }
  compose(ml, 40);
}
ctx.globalCompositeOperation = 'source-over';

/* ---------- 3. starfield ---------- */
ctx.globalCompositeOperation = 'lighter';
for (let i = 0; i < (CFG.stars || 170); i++) {
  const y = Math.pow(rnd(), 1.7) * H * 0.74;
  const x = rnd() * W;
  const a = rr(0.12, 0.8) * (1 - litness(x, y) * 0.7);   // haze swallows stars near the light
  ctx.fillStyle = rnd() < 0.2 ? rgba(TEAL, a) : `rgba(255,255,255,${a})`;
  ctx.beginPath(); ctx.arc(x, y, rr(0.32, 1.35), 0, Math.PI * 2); ctx.fill();
}
for (let i = 0; i < (CFG.brightStars || 7); i++) {
  const x = rnd() * W, y = Math.pow(rnd(), 1.9) * H * 0.58;
  ctx.shadowColor = rnd() < 0.35 ? rgba(TEAL, 0.9) : 'rgba(255,255,255,0.9)';
  ctx.shadowBlur = rr(6, 15);
  ctx.fillStyle = `rgba(255,255,255,${rr(0.45, 0.9)})`;
  ctx.beginPath(); ctx.arc(x, y, rr(0.9, 1.7), 0, Math.PI * 2); ctx.fill();
}
ctx.shadowBlur = 0;
ctx.globalCompositeOperation = 'source-over';

/* ================= 4. FLORA — silhouette + rim light, grown in clumps ================= */

/* --- a curved, tapering stem; returns the tip so heads can sit on it --- */
function stem(c, x, baseY, h, bend, width, fill, rimA){
  const tipX = x + bend * h, tipY = baseY - h;
  const c1x = x + bend * h * 0.10, c1y = baseY - h * 0.42;
  const c2x = x + bend * h * 0.62, c2y = baseY - h * 0.80;
  c.beginPath();
  c.moveTo(x - width, baseY);
  c.bezierCurveTo(c1x - width * 0.7, c1y, c2x - width * 0.35, c2y, tipX, tipY);
  c.bezierCurveTo(c2x + width * 0.35, c2y, c1x + width * 0.7, c1y, x + width, baseY);
  c.closePath();
  c.fillStyle = fill; c.fill();
  if (rimA > 0.02) {                                  // rim only on the lit edge
    const side = tipX > bx ? 1 : -1;
    c.strokeStyle = rimGradient(c, x, baseY, tipY, rimA);
    c.lineWidth = 0.9;
    c.beginPath();
    c.moveTo(x + side * width * 0.75, baseY);
    c.bezierCurveTo(c1x + side * width * 0.6, c1y, c2x + side * width * 0.3, c2y, tipX, tipY);
    c.stroke();
  }
  return [tipX, tipY];
}

/* --- grass blade: a thin arcing leaf --- */
function blade(c, x, baseY, h, fill, rimA){
  stem(c, x, baseY, h, rr(-0.30, 0.30), rr(1.1, 2.8), fill, rimA * 0.8);
}

/* --- queen anne's lace: dome of fine spokes, each ending in a lace of florets --- */
function umbel(c, x, baseY, h, size, fill, rimA){
  const [tx, ty] = stem(c, x, baseY, h, rr(-0.14, 0.14), rr(1.2, 2.2), fill, rimA);
  const spokes = ri(16, 30);
  const lit = litness(tx, ty);
  for (let i = 0; i < spokes; i++) {
    const a = Math.PI + (i / (spokes - 1)) * Math.PI + rr(-0.06, 0.06);
    const len = size * rr(0.55, 1.0);
    const ex = tx + Math.cos(a) * len;
    const ey = ty + Math.sin(a) * len * 0.78 + len * 0.10;      // slight droop
    c.strokeStyle = fill; c.lineWidth = 0.85;
    c.beginPath();
    c.moveTo(tx, ty);
    c.quadraticCurveTo(tx + Math.cos(a) * len * 0.5, ty + Math.sin(a) * len * 0.34, ex, ey);
    c.stroke();
    // lace: a little cluster of florets at each spoke tip
    const n = ri(3, 7);
    for (let d = 0; d < n; d++) {
      const fx = ex + gauss() * size * 0.16, fy = ey + gauss() * size * 0.16;
      c.fillStyle = rgba(mix(FOG, TEAL, clamp(lit * 1.3, 0, 1)).map(Math.round),
                         clamp((0.10 + 0.55 * lit) * rr(0.45, 1) * (rimA || 0.5), 0, 0.9));
      c.beginPath(); c.arc(fx, fy, rr(0.45, 1.05), 0, Math.PI * 2); c.fill();
    }
  }
}

/* --- dandelion clock: hundreds of fine filaments, so it reads as a sphere of light --- */
function dandelion(c, x, baseY, h, size, fill, rimA){
  const [tx, ty] = stem(c, x, baseY, h, rr(-0.08, 0.08), rr(1.4, 2.4), fill, rimA);
  const lit = litness(tx, ty);
  const glow = clamp(0.25 + lit, 0, 1);

  // the puff catches the plume
  ctx.save();
  c.globalCompositeOperation = 'lighter';
  const gg = c.createRadialGradient(tx, ty, 0, tx, ty, size * 1.6);
  gg.addColorStop(0, rgba(TEAL, 0.10 * glow));
  gg.addColorStop(1, rgba(TEAL, 0));
  c.fillStyle = gg;
  c.fillRect(tx - size * 1.7, ty - size * 1.7, size * 3.4, size * 3.4);
  c.globalCompositeOperation = 'source-over';
  ctx.restore();

  // filament count scales with the head, so a big hero puff stays a sphere, not a firework
  const n = Math.round(clamp(size * 4.2, 120, 460));
  const toLight = Math.atan2(by - ty, bx - tx);
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2;
    const len = size * (0.58 + Math.pow(rnd(), 0.4) * 0.42);
    const curl = rr(-0.16, 0.16);                                  // filaments bow slightly
    const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len;
    const mx = tx + Math.cos(a + curl) * len * 0.55;
    const my = ty + Math.sin(a + curl) * len * 0.55;
    const face = 0.42 + 0.58 * Math.cos(a - toLight);              // brighter facing the light
    const col = mix(FOG, [225, 252, 248], clamp(lit, 0, 1)).map(Math.round);
    c.strokeStyle = rgba(col, clamp(0.035 + 0.26 * face * glow, 0, 0.7));
    c.lineWidth = rr(0.4, 0.62);
    c.beginPath();
    c.moveTo(tx + Math.cos(a) * size * 0.05, ty + Math.sin(a) * size * 0.05);
    c.quadraticCurveTo(mx, my, ex, ey);
    c.stroke();
    if (rnd() < 0.5) {                                             // seed tips
      c.fillStyle = rgba(col, clamp(0.08 + 0.4 * face * glow, 0, 0.8));
      c.beginPath(); c.arc(ex, ey, rr(0.45, 0.8), 0, Math.PI * 2); c.fill();
    }
  }
}

/* --- grass seed spike: a slim head of grains, mostly silhouette with a lit edge --- */
function spike(c, x, baseY, h, fill, rimA){
  const [tx, ty] = stem(c, x, baseY, h, rr(-0.24, 0.24), rr(1.0, 1.8), fill, rimA);
  const len = rr(24, 46), lit = litness(tx, ty);
  const n = ri(12, 20);
  for (let i = 0; i < n; i++) {
    const t = i / n;
    const px = tx + gauss() * 3.4, py = ty + t * len;
    // silhouette grain first...
    c.fillStyle = fill;
    c.beginPath(); c.ellipse(px, py, rr(1.0, 1.9), rr(2.4, 4.6), rr(-0.35, 0.35), 0, Math.PI * 2);
    c.fill();
    // ...then a thin lit edge on the side facing the plume
    c.strokeStyle = rgba(mix(FOG, TEAL, clamp(lit * 1.2, 0, 1)).map(Math.round),
                         clamp((0.04 + 0.22 * lit) * rr(0.35, 1) * (1 - t * 0.5), 0, 0.45));
    c.lineWidth = 0.7;
    c.beginPath();
    c.ellipse(px + (tx > bx ? 0.8 : -0.8), py, rr(0.9, 1.6), rr(2.2, 4.2), 0, 0, Math.PI * 2);
    c.stroke();
  }
}

/* --- tiny warm floret: the only amber in the system --- */
function amberFloret(c, x, baseY, h, fill){
  const [tx, ty] = stem(c, x, baseY, h, rr(-0.2, 0.2), rr(1.1, 1.9), fill, 0.12);
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.shadowColor = rgba(AMBER, 0.85); c.shadowBlur = 10;
  for (let i = 0; i < ri(5, 9); i++) {
    c.fillStyle = rgba(AMBER, rr(0.35, 0.85));
    c.beginPath();
    c.arc(tx + gauss() * 5.5, ty + gauss() * 5.5, rr(1.0, 2.3), 0, Math.PI * 2);
    c.fill();
  }
  c.restore();
}

const SPECIES = { blade, umbel, dandelion, spike };

/* --- grow a layer: clumps of mixed species along the horizon --- */
function growLayer(o){
  const l = layer();
  const clumps = o.clumps || 6;
  for (let k = 0; k < clumps; k++) {
    const cxp = (k + rr(0.15, 0.85)) / clumps;                  // spread, not evenly spaced
    const cx = cxp * (W + 200) - 100;
    const spread = rr(0.06, 0.16) * W;
    const n = Math.round(rr(o.perClump[0], o.perClump[1]));
    for (let i = 0; i < n; i++) {
      const x = cx + gauss() * spread;
      const baseY = horizon + rr(0, o.baseJitter) + (o.drop || 0);
      const h = rr(o.hMin, o.hMax) * (0.75 + 0.45 * (1 - Math.abs(gauss())));
      const fn = SPECIES[pick(o.species)];
      fn(l.c, x, baseY, h, o.headSize ? rr(o.headSize[0], o.headSize[1]) : 0,
         o.fill, o.rim);
    }
  }
  return l;
}
// every species fn takes (c, x, baseY, h, size, fill, rim); blade/spike ignore `size`
const F = CFG.flora;

/* far layer — small, hazy, lifted off black */
compose(growLayer({
  clumps: 7, perClump: [3, 6], hMin: H * 0.05, hMax: H * 0.12,
  fill: 'rgba(24,31,33,0.95)', rim: 0.22, baseJitter: 34, drop: -18,
  headSize: [10, 20], species: ['blade', 'blade', 'umbel', 'spike']
}), 3.4, 0.9);

/* mid layer — the hero silhouettes, rim-lit by the plume */
compose(growLayer({
  clumps: Math.max(4, Math.round(6 * F.density)), perClump: [4, 9],
  hMin: H * 0.11, hMax: H * 0.30 * F.height,
  fill: 'rgba(8,10,11,1)', rim: 0.85, baseJitter: 62,
  headSize: [16, 34], species: ['blade', 'umbel', 'blade', 'spike', 'umbel', 'dandelion']
}), 0, 1);

/* hero flora — one or two tall specimens, deliberately placed */
(CFG.heroFlora || []).forEach(hf => {
  const l = layer();
  const baseY = horizon + rr(10, 50);
  (SPECIES[hf.type] || umbel)(l.c, hf.x * W, baseY, hf.h * H, hf.size * W,
                              'rgba(6,8,9,1)', 0.95);
  compose(l, hf.blur || 0, 1);
});

/* thicket — a dense band of short grass so the base of the frame is alive */
compose(growLayer({
  clumps: 12, perClump: [12, 22], hMin: H * 0.04, hMax: H * 0.15,
  fill: 'rgba(5,7,8,1)', rim: 0.34, baseJitter: 110, drop: 40,
  headSize: [8, 16], species: ['blade', 'blade', 'blade', 'blade', 'spike']
}), 1.1, 1);

/* amber accents — tiny, warm, foreground only */
if (CFG.amber) {
  const l = layer();
  for (let i = 0; i < CFG.amber; i++)
    amberFloret(l.c, rr(0.05, 0.95) * W, horizon + rr(70, 200),
                rr(H * 0.05, H * 0.14), 'rgba(6,8,9,1)');
  compose(l, 0.6, 1);
}

/* near layer — pure black, out of focus: the foreground bokeh of the sheet */
compose(growLayer({
  clumps: 5, perClump: [3, 7], hMin: H * 0.16, hMax: H * 0.36,
  fill: 'rgba(3,4,5,1)', rim: 0, baseJitter: 150, drop: 120,
  headSize: [18, 36], species: ['blade', 'umbel', 'blade']
}), 8, 0.95);

/* ---------- 5. spores drifting in the light ---------- */
ctx.globalCompositeOperation = 'lighter';
for (let i = 0; i < (CFG.spores || 26); i++) {
  const a0 = rnd() * Math.PI * 2, d = Math.pow(rnd(), 0.55) * br * 1.15;
  const x = bx + Math.cos(a0) * d, y = by + Math.sin(a0) * d * 0.85 - rr(0, 120);
  ctx.shadowColor = rgba(TEAL, 0.9); ctx.shadowBlur = rr(5, 13);
  ctx.fillStyle = rgba([205, 250, 245], rr(0.18, 0.7));
  ctx.beginPath(); ctx.arc(x, y, rr(0.7, 1.7), 0, Math.PI * 2); ctx.fill();
}
ctx.shadowBlur = 0;
ctx.globalCompositeOperation = 'source-over';

/* ---------- 6. hold the top black for the headline ---------- */
const tg = CFG.topGuard || 0.44;
const topMask = ctx.createLinearGradient(0, 0, 0, H * tg);
topMask.addColorStop(0, 'rgba(8,8,10,0.94)');
topMask.addColorStop(0.5, 'rgba(8,8,10,0.55)');
topMask.addColorStop(1, 'rgba(8,8,10,0)');
ctx.fillStyle = topMask;
ctx.fillRect(0, 0, W, H * tg);

/* ---------- 7. vignette — nothing touches the frame ---------- */
const vg = ctx.createRadialGradient(bx, by, br * 0.20, bx, by, W * 1.02);
vg.addColorStop(0, 'rgba(8,8,10,0)');
vg.addColorStop(0.42, 'rgba(8,8,10,0.10)');
vg.addColorStop(0.70, 'rgba(8,8,10,0.52)');
vg.addColorStop(1, 'rgba(8,8,10,0.96)');
ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

[['t', H * 0.10], ['b', H * 0.14], ['l', W * 0.16], ['r', W * 0.16]].forEach(([side, len]) => {
  let lg;
  if (side === 't') lg = ctx.createLinearGradient(0, 0, 0, len);
  if (side === 'b') lg = ctx.createLinearGradient(0, H, 0, H - len);
  if (side === 'l') lg = ctx.createLinearGradient(0, 0, len, 0);
  if (side === 'r') lg = ctx.createLinearGradient(W, 0, W - len, 0);
  lg.addColorStop(0, 'rgba(8,8,10,0.92)');
  lg.addColorStop(0.5, 'rgba(8,8,10,0.35)');
  lg.addColorStop(1, 'rgba(8,8,10,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
});

/* ---------- 8. film grain ---------- */
(function grain(){
  const gw = 380, gh = 475;
  const off = document.createElement('canvas');
  off.width = gw; off.height = gh;
  const octx = off.getContext('2d');
  const id = octx.createImageData(gw, gh);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 112 + Math.floor(rnd() * 84);
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = 255;
  }
  octx.putImageData(id, 0, 0);
  ctx.globalAlpha = CFG.grain != null ? CFG.grain : 0.05;
  ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(off, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
})();

document.body.dataset.done = '1';
})();
</script>
</body>
</html>
