<!-- ============================================================================
  BRICK: article-highlight (16:9)  ·  a REAL browser SCREENSHOT of an article,
  presented as a browser page, with a yellow highlighter that sweeps the ACTUAL
  words in sync with the voice.

  WHEN: he references something with a source — headline, stat, quote, claim.
  Show the genuine page and highlight the real words as he says them.

  ⇄ 16:9 DIFFERENCE FROM THE SHORT: a 9:16 frame takes a full-bleed vertical
  scroll. A 1920x1080 frame does NOT — a full-width article screenshot is a wall
  of 14px text nobody can read. Present it as a CENTRED READING COLUMN (1100px)
  on the dark background, inside browser chrome. That is the readable form here.

  HOW TO BUILD (screenshot-based — never re-typeset the text)
  1. Chrome headless at a 16:9-ish window, scrolled to the BODY:
       "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new \
         --disable-gpu --hide-scrollbars --window-size=1600,900 \
         --virtual-time-budget=9000 --screenshot=out.png "URL"
     Crop to the paragraph block. Real words only.
  2. Downscale so the BODY TEXT lands at >= 22px in the 1920 frame. If it does
     not, re-shoot with browser zoom at 150-175% — do not scale a small
     screenshot up, it goes to mush.
  3. For each phrase, add a <div class="hl"> positioned in PERCENT of the
     screenshot (left/top/width/height %). Snapshot and NUDGE the %s until each
     rect hugs its phrase. Expect 1-2 nudge passes — do them.
  4. Animate each rect scaleX 0->1 (left origin) = the marker drawing across.
     Anchor t to the TIGHT-TRANSCRIPT word onset (never ahead); duration =
     spoken length. Scatter 4-6 highlights — fewer than the short's 5-8, because
     a 16:9 column shows less text at a readable size.
  5. Highlighter = semi-transparent yellow with mix-blend-mode:multiply, so it
     reads like a real pen on the page.
  6. This is a full-frame B-Roll takeover: no camera. Captions, if on, drop to a
     scrim at the bottom and must NEVER overlay the column.

  RULES: real screenshot + real words only, never re-typed or invented. No emojis.
  Verify the screenshot actually rendered content — login-walled and JS-heavy
  pages come back blank and ship as an empty panel.
============================================================================ -->
<style>
  #ah{position:absolute;inset:0;z-index:20}
  /* the reading column, centred on the dark grid */
  .page{position:absolute;left:410px;top:0;width:1100px;background:#fff;
    box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .chrome{position:relative;height:74px;background:#e9e6df;display:flex;align-items:center;
    gap:12px;padding:0 26px;border-bottom:1px solid #d7d2c8}
  .chrome .dot{width:15px;height:15px;border-radius:50%;background:#cfc9bd}
  .chrome .dot.r{background:#E0655A}.chrome .dot.y{background:#E7B23C}.chrome .dot.g{background:#5FB07A}
  .chrome .url{margin-left:16px;flex:1;background:#fff;border-radius:14px;padding:11px 22px;
    font-family:var(--font-mono);font-size:var(--t-label);color:#6b6660;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chrome .url b{color:#191817}
  .doc{position:relative;width:1100px}
  .doc img{display:block;width:1100px}
  /* highlighter overlay — % of the screenshot, over the real words */
  .hl{position:absolute;background:#F7E23C;opacity:.62;border-radius:4px;
    transform:scaleX(0);transform-origin:left center;mix-blend-mode:multiply}
</style>

<!-- markup (swap in the REAL body screenshot + its real URL; set each .hl over its phrase) -->
<div id="ah">
  <div class="page" id="page">
    <div class="chrome">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="url"><b>engadget.com</b>/openai-admits-models-hacked-hugging-face</span>
    </div>
    <div class="doc" id="doc">
      <img src="../assets/broll/engadget-body.png" alt=""/>
      <div class="hl" id="h1" style="left:43%;top:0.5%;width:14%;height:4.4%"></div>
      <div class="hl" id="h2" style="left:36%;top:11%;width:55%;height:4.4%"></div>
      <div class="hl" id="h3" style="left:29.5%;top:22.8%;width:38%;height:4.4%"></div>
      <!-- …scatter 4-6 across the paragraphs… -->
    </div>
  </div>
</div>

<script>
// The page arrives with a slow drift so it is never a frozen screenshot held for 8s.
// Transforms only — the page NEVER animates top/left/width/height.
tl.fromTo("#ah .page", {opacity:0, y:40, scale:1.00},
                       {opacity:1, y:0,  duration:.6, ease:"power3.out"}, IN);
tl.to("#ah .page", {y:-140, scale:1.03, duration:OUT-IN, ease:"none"}, IN);   // Ken-Burns scroll

// highlighter sweep — the marker draws across the real words on the beat.
// t = TIGHT-transcript word onset (segment time); d = spoken duration of the phrase.
const sweep=(id,t,d)=>tl.fromTo("#"+id,{scaleX:0},
    {scaleX:1,duration:d,ease:"power2.inOut"},t);
// e.g.  sweep('h1', 8.90, 0.45);  sweep('h2', 9.60, 1.10);  sweep('h3', 11.20, 0.80);

tl.to("#ah .page", {opacity:0, y:-40, duration:.38, ease:"power2.in"}, OUT);
</script>

<!-- SFX: camera-shutter on the page cut-in · magic-reveal (0.10) on the FIRST sweep ·
     a soft pop (0.09) on each subsequent sweep · swoosh on the exit. -->
