<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>claude-new-chat</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*  claude-new-chat — the Claude.ai new-chat screen, rebuilt as DOM so the camera can
    push into it without going soft. 1080x1920. One master cycle, --T.

    The move:
      1  camera pushed in 2.6x on the LEFT of the composer; the line types under it
      2  camera pans right, tracking the caret to the end of the URL
      3  camera pulls out to the whole screen — the lockup writes itself on
         (asterisk spins in, "Claude" wipes open), then the chips stagger in

    Every phase is a percentage of --T, so re-timing to a word onset is one number.

    CSS gotcha this block was built around: a property mentioned in only ONE keyframe
    interpolates across the WHOLE cycle, not from the previous keyframe. Every opacity
    below is therefore declared at each stop — otherwise the wordmark fades out from
    the first frame instead of holding, which is exactly what it did first time.        */
:root{
  --T:6s;
  --paper:#F0EDE4;  
  --ink:#141413; --muted:#8C8A85; --line:#E3E1DB;
  --coral:#D97757; --link:#2C6BD4;
  --serif:"Fraunces",Georgia,serif; --ui:"Inter",-apple-system,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --lineW:812px;      /* measured: the prompt at 30px Inter is 810px wide */
  --wmW:309px;        /* measured: "Claude" at 110px Fraunces 600 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{
  background:var(--paper);
  font-family:var(--ui);
}

/* ── the camera ─────────────────────────────────────────────────────────
   translate() before scale() so offsets stay in stage pixels.
   To centre stage-point p at scale S:  tx = -(p - 540) * S                 */
#cam{position:absolute;inset:0;transform-origin:540px 960px;
  animation:camera var(--T) var(--ease) infinite both}
/* Per-keyframe timing matters here. The pan has to be LINEAR because the line types on
   a linear steps() clock — with the block's usual front-loaded ease the camera outran the
   caret and spent the middle of the shot staring at blank card. Ease returns for the pull-out. */
@keyframes camera{
  0%,4%{transform:translate( 624px,-172px) scale(2.6); animation-timing-function:linear}
  46%  {transform:translate(-728px,-172px) scale(2.6); animation-timing-function:var(--ease)}
  70%  {transform:translate(0,0) scale(1)}               /* pull out, full UI */
  93%  {transform:translate(0,0) scale(1)}
  100% {transform:translate(0,0) scale(1.04)}            /* settle out        */
}

/* ── the lockup ─────────────────────────────────────────────────────── */
#lock{position:absolute;left:0;right:0;top:775px;height:130px;
  display:flex;align-items:center;justify-content:center;gap:22px}
#lock .mark{width:96px;height:96px;flex:none;
  animation:markIn var(--T) var(--ease) infinite both}
#lock .mark img{width:100%;height:100%;display:block}
@keyframes markIn{
  0%,62%{opacity:0;transform:scale(.3) rotate(-120deg)}
  72%   {opacity:1;transform:scale(1) rotate(0)}
  93%   {opacity:1;transform:scale(1) rotate(0)}
  100%  {opacity:0;transform:scale(1) rotate(0)}}
/* the wordmark writes itself on rather than appearing */
#lock .wm{font-family:var(--serif);font-weight:600;font-size:110px;color:var(--ink);
  letter-spacing:-.01em;line-height:1.18;white-space:nowrap;overflow:hidden;width:0;
  animation:writeOn var(--T) var(--ease) infinite both}
@keyframes writeOn{
  0%,66%{width:0;opacity:1}
  80%   {width:var(--wmW);opacity:1}
  93%   {width:var(--wmW);opacity:1}
  100%  {width:var(--wmW);opacity:0}}

/* ── the composer ───────────────────────────────────────────────────── */
#composer{position:absolute;left:100px;top:960px;width:880px;height:360px;
  background:#fff;border-radius:32px;
  box-shadow:0 2px 3px rgba(20,20,19,.05),0 18px 44px rgba(20,20,19,.07)}
#line{position:absolute;left:34px;top:44px;height:46px;
  font-size:30px;line-height:46px;color:var(--link);white-space:nowrap;overflow:hidden;
  width:0;animation:typeOn var(--T) steps(46,end) infinite both}
#line .cmd{font-weight:600}
/* the line types while the camera tracks it — same 4%→46% window */
@keyframes typeOn{0%,4%{width:0} 46%,100%{width:var(--lineW)}}
/* outer moves + fades, inner blinks — two animations on one opacity would collide */
#caret{position:absolute;top:46px;width:3px;height:42px;
  animation:caretMove var(--T) steps(46,end) infinite both}
#caret i{display:block;width:100%;height:100%;background:var(--link);
  animation:blink .9s steps(1) infinite}
@keyframes caretMove{
  0%,4%{left:34px;opacity:1} 46%{left:846px;opacity:1}
  52%,100%{left:846px;opacity:0}}
@keyframes blink{50%{opacity:0}}

#bar{position:absolute;left:34px;right:34px;bottom:38px;height:56px;
  display:flex;align-items:center;justify-content:space-between}
#bar .plus{width:46px;height:46px;position:relative}
#bar .plus:before,#bar .plus:after{content:"";position:absolute;background:#5B5955;border-radius:2px}
#bar .plus:before{left:9px;right:9px;top:22px;height:3px}
#bar .plus:after{top:9px;bottom:9px;left:22px;width:3px}
#bar .right{display:flex;align-items:center;gap:22px}
#bar .model{font-size:29px;font-weight:500;color:#3D3B37;display:flex;align-items:center;gap:10px}
#bar .model i{font-style:normal;color:var(--muted);font-size:22px}
#bar .wave{display:flex;align-items:flex-end;gap:3px;height:32px}
#bar .wave b{width:3px;background:#5B5955;border-radius:2px;transform-origin:50% 100%;
  animation:wave 1.1s ease-in-out infinite}
#bar .wave b:nth-child(1){height:11px;animation-delay:0s}
#bar .wave b:nth-child(2){height:23px;animation-delay:.12s}
#bar .wave b:nth-child(3){height:32px;animation-delay:.24s}
#bar .wave b:nth-child(4){height:19px;animation-delay:.36s}
#bar .wave b:nth-child(5){height:9px;animation-delay:.48s}
@keyframes wave{50%{transform:scaleY(.42)}}

/* ── the suggestion chips ───────────────────────────────────────────── */
#chips{position:absolute;left:0;right:0;top:1372px;
  display:flex;align-items:center;justify-content:center;gap:15px}
#chips span{display:inline-flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 19px;
  font-size:27px;font-weight:500;color:#3D3B37;white-space:nowrap;
  animation:chipIn var(--T) var(--ease) infinite both}
#chips span svg{width:27px;height:27px;fill:none;stroke:#6B6963;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
#chips span:nth-child(2){animation-delay:calc(var(--T) * .015)}
#chips span:nth-child(3){animation-delay:calc(var(--T) * .03)}
#chips span:nth-child(4){animation-delay:calc(var(--T) * .045)}
#chips span:nth-child(5){animation-delay:calc(var(--T) * .06)}
@keyframes chipIn{
  0%,74%{opacity:0;transform:translateY(16px)}
  82%   {opacity:1;transform:translateY(0)}
  93%   {opacity:1;transform:translateY(0)}
  100%  {opacity:0;transform:translateY(0)}}
</style>
</head>
<body>
<div id="cam">

  <div id="lock">
    <span class="mark"><img src="../brand/claude.svg" alt=""></span>
    <span class="wm">Claude</span>
  </div>

  <div id="composer">
    <div id="line"><span class="cmd">/analyze</span> https://www.instagram.com/reel/DZZ-Lj6uwM5/</div>
    <div id="caret"><i></i></div>
    <div id="bar">
      <span class="plus"></span>
      <span class="right">
        <span class="model">Opus 4.8 <i>&#9662;</i></span>
        <span class="wave"><b></b><b></b><b></b><b></b><b></b></span>
      </span>
    </div>
  </div>

  <div id="chips">
    <span><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Write</span>
    <span><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 6-8"/><path d="M18 7h3v3"/></svg>Strategize</span>
    <span><svg viewBox="0 0 24 24"><path d="M12 4 2 9l10 5 10-5-10-5Z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg>Learn</span>
    <span><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M15 7l5 5-5 5"/></svg>Code</span>
    <span><svg viewBox="0 0 24 24"><path d="M4 8h13v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"/><path d="M17 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M7 3v2M11 3v2"/></svg>Life stuff</span>
  </div>

</div>
<script>
/* ?seek=<seconds> — pause every animation at one instant. Lets a headless shot land on
   the settled frame instead of wherever the 6s loop happened to be. */
(() => {
  const s = new URLSearchParams(location.search).get("seek");
  if (s === null) return;
  const go = () => document.getAnimations().forEach(a => { a.pause(); a.currentTime = parseFloat(s) * 1000; });
  requestAnimationFrame(() => requestAnimationFrame(() => { go(); setTimeout(go, 250); }));
})();
</script>
</body>
</html>
