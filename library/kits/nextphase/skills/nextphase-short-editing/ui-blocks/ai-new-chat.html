<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>ai-new-chat</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*  ai-new-chat — one block, every assistant's new-chat screen, with the camera move.
    1080x1920.  ?brand=claude|chatgpt|gemini|grok|perplexity   ?plate=on|none

    The move (identical for every brand, so the cut feels like one system):
      1  camera pushed in 2.6x on the LEFT of the composer; the line types under it
      2  camera pans right, tracking the caret to the end of the prompt
      3  camera pulls out to the whole screen — the lockup writes itself on
         (mark spins in, wordmark wipes open), then the chips stagger in

    plate=none drops the page background so the block can float over a cutout
    (the Transparent Background layout). Everything else is unchanged.

    Two CSS traps this is built around, both of which silently ruin the shot:
      · a property named in only ONE keyframe interpolates across the WHOLE cycle —
        so every opacity is declared at each stop, or the wordmark fades from frame one.
      · the pan must be LINEAR to track a steps() type-on. With an ease the camera
        outruns the caret and the middle of the shot is blank card.                      */
:root{
  --T:6s;
  --ease:cubic-bezier(.16,1,.3,1);
  --serif:"Fraunces",Georgia,serif;
  --ui:"Inter",-apple-system,sans-serif;
  /* per-brand, set by script */
  --paper:#F0EDE4; --grid-minor:rgba(25,24,23,.09); --grid-major:rgba(25,24,23,.17); --ink:#141413; --muted:#8C8A85;
  --line:#E3E1DB; --link:#2C6BD4; --card:#fff; --cardR:32px; --chipBg:#fff;
  --wmFont:var(--serif); --wmSize:110px; --wmWeight:600;
  --lineW:812px; --wmW:309px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--paper);font-family:var(--ui)}
body.grid{/* grid retired 2026-08-10 — flat cream only */}
body.bare{background:transparent}
body.bare.grid{background-image:none}

/* ── the camera ─────────────────────────────────────────────────────────
   translate() before scale() so offsets stay in stage pixels.
   To centre stage-point p at scale S:  tx = -(p - 540) * S                 */
#cam{position:absolute;inset:0;transform-origin:540px 960px;
  animation:camera var(--T) var(--ease) infinite both}
@keyframes camera{
  0%,4%{transform:translate( 624px,-172px) scale(2.6); animation-timing-function:linear}
  46%  {transform:translate(-728px,-172px) scale(2.6); animation-timing-function:var(--ease)}
  70%  {transform:translate(0,0) scale(1)}
  93%  {transform:translate(0,0) scale(1)}
  100% {transform:translate(0,0) scale(1.04)}
}

/* ── the lockup ─────────────────────────────────────────────────────── */
#lock{position:absolute;left:0;right:0;top:775px;height:130px;
  display:flex;align-items:center;justify-content:center;gap:22px}
#lock .mark{width:96px;height:96px;flex:none;
  animation:markIn var(--T) var(--ease) infinite both}
#lock .mark img{width:100%;height:100%;display:block;object-fit:contain}
@keyframes markIn{
  0%,62%{opacity:0;transform:scale(.3) rotate(-120deg)}
  72%   {opacity:1;transform:scale(1) rotate(0)}
  93%   {opacity:1;transform:scale(1) rotate(0)}
  100%  {opacity:0;transform:scale(1) rotate(0)}}
#lock .wm{font-family:var(--wmFont);font-weight:var(--wmWeight);font-size:var(--wmSize);
  color:var(--ink);letter-spacing:-.015em;line-height:1.18;white-space:nowrap;
  overflow:hidden;width:0;animation:writeOn var(--T) var(--ease) infinite both}
@keyframes writeOn{
  0%,66%{width:0;opacity:1}
  80%   {width:var(--wmW);opacity:1}
  93%   {width:var(--wmW);opacity:1}
  100%  {width:var(--wmW);opacity:0}}

/* ── the composer ───────────────────────────────────────────────────── */
#composer{position:absolute;left:100px;top:960px;width:880px;height:360px;
  background:var(--card);border-radius:var(--cardR);border:1px solid var(--line);
  box-shadow:0 2px 3px rgba(20,20,19,.05),0 18px 44px rgba(20,20,19,.07)}
#line{position:absolute;left:34px;top:44px;height:46px;
  font-size:30px;line-height:46px;color:var(--link);white-space:nowrap;overflow:hidden;
  width:0;animation:typeOn var(--T) steps(46,end) infinite both}
#line .cmd{font-weight:600}
@keyframes typeOn{0%,4%{width:0} 46%,100%{width:var(--lineW)}}
#caret{position:absolute;top:46px;width:3px;height:42px;
  animation:caretMove var(--T) steps(46,end) infinite both}
#caret i{display:block;width:100%;height:100%;background:var(--link);
  animation:blink .9s steps(1) infinite}
@keyframes caretMove{
  0%,4%{left:34px;opacity:1} 46%{left:846px;opacity:1} 52%,100%{left:846px;opacity:0}}
@keyframes blink{50%{opacity:0}}

#bar{position:absolute;left:34px;right:34px;bottom:38px;height:56px;
  display:flex;align-items:center;justify-content:space-between}
#bar .plus{width:46px;height:46px;position:relative}
#bar .plus:before,#bar .plus:after{content:"";position:absolute;background:var(--muted);border-radius:2px}
#bar .plus:before{left:9px;right:9px;top:22px;height:3px}
#bar .plus:after{top:9px;bottom:9px;left:22px;width:3px}
#bar .right{display:flex;align-items:center;gap:22px}
#bar .model{font-size:29px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:10px}
#bar .model i{font-style:normal;color:var(--muted);font-size:22px}
#bar .wave{display:flex;align-items:flex-end;gap:3px;height:32px}
#bar .wave b{width:3px;background:var(--muted);border-radius:2px;transform-origin:50% 100%;
  animation:wave 1.1s ease-in-out infinite}
#bar .wave b:nth-child(1){height:11px;animation-delay:0s}
#bar .wave b:nth-child(2){height:23px;animation-delay:.12s}
#bar .wave b:nth-child(3){height:32px;animation-delay:.24s}
#bar .wave b:nth-child(4){height:19px;animation-delay:.36s}
#bar .wave b:nth-child(5){height:9px;animation-delay:.48s}
@keyframes wave{50%{transform:scaleY(.42)}}

/* ── the suggestion chips ───────────────────────────────────────────── */
#chips{position:absolute;left:0;right:0;top:1372px;
  display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;padding:0 40px}
#chips span{display:inline-flex;align-items:center;gap:10px;
  background:var(--chipBg);border:1px solid var(--line);border-radius:13px;padding:13px 19px;
  font-size:27px;font-weight:500;color:var(--ink);white-space:nowrap;
  animation:chipIn var(--T) var(--ease) infinite both}
#chips span svg{width:27px;height:27px;fill:none;stroke:var(--muted);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
#chips span:nth-child(2){animation-delay:calc(var(--T) * .015)}
#chips span:nth-child(3){animation-delay:calc(var(--T) * .03)}
#chips span:nth-child(4){animation-delay:calc(var(--T) * .045)}
#chips span:nth-child(5){animation-delay:calc(var(--T) * .06)}
@keyframes chipIn{
  0%,74%{opacity:0;transform:translateY(16px)}
  82%   {opacity:1;transform:translateY(0)}
  93%   {opacity:1;transform:translateY(0)}
  100%  {opacity:0;transform:translateY(0)}}
</style>
</head>
<body>
<div id="cam">
  <div id="lock"><span class="mark"><img id="markimg" alt=""></span><span class="wm" id="wm"></span></div>
  <div id="composer">
    <div id="line"></div>
    <div id="caret"><i></i></div>
    <div id="bar">
      <span class="plus"></span>
      <span class="right">
        <span class="model"><span id="model"></span> <i>&#9662;</i></span>
        <span class="wave"><b></b><b></b><b></b><b></b><b></b></span>
      </span>
    </div>
  </div>
  <div id="chips"></div>
</div>

<script>
/*  MODEL NAMES AND CHIP LABELS ARE PLACEHOLDERS.
    They are what each product showed when this was written; they change often and they
    appear on screen as fact. Check them against the live product before you publish.   */
const ICON = {
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  chart :'<path d="M3 17l5-6 4 4 6-8"/><path d="M18 7h3v3"/>',
  cap   :'<path d="M12 4 2 9l10 5 10-5-10-5Z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
  code  :'<path d="M9 7 4 12l5 5"/><path d="M15 7l5 5-5 5"/>',
  mug   :'<path d="M4 8h13v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"/><path d="M17 9h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M7 3v2M11 3v2"/>',
  image :'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  spark :'<path d="M12 3v6M12 15v6M3 12h6M15 12h6"/><path d="m6.5 6.5 3 3M14.5 14.5l3 3M17.5 6.5l-3 3M9.5 14.5l-3 3"/>',
  doc   :'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 13h6M10 17h4"/>',
  bolt  :'<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>',
};
const BRANDS = {
  claude:{
    wm:"Claude", mark:"../brand/claude.svg", wmFont:'var(--serif)', wmSize:"110px", wmWeight:600, wmW:"309px",
    paper:"#F0EDE4", grid:false, ink:"#141413", muted:"#8C8A85", line:"#E3E1DB",
    link:"#2C6BD4", card:"#fff", cardR:"32px", chipBg:"#fff",
    model:"Opus 4.8",
    prompt:['/analyze','https://www.instagram.com/reel/DZZ-Lj6uwM5/'],
    chips:[["pencil","Write"],["chart","Strategize"],["cap","Learn"],["code","Code"],["mug","Life stuff"]],
  },
  chatgpt:{
    wm:"ChatGPT", mark:"../brand/ChatGPT_logo.svg", wmFont:'var(--ui)', wmSize:"96px", wmWeight:600, wmW:"420px",
    paper:"#FFFFFF", grid:false, ink:"#0D0D0D", muted:"#8F8F8F", line:"#E5E5E5",
    link:"#0D0D0D", card:"#F4F4F4", cardR:"30px", chipBg:"#fff",
    model:"GPT-5.2",
    prompt:['','summarise this reel and pull the hook out'],
    chips:[["image","Create image"],["doc","Summarize text"],["chart","Analyze data"],["pencil","Help me write"]],
  },
  gemini:{
    wm:"Gemini", mark:"../brand/si-googlegemini.svg", wmFont:'var(--ui)', wmSize:"100px", wmWeight:500, wmW:"336px",
    paper:"#FFFFFF", grid:false, ink:"#1F1F1F", muted:"#8A8A8A", line:"#E4E7EC",
    link:"#1F1F1F", card:"#F0F4F9", cardR:"30px", chipBg:"#fff",
    model:"2.5 Pro",
    prompt:['','turn this thread into a one-page brief'],
    chips:[["search","Deep Research"],["doc","Canvas"],["image","Image"],["bolt","Video"]],
  },
  grok:{
    wm:"Grok", mark:"../brand/si-x-white.svg", wmFont:'var(--ui)', wmSize:"104px", wmWeight:700, wmW:"236px",
    paper:"#0B0B0B", grid:false, ink:"#F5F5F5", muted:"#8A8A8A", line:"#242424",
    link:"#F5F5F5", card:"#161616", cardR:"30px", chipBg:"#161616",
    model:"Grok 4",
    prompt:['','what is actually trending on X right now'],
    chips:[["search","DeepSearch"],["spark","Think"],["image","Create Images"],["pencil","Edit Image"]],
  },
  perplexity:{
    wm:"perplexity", mark:"../brand/si-perplexity.svg", wmFont:'var(--ui)', wmSize:"88px", wmWeight:500, wmW:"452px",
    paper:"#FCFCF9", grid:false, ink:"#13343B", muted:"#8D9191", line:"#E3E3E0",
    link:"#20808D", card:"#FFFFFF", cardR:"24px", chipBg:"#fff",
    model:"Best",
    prompt:['','who actually owns the model weights'],
    chips:[["search","Search"],["doc","Research"],["spark","Labs"]],
  },
};

const q = new URLSearchParams(location.search);
const b = BRANDS[q.get("brand") || "claude"] || BRANDS.claude;
const r = document.documentElement.style;
r.setProperty("--paper", b.paper);   r.setProperty("--ink", b.ink);
r.setProperty("--muted", b.muted);   r.setProperty("--line", b.line);
r.setProperty("--link", b.link);     r.setProperty("--card", b.card);
r.setProperty("--cardR", b.cardR);   r.setProperty("--chipBg", b.chipBg);
r.setProperty("--wmFont", b.wmFont); r.setProperty("--wmSize", b.wmSize);
r.setProperty("--wmWeight", b.wmWeight); r.setProperty("--wmW", b.wmW);
if (b.grid) document.body.classList.add("grid");
if (q.get("plate") === "none") document.body.classList.add("bare");

document.getElementById("markimg").src = b.mark;
document.getElementById("wm").textContent = b.wm;
document.getElementById("model").textContent = b.model;
const [cmd, rest] = b.prompt;
document.getElementById("line").innerHTML =
  (cmd ? `<span class="cmd">${cmd}</span> ` : "") + rest;
document.getElementById("chips").innerHTML = b.chips
  .map(([i, label]) => `<span><svg viewBox="0 0 24 24">${ICON[i]}</svg>${label}</span>`).join("");

/*  The type-on and the caret travel have to match the REAL width of this brand's
    prompt, or the camera pans past the end of the line into blank card.
    Measured after layout, then written back into the two vars that drive both.  */
requestAnimationFrame(() => {
  const line = document.getElementById("line");
  const w = Math.min(Math.ceil(line.scrollWidth) + 2, 812);
  r.setProperty("--lineW", w + "px");
  document.getElementById("caret").style.setProperty("--end", (34 + w) + "px");
  const sheet = document.styleSheets[document.styleSheets.length - 1];
  sheet.insertRule(`@keyframes caretMove{
    0%,4%{left:34px;opacity:1} 46%{left:${34 + w}px;opacity:1}
    52%,100%{left:${34 + w}px;opacity:0}}`, sheet.cssRules.length);
  // the wordmark wipe needs its true width too, or it clips or leaves a gap
  const wm = document.getElementById("wm");
  const probe = document.createElement("span");
  probe.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;
    font-family:${getComputedStyle(wm).fontFamily};font-weight:${b.wmWeight};
    font-size:${b.wmSize};letter-spacing:-.015em`;
  probe.textContent = b.wm;
  document.body.appendChild(probe);
  r.setProperty("--wmW", Math.ceil(probe.getBoundingClientRect().width) + 4 + "px");
  probe.remove();
});

/* ?seek=<seconds> — pause every animation at one instant. Lets a headless shot land on
   the settled frame instead of wherever the 6s loop happened to be. */
(() => {
  const s = new URLSearchParams(location.search).get("seek");
  if (s === null) return;
  const go = () => document.getAnimations().forEach(a => { a.pause(); a.currentTime = parseFloat(s) * 1000; });
  requestAnimationFrame(() => requestAnimationFrame(() => { go(); setTimeout(go, 250); }));
})();
</script>
</body>
</html>
