<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>sessions-hub</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/*  sessions-hub — what "sessions talking to each other" actually looks like.

    One mascot is the session you are in. The others are the sessions on your other
    machines. A wire draws between them and a message rides it across. Nobody needs
    the word "session" explained — they watch one send and another receive.

      ?mode=solo   one session, alone, waiting                (the "before")
      ?mode=talk   two sessions, a message crosses            ("tell a session")
      ?mode=hub    one conductor, three sessions, all wired   ("every computer you have")
      ?fit=half    re-laid for the 1000x880 coral half

    ?seek=<s> holds a frame — that is how scripts/block-render.py turns this into video.  */
:root{
  --T:6s; --ease:cubic-bezier(.16,1,.3,1);
  --cream:#F0EDE4; --coral:#D97757; --ink:#191817; --soft:#6B6660;
  --mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--cream);font-family:var(--mono)}
body.half{width:1000px;height:880px}
body.bare{background:transparent}
#stage{position:absolute;inset:0}

.node{position:absolute;width:var(--w,230px);text-align:center}
.node img{width:100%;display:block;image-rendering:pixelated}
.node .lbl{margin-top:10px;font:500 26px var(--mono);color:var(--soft);white-space:nowrap}
body.half .node .lbl{font-size:19px;margin-top:6px}

/* the wire: draws out, then a message packet rides it */
.wire{position:absolute;height:8px;width:var(--len);transform-origin:0 50%;
  transform:rotate(var(--rot))}
.wire i{display:block;height:100%;width:100%;transform-origin:0 50%;border-radius:4px;
  background:repeating-linear-gradient(90deg,var(--coral) 0 9px,transparent 9px 26px);
  animation:draw var(--T) var(--ease) infinite both, march .9s linear infinite;
  animation-delay:var(--d,0s),0s}
@keyframes draw{0%{transform:scaleX(0);opacity:0} 5%{opacity:1} 22%{transform:scaleX(1)}
  92%{transform:scaleX(1);opacity:1} 98%,100%{transform:scaleX(1);opacity:0}}
@keyframes march{to{background-position:26px 0}}
.wire em{position:absolute;top:50%;left:0;margin:-24px 0 0 -24px;width:48px;height:48px;
  border-radius:12px;background:var(--coral);box-shadow:0 6px 18px rgba(217,119,87,.45);
  display:flex;align-items:center;justify-content:center;
  animation:pkt var(--T) var(--ease) infinite both;animation-delay:var(--d,0s)}
.wire em svg{width:24px;height:24px;fill:var(--cream)}
@keyframes pkt{
  0%,24%{opacity:0;transform:translateX(0) scale(.4)}
  30%{opacity:1;transform:translateX(0) scale(1)}
  58%{opacity:1;transform:translateX(var(--len)) scale(1)}
  64%{opacity:0;transform:translateX(var(--len)) scale(.4)}
  65%,100%{opacity:0;transform:translateX(0) scale(.4)}}

.pop{animation:pop var(--T) var(--ease) infinite both;animation-delay:var(--d,0s)}
@keyframes pop{0%{opacity:0;transform:scale(.6)} 8%{opacity:1;transform:scale(1.06)}
  13%{transform:scale(1)} 92%{opacity:1;transform:scale(1)} 98%,100%{opacity:0;transform:scale(.92)}}
/* the receiving session reacts when the message lands */
.react{animation:react var(--T) var(--ease) infinite both}
@keyframes react{0%,58%{transform:translateY(0)} 63%{transform:translateY(-26px)}
  70%{transform:translateY(0)} 100%{transform:translateY(0)}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const MODE = q.get("mode") || "talk";
const HALF = q.get("fit") === "half";
if (HALF) { document.body.classList.add("half");
  document.documentElement.style.cssText = "width:1000px;height:880px;overflow:hidden"; }
if (q.get("plate") === "none") document.body.classList.add("bare");

const S = HALF ? 1000 : 1080, H = HALF ? 880 : 1920;
const M = "../mascot/outline/";
const ARROW = '<svg viewBox="0 0 24 24"><path d="M4 11h11.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H4z"/></svg>';
const st = document.getElementById("stage");

const node = (x, y, w, sprite, label, d, cls="") =>
  `<div class="node pop ${cls}" style="left:${x}px;top:${y}px;--w:${w}px;--d:${d}s">
     <img src="${M}${sprite}.webp" alt=""><div class="lbl">${label}</div></div>`;
const wire = (x, y, len, rot, d) =>
  `<div class="wire" style="left:${x}px;top:${y}px;--len:${len}px;--rot:${rot}deg;--d:${d}s">
     <i></i><em>${ARROW}</em></div>`;

if (MODE === "talk") {
  // "the session fixing your code can tell a session that's writing your tests"
  const w = HALF ? 190 : 260, y = HALF ? 300 : 780;
  st.innerHTML =
    node(HALF?90:150, y, w, "mascot-debugger", "fixing your code", 0.2) +
    wire(HALF?320:450, y + w*0.34, HALF?230:300, 0, 0.7) +
    node(HALF?600:660, y, w, "mascot-typing", "writing your tests", 0.45, "react");
} else if (MODE === "hub") {
  // "hand off work across every computer you have" — conductor on top, three machines
  // below in a row. A 880-tall box has no room for a radial hub; a fan reads better.
  const w  = HALF ? 140 : 200;
  const cx = S/2, top = HALF ? 40 : 300, row = HALF ? 470 : 1080;
  const xs = HALF ? [70, 430, 790] : [90, 440, 800];
  st.innerHTML =
    node(cx - (HALF?100:135), top, HALF?200:270, "mascot-conducting", "your session", 0) +
    wire(cx - 10, top + (HALF?250:330), HALF?300:420, 128, 0.5) +
    wire(cx,      top + (HALF?250:330), HALF?200:280,  90, 0.75) +
    wire(cx + 10, top + (HALF?250:330), HALF?300:420,  52, 1.0) +
    node(xs[0], row, w, "mascot-idle",     "mac mini", 0.55) +
    node(xs[1], row, w, "mascot-typing",   "laptop",   0.80) +
    node(xs[2], row, w, "mascot-building", "desktop",  1.05);
} else {
  // solo — one session, waiting. The "before" of the story.
  const w = HALF ? 200 : 280;
  st.innerHTML = node(S/2 - w/2, HALF?300:800, w, "mascot-sleeping", "waiting on the first one", 0.2);
}

/* ?seek=<seconds> — hold one instant so a headless shot lands where you want it */
(() => {
  const s = q.get("seek"); if (s === null) return;
  const go = () => document.getAnimations().forEach(a => { a.pause(); a.currentTime = parseFloat(s)*1000; });
  requestAnimationFrame(() => requestAnimationFrame(() => { go(); setTimeout(go, 250); }));
})();
</script>
</body>
</html>
