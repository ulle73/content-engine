<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>inbound-policy</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*  inbound-policy — the REAL control that decides what an incoming cross-session message is
    allowed to do: crossSessionInbound = accept | hold | refuse.

    Built 2026-08-10 for tp-0810's safety beat. The line over it is about not letting a stray
    session act on its own, and the honest picture of that is this setting, not a padlock and
    not a mascot. concepts.json `permission` says: "The real permission prompt ... Never a
    padlock icon, a shield, an abstract gate."

    ⚠ A NOTE ON WHAT THIS BLOCK MAY NOT CLAIM. Cross-session messaging is ON by default once a
    session meets the requirements — the docs say "messaging is on with nothing to enable".
    So this surface is a RESTRICTION, never an on-switch. Nothing here says "enable", "turn on"
    or "off", because that would put a false claim on screen.

      ?fit=half    re-laid for the 1000x880 coral half
      ?fit=head    re-laid for the 1000x420 slot above his head
      ?plate=none  transparent ground
      ?seek=<s>    hold one instant, for scripts/block-render.py

    Type is deliberately large — the smallest thing here is 24px in a 1000px-wide slot, which
    is ~26px in a 1080 frame. See reference/BLACKLIST.md #1.                                  */
:root{
  --T:6s; --ease:cubic-bezier(.16,1,.3,1);
  --cream:#F0EDE4; --coral:#D97757; --ink:#191817;
  --term:#17140F; --term-2:#221C16; --prompt:#E0A15F; --text:#E7E2D7;
  --ok:#6FBF73; --warn:#E0A15F; --off:#3A322B; --dim:#C9BFB4;
  --mono:"JetBrains Mono",monospace; --ui:"Inter",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--cream);font-family:var(--mono)}
body.half{width:1000px;height:880px}
body.head{width:1000px;height:420px}
body.bare{background:transparent}
#stage{position:absolute;inset:0}

/* the window itself is the media — its rounded corners and shadow are the WINDOW's own
   chrome, the way a real terminal has them. That is not a card behind a picture. */
.panel{position:absolute;left:70px;top:430px;width:940px;height:1060px;border-radius:28px;
  overflow:hidden;background:var(--term);box-shadow:0 26px 64px rgba(25,24,23,.30)}
/* the window hugs its content and sits centred in the coral half — a tall empty panel
   reads as a mostly-blank card */
body.half .panel{left:40px;top:198px;width:920px;height:484px;border-radius:22px}
body.head .panel{left:0;top:30px;width:1000px;height:360px;border-radius:18px}

.bar{height:74px;background:var(--term-2);display:flex;align-items:center;gap:12px;padding:0 24px}
body.half .bar{height:62px;padding:0 20px}
body.head .bar{height:48px;padding:0 16px;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;background:#4A423A}
.dot.r{background:#D9584F}.dot.y{background:#D9A24F}.dot.g{background:#6FBF73}
.name{margin-left:10px;font:700 26px var(--mono);color:#9A9188;letter-spacing:-.01em}
body.half .name{font-size:23px}
body.head .name{font-size:18px;margin-left:6px}

/* the key being set — big, one line, never a JSON blob */
.key{margin:34px 30px 0;font:700 44px var(--mono);color:var(--prompt);letter-spacing:-.02em}
body.half .key{margin:26px 26px 0;font-size:38px}
body.head .key{margin:16px 20px 0;font-size:26px}

/* the three real values, as big chips */
.opts{display:flex;gap:18px;margin:28px 30px 0}
body.half .opts{gap:14px;margin:22px 26px 0}
body.head .opts{gap:10px;margin:14px 20px 0}
.opt{flex:1;height:120px;border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;background:var(--off);
  box-shadow:inset 0 0 0 4px transparent;
  opacity:0;transform:translateY(24px);
  animation:optIn var(--T) var(--ease) infinite both}
body.half .opt{height:104px;border-radius:17px}
body.head .opt{height:74px;border-radius:13px;gap:2px}
.opt b{font:800 38px var(--ui);color:var(--dim);letter-spacing:-.01em}
body.half .opt b{font-size:34px}
body.head .opt b{font-size:24px}
.opt s{font:500 24px var(--ui);color:#8B8177;text-decoration:none}
body.half .opt s{font-size:21px}
body.head .opt s{display:none}
.o1{animation-delay:calc(var(--T) * -0.00)}
.o2{animation-delay:calc(var(--T) * -0.00)}
.o3{animation-delay:calc(var(--T) * -0.00)}
@keyframes optIn{0%,4%{opacity:0;transform:translateY(24px)}
  14%,100%{opacity:1;transform:translateY(0)}}

/* the selector lands on `hold` — the value that stops a message acting on its own */
.opt.pick{animation:optIn var(--T) var(--ease) infinite both, land var(--T) var(--ease) infinite both}
@keyframes land{0%,34%{background:var(--off);box-shadow:inset 0 0 0 4px transparent;transform:translateY(0) scale(1)}
  44%{background:#2A2119;box-shadow:inset 0 0 0 5px var(--warn);transform:translateY(0) scale(1.05)}
  52%,100%{background:#2A2119;box-shadow:inset 0 0 0 5px var(--warn);transform:translateY(0) scale(1)}}
.opt.pick b{animation:pickText var(--T) var(--ease) infinite both}
@keyframes pickText{0%,40%{color:var(--dim)}50%,100%{color:var(--warn)}}

/* what that value actually DOES — a message arrives and is held, not delivered */
.evt{position:absolute;left:30px;right:30px;bottom:36px;padding:26px 28px;border-radius:20px;
  background:#2A2119;border-left:8px solid var(--warn);
  opacity:0;transform:translateX(50px);
  animation:evtIn var(--T) var(--ease) infinite both}
/* in the half slot the panel is short — pinning the notice to the bottom leaves a dead band
   between it and the chips, so it flows directly under them instead */
body.half .evt{position:static;margin:26px 26px 0;padding:22px 24px;border-radius:17px}
body.head .evt{display:none}
.evt .from{font:700 24px var(--ui);color:var(--warn);margin-bottom:10px}
body.half .evt .from{font-size:21px}
.evt .txt{font:500 32px var(--mono);color:var(--text);line-height:1.3}
body.half .evt .txt{font-size:28px}
@keyframes evtIn{0%,58%{opacity:0;transform:translateX(50px)}
  70%,100%{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<div id="stage"></div>

<script>
const q    = new URLSearchParams(location.search);
const FIT  = q.get("fit") || "full";
if (FIT === "half"){ document.body.classList.add("half");
  document.documentElement.style.cssText = "width:1000px;height:880px;overflow:hidden"; }
if (FIT === "head"){ document.body.classList.add("head");
  document.documentElement.style.cssText = "width:1000px;height:420px;overflow:hidden"; }
if (q.get("plate") === "none") document.body.classList.add("bare");

// ?T=<seconds> — override the loop length. A beat shorter than the block's natural 6s loop
// would otherwise be cut off mid-move; compressing the loop keeps the WHOLE move inside the
// beat instead of truncating it (HOW-WE-EDIT §3, "watch the loop boundary").
const TT = q.get("T");
if (TT) document.documentElement.style.setProperty("--T", parseFloat(TT) + "s");

// `hold` is the default pick: it is the value that makes an arriving message wait for you
// instead of acting. ?pick=refuse|accept if a line ever needs a different one.
const PICK = q.get("pick") || "hold";
const OPTS = [
  ["accept", "deliver it"],
  ["hold",   "wait for you"],
  ["refuse", "drop it"],
];

document.getElementById("stage").innerHTML = `
  <div class="panel">
    <div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i>
      <span class="name">claude &mdash; settings</span></div>
    <div class="key">crossSessionInbound</div>
    <div class="opts">
      ${OPTS.map(([v, sub], i) => `
        <div class="opt o${i+1} ${v === PICK ? "pick" : ""}"><b>${v}</b><s>${sub}</s></div>`).join("")}
    </div>
    <div class="evt">
      <div class="from">message from: schema-migration</div>
      <div class="txt">held &mdash; waiting for you</div>
    </div>
  </div>`;

/* ?seek=<seconds> — hold one instant so a headless shot lands where you want it */
(() => {
  const s = q.get("seek"); if (s === null) return;
  const go = () => document.getAnimations().forEach(a => { a.pause(); a.currentTime = parseFloat(s)*1000; });
  requestAnimationFrame(() => requestAnimationFrame(() => { go(); setTimeout(go, 250); }));
})();
</script>
</body>
</html>
