<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<!-- Blink för Golfkuponger (Jonas 2026-11-26, efter tre rundor): enkel grafik som blinkar som Caia och Libresse.
     Läge a: metallguld (brons → champagne → guld) med djup på smaragd. Läge b: grön text på dämpat antikguld.
     "Friskvårdsbidrag kvar?" är huvudfrågan och lika bred som rubriken (två rader som standard), inga linjer eller ramar,
     sista raden är vanlig text (ingen knapp), 0,4 s per läge. Texten fyller bilden: Jonas beslutade att de säkra zonerna
     inte gäller här ("skit i våra regler med marginaler"), därför data-zon-fri (mittkontrollen gäller fortfarande).
     Sidkontraktet: library/templates/_mall/README.md. Filmen loopar (ingen slutbild som standard, 2026-11-26); render.mjs gör även en gif. -->
<style>
@font-face{font-family:Anton;src:url(assets/anton.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(assets/inter-700.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse 85% 60% at 50% 42%,#145238 0%,#0a2e1f 45%,#041a11 78%,#020c07 100%)}
body.b{background:radial-gradient(ellipse 80% 55% at 50% 38%,#dcc69a 0%,#c8ab74 45%,#a98a55 85%,#957848 100%)}
/* fint brus så att ytorna inte blir plastiga (fast mönster, samma varje bildruta) */
#brus{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;pointer-events:none;
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23n)'/%3E%3C/svg%3E")}
#yta{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
#fraga,#stor,#rub{font-family:Anton;text-transform:uppercase;white-space:nowrap}
#fraga .r,#stor .r{display:block}
#golf{font-family:Inter;font-weight:700;white-space:nowrap}
/* läge a: metallguld med en mörk guldkant under och mjuk skugga */
.metall{background:linear-gradient(180deg,#a97f3a 0%,#c69b4e 18%,#e0bf78 33%,#efd9a6 43%,#dfbc72 53%,#c49546 70%,#a97f3a 86%,#cba45c 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 0 #4a3008) drop-shadow(0 20px 30px rgba(0,0,0,.55))}
#golf{color:#e6c779}
/* läge b: grön text med en dämpad smaragdgradient (samma uppbyggnad som guldet), lätt inpräglad i guldet.
   Skuggorna ligger i filter, inte text-shadow: text-shadow målas ovanpå en bakgrund som klipps till texten. */
body.b .metall{background:linear-gradient(180deg,#06190f 0%,#0b2a1c 20%,#155238 36%,#1d6646 44%,#13472f 55%,#0b2a1c 72%,#06190f 88%,#0f3a26 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(255,246,220,.45)) drop-shadow(0 -2px 1px rgba(50,32,5,.35))}
body.b #golf{color:#0b2a1c}
</style></head>
<body><div id="brus"></div>
<div id="yta" data-zon-fri><div id="fraga"></div><div id="stor"></div><div id="rub"></div><div id="golf"></div></div>
<script type="module">
import { starta } from '../_mall/sida.mjs';

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rader = (el, lista) => { el.innerHTML = lista.map(r => `<span class="r">${esc(r)}</span>`).join(''); el.style.display = lista.length ? '' : 'none'; };

// En egen variant av Anton per rad där textrutan är exakt bokstävernas höjd (mätt med canvas när typsnittet laddats).
// Annars är rutan ~1,5 em hög fast versalerna är 0,875 em, och raderna går inte att placera tätt utan att överlappa.
const canvas = document.createElement('canvas').getContext('2d');
let nr = 0;
async function exakt(el, txt) {
  canvas.font = '400 1000px Anton';
  const m = canvas.measureText(txt.toUpperCase());
  const namn = `AntonExakt${nr++}`;
  const ff = new FontFace(namn, 'url(assets/anton.woff2)', { ascentOverride: (m.actualBoundingBoxAscent / 10).toFixed(2) + '%',
    descentOverride: (Math.max(0, m.actualBoundingBoxDescent) / 10).toFixed(2) + '%', lineGapOverride: '0%' });
  await ff.load(); document.fonts.add(ff);
  el.style.fontFamily = namn; el.style.lineHeight = 'normal';
}

let ritaRuta = () => {}, INFO = {};

async function forbered(v, ctx) {
  await Promise.all(['400 100px Anton', '700 40px Inter'].map(f => document.fonts.load(f)));
  const H = ctx.hojd;
  for (const el of [document.documentElement, document.body]) el.style.height = H + 'px';
  document.body.classList.remove('b');
  // texten fyller bilden (beslut Jonas 2026-11-26): 46 px i sidorna, 96 px (9:16) eller 60 px (4:5) upptill och nedtill
  const SID = 46, TB = H === 1920 ? 96 : 60, W = 1080 - 2 * SID, HY = H - 2 * TB;
  const yta = $('#yta');
  Object.assign(yta.style, { left: SID + 'px', right: SID + 'px', top: TB + 'px', bottom: TB + 'px' });
  const fraga = $('#fraga'), stor = $('#stor'), rub = $('#rub'), golf = $('#golf');
  const F = v.fraga.trim(), S = v.stor.trim(), R = v.rad2.trim(), G = v.golf.trim();
  const TAL = /^\d{1,3}$/.test(S);

  // frågan: två rader = sista ordet på egen rad
  const ord = F.split(/\s+/).filter(Boolean);
  const FR = !F ? [] : (v.fraga_rader === 'tva' && ord.length > 1 ? [ord.slice(0, -1).join(' '), ord.at(-1)] : [F]);
  rader(fraga, FR);
  rub.textContent = R; rub.style.display = R ? '' : 'none';
  golf.textContent = G; golf.style.display = G ? '' : 'none';
  for (const el of [fraga, stor, rub]) el.classList.add('metall');

  // stora siffran eller orden: en eller två rader, den uppdelning som blir störst i bredden
  const sOrd = S.split(/\s+/);
  const alt = TAL ? [[S]] : [[S], ...sOrd.slice(1).map((_, i) => [sOrd.slice(0, i + 1).join(' '), sOrd.slice(i + 1).join(' ')])];
  canvas.font = '400 100px Anton';
  const bredd = r => Math.max(...r.map(x => canvas.measureText(x.toUpperCase()).width));
  const SR = alt.sort((a, b) => bredd(a) - bredd(b))[0];
  rader(stor, SR);

  // exakta textrutor
  for (const r of fraga.querySelectorAll('.r')) await exakt(r, r.textContent);
  for (const r of stor.querySelectorAll('.r')) await exakt(r, SR.join(''));
  if (R) await exakt(rub, R);
  [...fraga.querySelectorAll('.r'), ...stor.querySelectorAll('.r')].forEach(r => { r.style.marginTop = r.previousElementSibling ? '0.12em' : '0'; });

  // storlekar: frågan och rubriken till full bredd, sista raden fast, siffran så stor som höjden och bredden tillåter
  const L = v.luft;
  const syns = [fraga, stor, rub, golf].filter(e => e.style.display !== 'none');
  syns.forEach((e, i) => { e.style.marginTop = i ? (e === golf ? Math.round(L * 0.75) : L) + 'px' : '0'; });
  const bredast = el => Math.max(...[...(el.querySelectorAll('.r').length ? el.querySelectorAll('.r') : [el])].map(e => {
    const d = e.style.display; e.style.display = 'inline-block'; const w = e.getBoundingClientRect().width; e.style.display = d; return w; }));
  const passaBredd = (el, start) => {
    let fs = start; el.style.fontSize = fs + 'px';
    while (bredast(el) > W && fs > 20) el.style.fontSize = (fs -= 2) + 'px';
    return fs;
  };
  const ffs = F ? passaBredd(fraga, 400) : 0;
  const rfs = R ? passaBredd(rub, 400) : 0;
  golf.style.fontSize = (H === 1920 ? 64 : 56) + 'px';
  const hojd = () => syns.at(-1).getBoundingClientRect().bottom - syns[0].getBoundingClientRect().top;
  let sfs = TAL ? 1500 : 600; stor.style.fontSize = sfs + 'px';
  while ((hojd() > HY || bredast(stor) > W) && sfs > 60) stor.style.fontSize = (sfs -= 10) + 'px';
  const VARNINGAR = [];
  if (hojd() > HY) VARNINGAR.push('Texten ryms inte i höjden. Korta texten eller minska luften mellan raderna.');

  // tiden: lägena byts på hela bildrutor; längden räcker alltid för läsregeln (max(5/6, tecken/12) + 0,9 s)
  const FPS = ctx.mall.video?.fps || 30;
  const PER = Math.max(1, Math.round(v.per_lage * FPS)) / FPS;
  const TECKEN = F.length + S.length + R.length + G.length;
  const LAS = Math.max(5 / 6, TECKEN / 12) + 0.9;
  // filmen loopar: ett jämnt antal lägen, så att sista rutan (läge b) går rakt över i första (läge a) utan hack
  const PAR = 2 * Math.round(PER * FPS);
  const LANGD = Math.ceil(Math.max(v.langd, LAS) * FPS / PAR) * PAR / FPS;
  INFO = { langd: LANGD, period: PER, las: +LAS.toFixed(2), fraga_px: ffs, stor_px: sfs, rubrik_px: rfs, fraga_rader: FR.length,
    hojd: Math.round(hojd()), slutbild: v.slutbild, varningar: VARNINGAR };

  // läge a (grönt, metallguld) vid t = 0 och i stillbilden; läge b (antikguld) varannan period
  ritaRuta = t => { document.body.classList.toggle('b', Math.floor(t / PER + 1e-6) % 2 === 1); };
}

starta({ forbered, info: () => INFO, rita: t => ritaRuta(t) });
</script>
</body></html>
