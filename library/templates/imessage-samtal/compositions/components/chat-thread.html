<!doctype html>
<!--
  chat-thread (imessage-samtal): ljus iMessage-skärm som spelar upp window.CHAT_CONFIG.

  Bygger på HyperFrames-registrets chat-thread men är omskriven för mallen:
  - allt innehåll och alla tider kommer från conversation.json via build.mjs (_typing, _start, _reaction)
  - tråden börjar uppifrån som i riktiga iMessage och scrollar först när den är full
  - skriver-prickar och "Levererat" är egna rader i layouten och skjuter upp tråden
  - bild + text i samma meddelande visas som bild och textbubbla under
  - en svans per avsändargrupp, stora emoji utan bubbla, tapback-reaktion som egen händelse
  Enhet: --pt = skärmbredd / 350 (iOS "Större text"-zoom) eller / 402 (standard).
  Deterministisk: layouten räknas fram vid mount (och igen när typsnitt och bilder har laddats).
-->

    <title>iMessage-samtal</title>
  </head>

            var msgs = Array.isArray(C.messages) ? C.messages : [];

            var $ = function (id) { return document.getElementById(id); };
            var view = $("ms-view");
            var W = root.offsetWidth || 820, H = root.offsetHeight || 1780;
            var PT = W / (C.largerText === false ? 402 : 350);
            root.style.setProperty("--pt", PT + "px");
            if (C.service === "sms") root.classList.add("sms");

                tl.to(notif, { scale: 0.96, duration: 0.1, ease: "power1.out" }, op - 0.22);
                tl.to(notif, { scale: 1, duration: 0.1, ease: "power1.in" }, op - 0.12);
                tl.fromTo(lock, { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.18, duration: 0.24, ease: "power2.in", immediateRender: false }, op);
                tl.set(lock, { visibility: "hidden" }, op + 0.24);
                tl.set(clockEl, { visibility: "visible" }, op + 0.1); tl.set(iconsEl, { fill: "#000" }, op + 0.1);
                tl.set($("ms-status"), { zIndex: 5 }, op + 0.24);
              }

              /* overlays: läggs på bildens läge när de släpps (bilden får inte flytta sig efteråt) */
              var rb = root.getBoundingClientRect(), sc = rb.width / W || 1;
              rows.forEach(function (r, i) {
                if (!r.ov) return;
                var o = r.m.overlay, photo = r.pop.querySelector(".ms-photo");
                if (!photo) return;
                var ib = photo.getBoundingClientRect(), eb = r.el.getBoundingClientRect();
                var iw = ib.width / sc, ih = ib.height / sc, ix = (ib.left - rb.left) / sc, dy = (ib.top - eb.top) / sc;
                var at = typeof r.m._overlay === "number" ? r.m._overlay : r.m._start + 1;
                var rowY = state(at).pos[i];
                if (rowY === undefined) return;
                var w = iw * (o.width || 0.6), ratio = r.ov.naturalWidth ? r.ov.naturalHeight / r.ov.naturalWidth : 0.15, h = w * ratio;
                var left = ix + iw * (o.x != null ? o.x : 0.5) - w / 2, top = rowY + dy + ih * (o.y != null ? o.y : 0.3) - h / 2;
                r.ov.style.width = w + "px"; r.ov.style.height = h + "px"; r.ov.style.left = left + "px"; r.ov.style.top = top + "px";
                var from = -(top + h + P(30));
                tl.set(r.ov, { visibility: "hidden", y: from, rotation: o.rotate || 0 }, 0);
                /* som memen: jämn fart rakt ner, stannar tvärt på plats */
                tl.fromTo(r.ov, { visibility: "visible", y: from }, { y: 0, duration: o.duration || 1.6, ease: "none", immediateRender: false }, at);
              });

              tl.set({}, {}, DUR);
              tl.seek(0);
            }

            build();
            var waits = [];
            if (document.fonts && document.fonts.ready) waits.push(document.fonts.ready);
            root.querySelectorAll("img").forEach(function (img) { if (img.decode) waits.push(img.decode().catch(function () {})); });
            Promise.all(waits).then(function () { build(); tl.pause(0); });
            window.__timelines = window.__timelines || {};
            window.__timelines["chat-thread"] = tl;
          })();
        </script>
      </div>
