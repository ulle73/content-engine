<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <script src="conversation.generated.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    /* Apples typsnitt och emoji (gitignorerade; build.mjs lägger dem på plats, emojin som delmängd per samtal). */
    @font-face { font-family: "SF Pro Text"; src: url("assets/fonts/SF-Pro-Text-Regular.otf"); font-weight: 400; font-display: block; }
    @font-face { font-family: "SF Pro Text"; src: url("assets/fonts/SF-Pro-Text-Medium.otf"); font-weight: 500; font-display: block; }
    @font-face { font-family: "SF Pro Text"; src: url("assets/fonts/SF-Pro-Text-Semibold.otf"); font-weight: 600; font-display: block; }
    @font-face { font-family: "SF Pro Display"; src: url("assets/fonts/SF-Pro-Display-Regular.otf"); font-weight: 400; font-display: block; }
    @font-face { font-family: "SF Pro Display"; src: url("assets/fonts/SF-Pro-Display-Semibold.otf"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Apple Emoji"; src: url("assets/fonts/apple-emoji.woff2") format("woff2"); font-display: block; }
    /* Telefonramen iphone-17.png (1311 × 2708 px, Jonas) skalas 0,6795 gånger: 891 × 1840 px.
       Skärmens utskärning i ramen: x 53–1258, y 43–2664, hörnradie ≈ 188 px (uppmätt), ö x 470–841, y 86–193. */
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #root { position: relative; width: 1080px; height: 1920px; background: #e9e7e3; overflow: hidden; }
    #backdrop { position: absolute; inset: 0; background-size: cover; background-position: center; }
    #chat-thread { position: absolute; left: 130px; top: 69px; width: 820px; height: 1782px; overflow: hidden; border-radius: 124px; }
    #outro-fade { position: absolute; inset: 0; background: #0c140f; opacity: 0; z-index: 20; pointer-events: none; }
    #outro-video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 21; }
    .frame { position: absolute; left: 94px; top: 40px; width: 891px; height: 1840px; pointer-events: none; }
  </style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="22.5" data-width="1080" data-height="1920">
  <div id="backdrop"></div>
  <div id="chat-thread" data-composition-id="chat-thread" data-composition-src="compositions/components/chat-thread.html" data-start="0" data-duration="22.5" data-width="820" data-height="1782" data-track-index="0" data-track-kind="graphics"></div>
  <img class="frame" src="assets/iphone-17.png" alt="" data-layout-allow-occlusion>
  <!-- SOUNDS:START -->
  <audio id="message-sound-0" class="clip" src="assets/ljud/ReceivedMessage.wav" data-start="2.04" data-duration="0.55" data-track-index="2" data-volume="0.8"></audio>
  <audio id="message-sound-1" class="clip" src="assets/ljud/SentMessage.wav" data-start="5.53" data-duration="0.55" data-track-index="3" data-volume="0.8"></audio>
  <audio id="message-sound-2" class="clip" src="assets/ljud/ReceivedMessage.wav" data-start="9.98" data-duration="0.55" data-track-index="2" data-volume="0.8"></audio>
  <audio id="message-sound-3" class="clip" src="assets/ljud/ReceivedMessage.wav" data-start="12.47" data-duration="0.55" data-track-index="3" data-volume="0.8"></audio>
  <audio id="message-sound-4" class="clip" src="assets/ljud/SentMessage.wav" data-start="15.37" data-duration="0.55" data-track-index="2" data-volume="0.8"></audio>
  <audio id="message-sound-5" class="clip" src="assets/ljud/ReceivedMessage.wav" data-start="19.52" data-duration="0.55" data-track-index="3" data-volume="0.8"></audio>
  <!-- SOUNDS:END -->
  <!-- OUTRO:START -->
  <!-- OUTRO:END -->
</div>
<script>
(function () {
  var C = window.CHAT_CONFIG || {};
  var bg = document.getElementById('backdrop');
  if (typeof C.background === 'string' && C.background.indexOf('assets/') === 0) bg.style.backgroundImage = 'url("' + C.background + '")';
  else if (typeof C.background === 'string' && /^#[0-9a-f]{3,8}$/i.test(C.background)) bg.style.background = C.background;
  // Ön i chattkomponentens koordinater: ((470, 86)–(841, 193) − skärmens hörn (53, 43)) × 0,6795.
  C.screen = { island: { top: 29.2, bottom: 101.9, left: 283.4, right: 535.4 } };
})();
window.__timelines = window.__timelines || {};
window.__timelines.main = gsap.timeline({paused:true});
// Tona till mörkgrönt de sista 0,5 s före Spotlight-slutbilden.
if (window.CHAT_CONFIG && window.CHAT_CONFIG.outro === 'spotlight') {
  window.__timelines.main.to('#outro-fade', {opacity: 1, duration: 0.5, ease: 'power1.in'}, window.CHAT_CONFIG.duration - 0.5);
  window.__timelines.main.set({}, {}, window.CHAT_CONFIG._total);
}
</script>
</body>
</html>
