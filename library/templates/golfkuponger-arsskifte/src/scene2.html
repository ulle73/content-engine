<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Anton; src: url(../../../edit-renderer/fonts/anton.woff2); }
  @font-face { font-family: Inter; font-weight: 600; src: url(../../../edit-renderer/fonts/inter-600.woff2); }
  @font-face { font-family: Inter; font-weight: 700; src: url(../../../edit-renderer/fonts/inter-700.woff2); }
  @font-face { font-family: Mono; src: url(../../../.claude/skills/live-carousel/templates/common/fonts/JetBrainsMono-Var.woff2); }
  html, body { margin: 0; padding: 0; background: #0c140f; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  svg { position: absolute; inset: 0; }
  #text { position: absolute; left: 0; right: 0; top: 0; height: 1920px; pointer-events: none; }
  .block { position: absolute; left: 65px; right: 65px; text-align: center; font-family: Anton; text-transform: uppercase;
           font-size: 112px; line-height: 1.12; letter-spacing: 0.5px; }
  .line { display: block; white-space: nowrap; }
  .hl { display: inline-block; position: relative; padding: 0 20px; margin: 0 -4px; }
  .hl > .box { position: absolute; left: 0; right: 0; top: 0px; bottom: 2px; border-radius: 8px; }
  .hl > .w { position: relative; text-shadow: none; }  /* ingen mörk skugga på text i ljus ruta */
  .osd { position: absolute; font-family: Mono; font-weight: 700; color: #fff; font-size: 52px; letter-spacing: 2px;
         text-shadow: 3px 0 0 rgba(255,0,60,.55), -3px 0 0 rgba(0,220,255,.55), 0 0 10px rgba(255,255,255,.5); }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs><symbol id="gklogo" viewBox="0 0 960 912"><image id="gklogoImg" width="960" height="912"/></symbol></defs></svg>
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="text"></div>
</div>
<script src="assets/logo-data.js"></script>
<script>document.getElementById("gklogoImg").setAttribute("href", window.GK_LOGO);</script>
<script src="scene.js"></script>
<script src="sf.js"></script>
<script src="scene2.js"></script>
</body>
</html>
