<!doctype html>
<!-- Golfare i <stad>? som dashboardmall (mall/v1): stillbilden, samma utseende som slutläget i film.html
     (golfare-i-linkoping_A-still). Reglagen står i mall.json, värdena kommer i window.PARAMS (library/templates/_mall/sida.mjs).
     Filmerna (slam, snurr) görs fortfarande med rendera.mjs. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(assets/anton.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(assets/inter-600.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(assets/inter-700.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#082f27}
#foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#foto[hidden]{display:none}
#ton{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,20,15,.45) 0%,rgba(4,20,15,.18) 40%,rgba(4,20,15,0) 70%,rgba(4,20,15,.2) 100%)}
.c{position:absolute;left:0;right:0;text-align:center}
#rubrik{font-family:Anton;color:#F8F4EC}
.ord{display:inline-block;white-space:nowrap;--d:22;
  text-shadow:calc(var(--d)*.12px) calc(var(--d)*.14px) 0 #0d4630,calc(var(--d)*.24px) calc(var(--d)*.28px) 0 #0c412c,
  calc(var(--d)*.36px) calc(var(--d)*.42px) 0 #0a3b28,calc(var(--d)*.48px) calc(var(--d)*.56px) 0 #093524,
  calc(var(--d)*.6px) calc(var(--d)*.7px) 0 #072f20,calc(var(--d)*.72px) calc(var(--d)*.84px) 0 #06291b,
  calc(var(--d)*.84px) calc(var(--d)*.98px) 0 #042317,calc(var(--d)*.96px) calc(var(--d)*1.12px) 0 #031d13,
  calc(var(--d)*1.08px) calc(var(--d)*1.26px) 0 #02180f,calc(var(--d)*1.2px) calc(var(--d)*1.4px) 0 #01140c,
  calc(var(--d)*1.6px) calc(var(--d)*2.2px) calc(var(--d)*1.6px) rgba(0,12,6,.55)}
/* Guldytan sträcker sig .3em ovanför versalhöjden så att prickar och ringar på Å/Ä/Ö också blir guld (Jonas 2026-10-28) */
#sth{color:#D9A93C;position:relative}
.guld{position:absolute;left:0;top:-.3em;padding-top:.3em;text-shadow:none;
  background:linear-gradient(100deg,#C8922A 0%,#F2D27A 38%,#FFF1C4 50%,#F2D27A 62%,#C8922A 100%);background-size:260% 100%;background-position:0 0;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rad{display:block;position:relative;white-space:nowrap}
#under{font-family:Inter;font-weight:600;color:#fff;line-height:1.3}
#under>span{display:inline-block;padding:18px 28px;border-radius:14px}
#under b{color:#F2C75C;font-weight:700}
#logga img{display:inline-block}
/* banans namn med plats-ikon, smått nere till vänster (Jonas 2026-10-28). I 9:16 står den under säkra ytan med flit,
   så att bildtexten i Reels får skymma den; därför räknas den inte i sidkontrollens zoner. */
#plats{position:absolute;left:65px;display:flex;align-items:center;gap:10px;font-family:Inter;font-weight:600;
  color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5);white-space:nowrap}
#plats svg{height:1.2em;width:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
</style>
</head>
<body>
<img id="foto" alt="" hidden>
<div id="ton"></div>
<div class="c" id="logga"><img src="assets/logo-final.png" alt=""></div>
<div class="c" id="rubrik"></div>
<div class="c" id="under"><span></span></div>
<div id="plats" data-zon-ignorera><svg viewBox="0 0 24 32"><path fill="#fff" d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 32 12 32s12-11.2 12-20.1C24 5.3 18.6 0 12 0zm0 16.6a4.8 4.8 0 1 1 0-9.6 4.8 4.8 0 0 1 0 9.6z"/></svg><span id="bana"></span></div>
<script type="module">
import { starta } from '../_mall/sida.mjs';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const bredd = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };

starta({
  async forbered(v, ctx) {
    await Promise.all(['400 100px Anton', '700 40px Inter', '600 40px Inter'].map(f => document.fonts.load(f)));
    const H = ctx.hojd;
    for (const el of [document.documentElement, document.body]) el.style.height = H + 'px';
    // fotot: beskärs med fokuspunkt och zoom; utan foto är bakgrunden mörkgrön
    const foto = $('foto');
    foto.hidden = !v.bakgrund;
    if (v.bakgrund) { if (foto.getAttribute('src') !== v.bakgrund) foto.src = v.bakgrund; } else foto.removeAttribute('src');
    foto.style.objectPosition = `${v.fokus_x * 100}% ${v.fokus_y * 100}%`;
    foto.style.transformOrigin = `${v.fokus_x * 100}% ${v.fokus_y * 100}%`;
    foto.style.transform = `scale(${v.zoom / 100})`;
    // toning: 0–100 % tonar in den vanliga övertoningen, över 100 % läggs en jämn mörk yta till
    $('ton').style.opacity = Math.min(1, v.toning / 100);
    $('ton').style.backgroundColor = `rgba(4,20,15,${Math.max(0, (v.toning - 100) / 100 * 0.6).toFixed(3)})`;

    // rubriken: första raden (vit eller vald färg) och STAD? i guld, båda med 3D-djup
    const r = $('rubrik');
    r.style.fontFamily = v.typsnitt === 'inter' ? 'Inter' : 'Anton';
    r.style.fontWeight = v.typsnitt === 'inter' ? '700' : '400';
    r.style.lineHeight = v.radavstand / 100;
    r.style.color = v.rubrik_farg;
    const stad = esc(v.stad.trim().toUpperCase() + '?');
    const rad1 = v.rad1.trim().toUpperCase();
    r.innerHTML = (rad1 ? `<span class="rad"><span class="ord" id="o1">${esc(rad1)}</span></span>` : '') +
      `<span class="rad"><span class="ord" id="sth">${stad}<span class="guld">${stad}</span></span></span>`;
    r.querySelectorAll('.ord').forEach(o => o.style.setProperty('--d', v.djup));

    // underraden: "Spela <klubb>" på egen rad, resten under
    const under = $('under').firstElementChild;
    const [fore, ...efter] = v.underrad.split('{klubb}');
    const klubb = v.klubb.trim();
    under.innerHTML = efter.length
      ? `${esc(fore.trim())}${klubb ? ` <b>${esc(klubb)}</b>` : ''}<br>${esc(efter.join(klubb).trim())}`
      : esc(v.underrad);
    under.style.display = v.underrad.trim() ? '' : 'none';
    under.style.background = `rgba(8,47,39,${v.underrad_ruta / 100})`;
    $('under').style.fontSize = v.underrad_storlek + 'px';
    $('under').style.left = $('under').style.right = Math.round((ctx.bredd - Math.max(v.bredd, 760) - 40) / 2) + 'px';

    $('logga').style.display = v.logga ? '' : 'none';
    $('logga').firstElementChild.style.height = v.logga + 'px';
    $('bana').textContent = v.bana;
    const plats = $('plats');
    plats.style.display = v.visa_bana && v.bana.trim() ? 'flex' : 'none';
    plats.style.fontSize = v.bana_storlek + 'px';
    plats.style.top = (H === 1920 ? 1500 : H - 108) + 'px';

    // layout (som film.html): största storlek där bredaste raden ryms och allt slutar ovanför säker yta;
    // sedan centreras blocket (logga, rubrik, underrad) i bilden, så långt säkra ytan tillåter
    const tak = H === 1920 ? 1240 : H - 110;
    const delar = [$('under')];
    let top = 540;
    const stapla = () => {
      r.style.top = top + 'px';
      let y = top + r.offsetHeight + v.luft_rubrik;
      for (const el of delar) { el.style.top = y + 'px'; y += el.offsetHeight + v.luft_rubrik; }
      return y - v.luft_rubrik;
    };
    const w = () => Math.max(...[...r.querySelectorAll('.ord')].map(bredd));
    let fs = v.rubrik, avHojden = false;
    r.style.fontSize = fs + 'px';
    while ((w() > v.bredd || stapla() > tak) && fs > 60) { avHojden ||= w() <= v.bredd; r.style.fontSize = (--fs) + 'px'; }
    const lh = v.logga ? $('logga').offsetHeight : 0, luft = v.logga ? v.luft_logga : 0;
    const blockTopp = top - luft - lh, h = stapla() - blockTopp;
    const mitt = Math.min(H === 1920 ? 960 : Math.round(H * 0.47), tak - h / 2) + v.hojd;
    top += Math.round(mitt - (blockTopp + h / 2));
    const botten = stapla();
    $('logga').style.top = (top - luft - lh) + 'px';

    const varningar = [];
    if (avHojden) varningar.push(`Etiketten krymptes till ${fs} px för att blocket ska rymmas i höjden.`);
    if (botten > tak) varningar.push('Underraden går ned i nedre säkerhetszonen. Minska storlekar eller flytta upp blocket.');
    if (top - luft - lh < ctx.osakra.find(z => z.zone === 'top').y1) varningar.push('Loggan går upp i övre säkerhetszonen. Flytta ned blocket.');
    this.matt = { rubrik_px: fs, varningar };
  },
  info() { return this.matt; },
  rita() { /* stillbild: allt ritas i forbered */ },
});
</script>
</body>
</html>
