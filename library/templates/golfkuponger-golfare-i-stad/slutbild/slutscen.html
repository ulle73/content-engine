<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<!-- Animerad slutscen i stället för svingloggan (feedback + Jonas 2026-10-29). Varianter i location.hash:
     #portal  #direkt        loggan i fast form tonar in, texten slår ner som i filmen (slam med djup, guldglans)
     #portal-anim #direkt-anim  samma text; loggplatsen lämnas tom – den animerade svingloggan (mindre) läggs på i ffmpeg
     window.frame(t) ritar bildrutan vid t sekunder (slutscen.mjs). Slutläget = de godkända stillbilderna slutbild-*.png. -->
<style>
@font-face{font-family:Anton;src:url(../assets/anton.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../assets/inter-600.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../assets/inter-700.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(ellipse 80% 60% at 50% 42%,#173a2a 0%,#0f2a1e 55%,#081a12 100%);color:#fff;font-family:Inter,sans-serif;position:relative}
#skak{position:absolute;inset:0}
.c{position:absolute;left:0;right:0;text-align:center}
#logga img{display:block;margin:0 auto}
h1{font-family:Anton,sans-serif;font-weight:400;margin:0;line-height:1.02;letter-spacing:.5px;text-transform:uppercase;color:#F8F4EC}
.ord{display:inline-block;white-space:nowrap;position:relative;--d:0;
  text-shadow:calc(var(--d)*.12px) calc(var(--d)*.14px) 0 #0d4630,calc(var(--d)*.24px) calc(var(--d)*.28px) 0 #0c412c,
  calc(var(--d)*.36px) calc(var(--d)*.42px) 0 #0a3b28,calc(var(--d)*.48px) calc(var(--d)*.56px) 0 #093524,
  calc(var(--d)*.6px) calc(var(--d)*.7px) 0 #072f20,calc(var(--d)*.72px) calc(var(--d)*.84px) 0 #06291b,
  calc(var(--d)*.84px) calc(var(--d)*.98px) 0 #042317,calc(var(--d)*.96px) calc(var(--d)*1.12px) 0 #031d13,
  calc(var(--d)*1.6px) calc(var(--d)*2.2px) calc(var(--d)*1.6px) rgba(0,12,6,.55)}
.ord.g{color:#D9A93C}
.glans{position:absolute;left:0;top:-.3em;padding-top:.3em;text-shadow:none;
  background:linear-gradient(100deg,#C8922A 0%,#F2D27A 38%,#FFF1C4 50%,#F2D27A 62%,#C8922A 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{margin:0;font-weight:600}
.w{display:inline-block}
.kort{display:grid;grid-template-columns:repeat(2,370px);gap:24px;justify-content:center}
.kort>div{height:176px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(217,169,60,.55),0 10px 30px rgba(0,0,0,.35)}
.kort img{max-width:300px;max-height:150px}
#streck{height:6px;border-radius:3px;margin:14px auto 0;background:linear-gradient(90deg,#C8922A,#F2D27A,#C8922A);width:0}
</style></head>
<body><div id="skak">
<div id="portal" hidden>
  <div class="c logga" style="top:290px"><img src="../assets/logo-final.png" style="height:330px"></div>
  <div class="c" style="top:668px"><h1 style="font-size:96px"><span class="ord">Sök</span> <span class="ord g">Golfkuponger<span class="glans">Golfkuponger</span></span></h1>
    <p class="sub" style="font-size:46px;margin-top:10px">i din friskvårdsportal</p></div>
  <div class="c" style="top:864px"><div class="kort">
    <div><img src="portal-benifex.png"></div><div><img src="portal-epassi.jpg"></div>
    <div><img src="portal-soderberg-partners.jpg"></div><div><img src="portal-edenred.jpg"></div>
  </div></div>
</div>
<div id="direkt" hidden>
  <div class="c logga" style="top:330px"><img src="../assets/logo-final.png" style="height:470px"></div>
  <div class="c" style="top:880px"><h1 style="font-size:104px"><span class="ord">Ingen</span> <span class="ord">portal?</span></h1>
    <p class="sub" style="font-size:50px;margin-top:22px;line-height:1.3">Köp direkt på<br><span class="w url" style="position:relative"><span class="glansu" style="font-weight:700;font-size:64px;color:#D9A93C">golfkuponger.se</span></span></p>
    <div id="streck"></div></div>
</div>
</div>
<script>
const [VAR, ANIM] = (location.hash.slice(1) || 'portal').split('-');
const sc = document.getElementById(VAR); sc.hidden = false;
if (ANIM) sc.querySelector('.logga').style.visibility = 'hidden';
// underraden delas i ord som tonar upp ett i taget
sc.querySelectorAll('.sub').forEach(p => p.childNodes.forEach(n => { if (n.nodeType === 3 && n.textContent.trim())
  n.replaceWith(...n.textContent.split(/(\s+)/).map(s => { if (!s.trim()) return document.createTextNode(s); const e = document.createElement('span'); e.className = 'w'; e.textContent = s; return e; })); }));
const $$ = s => [...sc.querySelectorAll(s)];
const ORD = $$('.ord'), W = $$('.sub .w'), KORT = $$('.kort>div'), LOGGA = sc.querySelector('.logga');
const kl = x => Math.max(0, Math.min(1, x)), ut3 = x => 1 - Math.pow(1 - kl(x), 3);
const back = x => { x = kl(x); const s = 1.9; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
// tider: med animerad logga börjar texten när svinget är på väg (loggan tar ~1,7 s)
const T0 = ANIM ? 0.75 : 0.32, SLAG = 0.24, LAND = 0.17;
const landar = ORD.map((_, i) => T0 + i * SLAG + LAND);
const SUB = landar[landar.length - 1] + 0.18;
window.frame = t => {
  if (LOGGA && !ANIM) { const p = ut3(t / 0.5); LOGGA.style.opacity = p; LOGGA.style.transform = `scale(${0.9 + 0.1 * p})`; }
  let skak = 0;
  ORD.forEach((el, i) => {
    const t0 = T0 + i * SLAG, p = kl((t - t0) / LAND), q = p * p;
    el.style.opacity = kl((t - t0) / 0.06);
    el.style.transform = `scale(${2.3 - 1.3 * q})`;
    el.style.filter = p < 1 ? `blur(${(1 - q) * 9}px)` : 'none';
    el.style.setProperty('--d', t < landar[i] ? 0 : 10 * ut3((t - landar[i]) / 0.25));
    const e = t - landar[i]; if (e > 0 && e < 0.28) skak += 7 * (1 - e / 0.28) * Math.sin(e * 70);
    const gl = el.querySelector('.glans'); if (gl) gl.style.backgroundPosition = `${100 - 100 * ut3((t - landar[i] - 0.15) / 0.9)}% 0`;
  });
  sc.parentElement.style.transform = `translate(${skak * 0.6}px,${skak}px)`;
  W.forEach((w, i) => { const p = ut3((t - SUB - i * 0.07) / 0.35); w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 24}px)`; });
  const KT = SUB + W.length * 0.07 + 0.1;
  KORT.forEach((k, i) => { const a = KT + i * 0.11, p = kl((t - a) / 0.38); k.style.opacity = kl((t - a) / 0.12); k.style.transform = `scale(${0.55 + 0.45 * back(p)})`; });
  const url = sc.querySelector('.glansu');
  if (url) { const a = SUB + W.length * 0.07 + 0.15, p = ut3((t - a) / 0.4);
    url.parentElement.style.opacity = p; url.parentElement.style.transform = `translateY(${(1 - p) * 24}px)`;
    url.style.background = 'linear-gradient(100deg,#C8922A 0%,#F2D27A 38%,#FFF1C4 50%,#F2D27A 62%,#C8922A 100%)';
    url.style.backgroundSize = '260% 100%'; url.style.webkitBackgroundClip = 'text'; url.style.webkitTextFillColor = 'transparent';
    url.style.backgroundPosition = `${100 - 100 * ut3((t - a - 0.2) / 0.9)}% 0`;
    sc.querySelector('#streck').style.width = `${560 * ut3((t - a - 0.25) / 0.5)}px`; }
};
window.frame(location.search.includes('slut') ? 99 : 0);
</script>
</body></html>
