<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<!-- Slutmallar för Golfkuponger (Jonas 2026-11-16): den rörliga svingloggan överst, två textrader som byts fritt och portalerna.
     Parametrar i adressen:  ?mall=alla|epassi|benify|sp|edenred  &r1=<rad 1, liten guldrad>  &r2=<rad 2, stor rubrik>
                              &h=1350 (4:5)  &logga=1 (fast logga i stället för tom plats – för förhandsvisning i webbläsaren)
     *ord* i rad 2 blir guld med glans. window.frame(t) ritar bildrutan vid t sekunder (render.mjs); window.INFO har tiderna. -->
<style>
@font-face{font-family:Anton;src:url(assets/anton.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(assets/inter-600.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(assets/inter-700.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(ellipse 80% 60% at 50% 42%,#173a2a 0%,#0f2a1e 55%,#081a12 100%);color:#fff;font-family:Inter,sans-serif;position:relative}
#skak{position:absolute;inset:0}
#logga{position:absolute;left:0;right:0;text-align:center}
#logga img{height:100%}
#blk{position:absolute;left:151px;right:151px;display:flex;flex-direction:column;align-items:center;text-align:center}
#kick{display:flex;align-items:center;gap:22px;white-space:nowrap}
#kick .t{font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#D9A93C;
  background:linear-gradient(100deg,#C8922A 0%,#F2D27A 38%,#FFF1C4 50%,#F2D27A 62%,#C8922A 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-right:-.16em}
#kick .l{height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(217,169,60,0),#D9A93C);width:0}
#kick .l.h{transform:scaleX(-1)}
h1{font-family:Anton,sans-serif;font-weight:400;margin:0;line-height:1.04;letter-spacing:.5px;text-transform:uppercase;color:#F8F4EC}
h1 .rad{display:block;white-space:nowrap}
.ord{display:inline-block;white-space:nowrap;position:relative;--d:0;
  text-shadow:calc(var(--d)*.12px) calc(var(--d)*.14px) 0 #0d4630,calc(var(--d)*.24px) calc(var(--d)*.28px) 0 #0c412c,
  calc(var(--d)*.36px) calc(var(--d)*.42px) 0 #0a3b28,calc(var(--d)*.48px) calc(var(--d)*.56px) 0 #093524,
  calc(var(--d)*.6px) calc(var(--d)*.7px) 0 #072f20,calc(var(--d)*.72px) calc(var(--d)*.84px) 0 #06291b,
  calc(var(--d)*.84px) calc(var(--d)*.98px) 0 #042317,calc(var(--d)*.96px) calc(var(--d)*1.12px) 0 #031d13,
  calc(var(--d)*1.6px) calc(var(--d)*2.2px) calc(var(--d)*1.6px) rgba(0,12,6,.55)}
.ord.g{color:#D9A93C}
.glans{position:absolute;left:0;top:-.3em;padding-top:.3em;text-shadow:none;
  background:linear-gradient(100deg,#C8922A 0%,#F2D27A 38%,#FFF1C4 50%,#F2D27A 62%,#C8922A 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#cta{margin:0;font-weight:600;font-size:34px;color:#F8F4EC}
#cta .w{display:inline-block}
#cta b{font-weight:700;color:#D9A93C}
.kort{display:grid;gap:18px;justify-content:center}
.kort>div{background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  box-shadow:0 0 0 2px rgba(217,169,60,.6),0 10px 30px rgba(0,0,0,.35)}
.kort>div::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,241,196,.55) 50%,transparent 65%);
  transform:translateX(var(--sv,-120%))}
.kort img{display:block}
</style></head>
<body><div id="skak">
<div id="logga"><img src="assets/logo-final.png"></div>
<div id="blk">
  <div id="kick"><span class="l h"></span><span class="t"></span><span class="l"></span></div>
  <h1></h1>
  <p id="cta"></p>
  <div class="kort"></div>
</div>
</div>
<script type="module">
// typsnitten måste vara laddade innan texten mäts
await Promise.all(['400 100px Anton', '700 40px Inter', '600 34px Inter'].map(f => document.fonts.load(f)));
// ---- mallarna: CTA-raden och portalkorten (bilderna är portalernas egna loggor, samma som i Golfare i <stad>-slutscenen)
const PORTALER = {
  benify: { namn: 'Benifex', bild: 'portal-benifex.png' },
  epassi: { namn: 'Epassi', bild: 'portal-epassi.jpg' },
  sp: { namn: 'Söderberg & Partners', bild: 'portal-soderberg-partners.jpg', hos: true },
  edenred: { namn: 'Edenred', bild: 'portal-edenred.jpg' },
};
const MALLAR = {
  alla: { cta: 'Sök <b>Golfkuponger</b> i din portal', kort: ['benify', 'epassi', 'sp', 'edenred'] },
  ...Object.fromEntries(Object.entries(PORTALER).map(([k, p]) => [k, { cta: `Sök <b>Golfkuponger</b> ${p.hos ? 'hos' : 'i'} ${p.namn}`, kort: [k] }])),
};
const Q = new URLSearchParams(location.search);
const MALL = MALLAR[Q.get('mall')] ? Q.get('mall') : 'alla', M = MALLAR[MALL];
const R1 = (Q.get('r1') ?? 'Friskvårdsbidrag kvar?').trim(), R2 = (Q.get('r2') ?? 'Det brinner inne 31/12').trim();
const H = +(Q.get('h') || 1920);
for (const el of [document.documentElement, document.body]) el.style.height = H + 'px';

// ---- layout (9:16): loggan y 286–546, blocket från 590 och ned till högst 1240 (safe zones: topp 270, botten 35 % → 1248)
const LOGGA_TOP = 290, LOGGA_H = 260, BLK_TOP = 584, BLK_BOTTEN = 1240, BREDD = 778;
const logga = document.getElementById('logga');
logga.style.top = LOGGA_TOP + 'px'; logga.style.height = LOGGA_H + 'px';
if (Q.get('logga') !== '1') logga.style.visibility = 'hidden';   // den animerade svingloggan läggs dit i ffmpeg
const blk = document.getElementById('blk'); blk.style.top = BLK_TOP + 'px';

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// rad 1: liten guldrad med streck på båda sidor; storleken krymper så att den ryms
const kick = document.getElementById('kick'), kt = kick.querySelector('.t');
kt.textContent = R1; kick.hidden = !R1;
// rad 2: orden slår ner ett i taget; *ord* blir guld
const ORD2 = R2.split(/\s+/).filter(Boolean).map(w => { const g = /^\*.+\*$/.test(w); return { w: g ? w.slice(1, -1) : w, g }; });
const ordHtml = o => o.g ? `<span class="ord g">${esc(o.w)}<span class="glans">${esc(o.w)}</span></span>` : `<span class="ord">${esc(o.w)}</span>`;
const h1 = document.querySelector('h1');
const cta = document.getElementById('cta');
cta.innerHTML = M.cta.split(/(<b>.*?<\/b>|\s+)/).filter(Boolean).map(s => /^\s+$/.test(s) ? ' ' : `<span class="w">${s}</span>`).join('');
const kort = document.querySelector('.kort'), EN = M.kort.length === 1;
kort.style.gridTemplateColumns = EN ? '480px' : 'repeat(4,180px)';
kort.style.gap = EN ? '0' : '12px';
kort.innerHTML = M.kort.map(k => `<div style="height:${EN ? 190 : 112}px;border-radius:${EN ? 22 : 16}px"><img src="assets/${PORTALER[k].bild}" style="height:${EN ? 176 : 104}px"></div>`).join('');

// rad 1 i storlek 42 px eller mindre så att den (med strecken) ryms i bredden
let kfs = 42; kt.style.fontSize = kfs + 'px';
while (kt.getBoundingClientRect().width + 2 * (40 + 22) > BREDD && kfs > 24) kt.style.fontSize = --kfs + 'px';

// rubriken: en rad om den blir minst 118 px, annars två balanserade rader; krymp tills blocket ryms över 1240
function layout(max) {
  const prov = (rader, fs) => { h1.style.fontSize = fs + 'px'; h1.innerHTML = rader.map(r => `<span class="rad">${r.map(ordHtml).join(' ')}</span>`).join(''); };
  const bredast = rader => { prov(rader, 100); return Math.max(...[...h1.querySelectorAll('.rad')].map(r => r.getBoundingClientRect().width)) / 100; };
  const alt = [[ORD2]];
  for (let i = 1; i < ORD2.length; i++) alt.push([ORD2.slice(0, i), ORD2.slice(i)]);
  const val = alt.map(r => ({ r, fs: Math.min(r.length === 1 ? 150 : max, Math.floor(BREDD / bredast(r))) }));
  const en = val[0], tva = val.slice(1).sort((a, b) => b.fs - a.fs)[0];
  return en.fs >= 118 || !tva ? en : tva;
}
let max = 150, val;
for (; max >= 70; max -= 4) {
  val = layout(max); h1.style.fontSize = val.fs + 'px';
  h1.innerHTML = val.r.map(r => `<span class="rad">${r.map(ordHtml).join(' ')}</span>`).join('');
  // Å/Ä/Ö på första raden sticker upp över versalhöjden: ge dem luft mot rad 1
  const prickar = /[ÅÄÖ]/i.test(val.r[0].map(o => o.w).join(''));
  h1.style.marginTop = Math.round(val.fs * (prickar ? 0.26 : 0.12)) + 'px';
  cta.style.marginTop = Math.round(14 + val.fs * 0.1) + 'px';
  kort.style.marginTop = '26px';
  if (blk.getBoundingClientRect().bottom <= BLK_BOTTEN) break;
}

// 4:5: loggan + blocket centreras i bildens höjd (räknat på blockets verkliga botten)
const BOTTEN = Math.round(blk.getBoundingClientRect().bottom);
const DY = H === 1920 ? 0 : Math.round(H / 2 - (LOGGA_TOP + BOTTEN) / 2);

// ---- rörelse
const $$ = s => [...document.querySelectorAll(s)];
const ORD = $$('h1 .ord'), W = $$('#cta .w'), KORT = $$('.kort>div'), LINJER = $$('#kick .l');
const kl = x => Math.max(0, Math.min(1, x)), ut3 = x => 1 - Math.pow(1 - kl(x), 3);
const back = x => { x = kl(x); const s = 1.9; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
// svingloggan tar ~1,7 s; rad 1 kommer när svinget är på väg, rad 2 slår ner efter
const T1 = 0.7, T2 = T1 + 0.45, SLAG = 0.2, LAND = 0.17;
const landar = ORD.map((_, i) => T2 + i * SLAG + LAND);
const SUB = (landar[landar.length - 1] ?? T2) + 0.2, KT = SUB + W.length * 0.06 + 0.12;
// läsregeln: all text i följd får max(5/6, tecken/12) + 0,9 s räknat från första texten
const TECKEN = R1.length + ORD2.map(o => o.w).join(' ').length + cta.textContent.length;
const LANGD = Math.max(4.2, +(T1 + Math.max(5 / 6, TECKEN / 12) + 0.9).toFixed(2));
window.INFO = { mall: MALL, r1: R1, r2: R2, cta: cta.textContent, tecken: TECKEN, langd: LANGD, rubrik_px: val.fs, rubrik_rader: val.r.length,
  rad1_px: kfs, botten: BOTTEN + DY, logga: { top: LOGGA_TOP + DY, h: LOGGA_H }, dy: DY };

window.frame = t => {
  let skak = 0;
  // rad 1: strecken växer ut från mitten, texten spärras ihop och glansen drar förbi
  const p1 = ut3((t - T1) / 0.5);
  kt.style.opacity = kl((t - T1) / 0.25); kt.style.letterSpacing = `${0.16 + 0.08 * (1 - p1)}em`;
  kt.style.backgroundPosition = `${100 - 100 * ut3((t - T1 - 0.2) / 1.0)}% 0`;
  LINJER.forEach(l => { l.style.width = `${40 * ut3((t - T1 - 0.15) / 0.45)}px`; });
  // rad 2: slam med djup och skak (som i Golfare i <stad>)
  ORD.forEach((el, i) => {
    const t0 = T2 + i * SLAG, p = kl((t - t0) / LAND), q = p * p;
    el.style.opacity = kl((t - t0) / 0.06);
    el.style.transform = `scale(${2.3 - 1.3 * q})`;
    el.style.filter = p < 1 ? `blur(${(1 - q) * 9}px)` : 'none';
    el.style.setProperty('--d', t < landar[i] ? 0 : 10 * ut3((t - landar[i]) / 0.25));
    const e = t - landar[i]; if (e > 0 && e < 0.28) skak += 6 * (1 - e / 0.28) * Math.sin(e * 70);
    const gl = el.querySelector('.glans'); if (gl) gl.style.backgroundPosition = `${100 - 100 * ut3((t - landar[i] - 0.15) / 0.9)}% 0`;
  });
  document.getElementById('skak').style.transform = `translate(${skak * 0.6}px,${skak + DY}px)`;
  // CTA-raden tonar upp ord för ord, korten poppar in och svävar sedan svagt; en ljusglans drar över dem var 2,4 s
  W.forEach((w, i) => { const p = ut3((t - SUB - i * 0.06) / 0.35); w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 24}px)`; });
  KORT.forEach((k, i) => {
    const a = KT + i * 0.11, p = kl((t - a) / 0.38), sv = Math.sin((t - a) * 2.2 + i * 1.3) * 3 * kl((t - a - 0.4) / 0.6);
    k.style.opacity = kl((t - a) / 0.12); k.style.transform = `translateY(${sv}px) scale(${0.55 + 0.45 * back(p)})`;
    const g = ((t - a - 0.5) % 2.4 + 2.4) % 2.4, gp = t - a - 0.5 < 0 ? -1 : kl(g / 0.7);
    k.style.setProperty('--sv', `${-120 + 240 * gp}%`);
  });
};
window.frame(Q.has('slut') ? 99 : 0);
</script>
</body></html>
