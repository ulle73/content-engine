<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #01170F;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Global film finish (registry: vignette + grain-overlay, made seek-safe) */
      #hf-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 90;
        background: radial-gradient(ellipse at center, transparent 58%, rgba(1, 23, 15, 0.42) 100%);
      }
      #grain-overlay {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 100;
      }
      #grain-overlay .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.07;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-far1" id="root" data-composition-id="main" data-start="0" data-duration="30.546" data-width="1080" data-height="1080">
      <div data-hf-id="hf-pc1a" id="el-01-kroken" class="scene" data-composition-id="01-kroken" data-composition-src="compositions/frames/01-kroken.html" data-start="0" data-duration="4.764" data-track-index="0"></div>

      <div data-hf-id="hf-1ise" id="el-02-svaret" class="scene" data-composition-id="02-svaret" data-composition-src="compositions/frames/02-svaret.html" data-start="4.364" data-duration="6.418" data-track-index="1"></div>

      <div data-hf-id="hf-ow5m" id="el-03-vad-det-tacker" class="scene" data-composition-id="03-vad-det-tacker" data-composition-src="compositions/frames/03-vad-det-tacker.html" data-start="10.181999999999999" data-duration="4.864" data-track-index="0"></div>

      <div data-hf-id="hf-3tuy" id="el-04-klubbar" class="scene" data-composition-id="04-klubbar" data-composition-src="compositions/frames/04-klubbar.html" data-start="14.546" data-duration="6.318" data-track-index="1"></div>

      <div data-hf-id="hf-5hsh" id="el-05-portaler" class="scene" data-composition-id="05-portaler" data-composition-src="compositions/frames/05-portaler.html" data-start="20.363999999999997" data-duration="4.964" data-track-index="0"></div>

      <div data-hf-id="hf-wdhx" id="el-06-avslut" class="scene" data-composition-id="06-avslut" data-composition-src="compositions/frames/06-avslut.html" data-start="24.727999999999998" data-duration="5.818" data-track-index="1"></div>

      <!-- BGM -->
      <audio data-hf-id="hf-6532" id="el-bgm" src="assets/soundtrack.wav" data-start="0" data-duration="30.546" data-track-index="11" data-volume="1"></audio>

      <div data-hf-id="hf-t2aa" id="hf-vignette"></div>
      <div data-hf-id="hf-mkrp" id="grain-overlay" data-hidden=""><div data-hf-id="hf-0qtj" class="grain-texture"></div></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-kroken", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4.364);
        tl.fromTo("#el-02-svaret", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4.364);
        tl.to("#el-02-svaret", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 10.182);
        tl.fromTo("#el-03-vad-det-tacker", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 10.182);
        tl.to("#el-03-vad-det-tacker", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14.546);
        tl.fromTo("#el-04-klubbar", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14.546);
        tl.to("#el-04-klubbar", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 20.364);
        tl.fromTo("#el-05-portaler", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 20.364);
        tl.to("#el-05-portaler", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 24.728);
        tl.fromTo("#el-06-avslut", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 24.728);
        tl.to({}, { duration: 30.546 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
      (function () {
        const tl = window.__timelines["main"];
        const total = 30.546;
        // Vignette eases off over the cream portal frame (20.364–24.728s) so the paper stays clean.
        tl.fromTo("#hf-vignette", { opacity: 1 }, { opacity: 0.25, duration: 0.4, ease: "power2.out" }, 20.364);
        tl.to("#hf-vignette", { opacity: 1, duration: 0.4, ease: "power2.out" }, 24.728);
        // Deterministic film-grain jitter: 12 positions per second, derived from the index (no Math.random).
        const grain = "#grain-overlay .grain-texture";
        const step = 1 / 12;
        for (let i = 0; i * step < total; i++) {
          const x = (Math.sin(i * 12.9898) * 43758.5453) % 1;
          const y = (Math.sin(i * 78.233) * 12543.1234) % 1;
          tl.set(grain, { xPercent: x * 12, yPercent: y * 12 }, i * step);
        }
      })();
    </script>
  </body>
</html>
