  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var PREFIX = "05-portaler-";
      var BEAT = 60 / 165; // music grid: 165 BPM -> 0.3636s
      var DURATION = 4.364;
      var CQ = 1080 / 100; // 1cqw in px on the 1080 canvas (transform offsets are authored in px)

      var byId = function (name) { return document.getElementById(PREFIX + name); };
      var toArray = function (list) { return Array.prototype.slice.call(list); };

      var stage = byId("stage");
      var label = byId("label");
      var headline = byId("headline");
      var words = toArray(headline.getElementsByClassName(PREFIX + "word"));
      var rule = byId("rule");
      var ghosts = toArray(byId("grid").getElementsByClassName(PREFIX + "ghost"));
      var lead = byId("lead");
      var url = byId("url");
      var underline = byId("underline");

      var tl = gsap.timeline({ paused: true });

      // Camera: one barely-there pull-back under the whole shot (zoom-OUT in miniature) —
      // alive but resting, and it only ever moves content inward, never past the 7cqw safe margin.
      tl.fromTo(stage, { scale: 1 }, { scale: 0.988, duration: DURATION, ease: "none" }, 0);

      // ---------- Scene 1 (0.000-0.727): label + headline, soft rise + blur-to-sharp ----------
      tl.fromTo(
        label,
        { opacity: 0, y: 1.4 * CQ, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
        0.06
      );
      words.forEach(function (word, i) {
        tl.fromTo(
          word,
          { opacity: 0, y: 3 * CQ, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.95, ease: "expo.out" },
          0.14 + i * 0.07
        );
      });
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 0.46);
      // The empty grid region is established before the first card arrives.
      tl.fromTo(ghosts, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out", stagger: 0.05 }, 0.3);

      // ---------- Scene 2 (0.727-2.182): logo-cards assemble one per beat ----------
      // dynamic-content-sequencing: content array -> flat pre-computed TIMELINE (start/end), built once.
      var PORTALS = [
        { key: "benifex", beats: 1 },
        { key: "epassi", beats: 1 },
        { key: "soderberg", beats: 1 },
        { key: "edenred", beats: 1 }
      ];
      var cursor = 2 * BEAT; // first card on beat 2 = 0.727s (click SFX)
      var SEQUENCE = PORTALS.map(function (entry) {
        var start = cursor;
        cursor += entry.beats * BEAT;
        return { key: entry.key, start: start, end: cursor };
      });
      SEQUENCE.forEach(function (item) {
        var card = byId("card-" + item.key);
        var logo = byId("logo-" + item.key);
        tl.fromTo(
          card,
          { opacity: 0, y: 3.2 * CQ, scale: 0.985, filter: "blur(7px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.64, ease: "power3.out" },
          item.start
        );
        tl.fromTo(
          logo,
          { opacity: 0, y: 0.9 * CQ },
          { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" },
          item.start + 0.05
        );
      });

      // ---------- Scene 3 (2.182-4.364): closing line under the grid, then hold ----------
      var T_FOOT = 7 * BEAT; // 2.545s
      tl.fromTo(
        lead,
        { opacity: 0, y: 1.8 * CQ, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        T_FOOT
      );
      tl.fromTo(
        url,
        { opacity: 0, y: 1.8 * CQ, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        T_FOOT + 0.09
      );
      tl.fromTo(underline, { scaleX: 0 }, { scaleX: 1, duration: 0.75, ease: "expo.out" }, 8 * BEAT);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-portaler"] = tl;
    })();
  </script>
