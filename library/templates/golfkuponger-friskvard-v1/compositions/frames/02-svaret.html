  <div data-hf-id="hf-fndt" id="root" data-composition-id="02-svaret" data-start="0" data-duration="6.418" data-width="1080" data-height="1080">
    <div data-hf-id="hf-0u3p" id="02-svaret-bg" class="clip" data-start="0" data-duration="6.418" data-track-index="0">
      <img data-hf-id="hf-j4zr" id="02-svaret-bg-img" src="assets/experiment-card-v1.jpg" alt="">
      <div data-hf-id="hf-ffzc" id="02-svaret-scrim"></div>
    </div>

    <div data-hf-id="hf-ujo4" id="02-svaret-head">
      <div data-hf-id="hf-y5z1" id="02-svaret-l1" class="02-svaret-line"><span data-hf-id="hf-izea" class="02-svaret-w">Det</span> <span data-hf-id="hf-fhq5" class="02-svaret-w">kan</span> <span data-hf-id="hf-s9vm" class="02-svaret-w">hen.</span></div>
      <div data-hf-id="hf-2432" id="02-svaret-l2" class="02-svaret-line"><span data-hf-id="hf-nz1l" class="02-svaret-w">Med</span> <span data-hf-id="hf-n6d1" class="02-svaret-w"><span data-hf-id="hf-juse" id="02-svaret-gold">friskvårdsbidraget</span><span data-hf-id="hf-xhi0" id="02-svaret-dot">.</span></span></div>
    </div>

    <div data-hf-id="hf-tno8" id="02-svaret-fig">
      <div data-hf-id="hf-fhog" id="02-svaret-fig-text">0</div>

    <div data-hf-id="hf-a5b8" id="02-svaret-rule"></div>
    <div data-hf-id="hf-u640" id="02-svaret-sub">per år – skattefritt</div>
    <div data-hf-id="hf-t0mb" id="02-svaret-fine">Arbetsgivaren bestämmer beloppet.</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";

      // Music grid: 165 BPM -> one beat = 0.3636s. Every cue sits on it.
      var B = 60 / 165;
      var T_LINE2 = 3 * B; //  1.091  "Med friskvårdsbidraget."
      var T_SWAP = 6 * B; //   2.182  headline steps up, count starts
      var T_LAND = 10 * B; //  3.636  figure lands (soft impact)
      var T_SUB = 11 * B; //   4.000  "per år – skattefritt"
      var T_SHINE = 12 * B; // 4.364  gold specular sweep (sparkle)
      var T_FINE = 13 * B; //  4.727  small print
      var DURATION = 5.818;

      var el = function (id) {
        return document.getElementById(id);
      };
      var bgImg = el("02-svaret-bg-img");
      var scrim = el("02-svaret-scrim");
      var head = el("02-svaret-head");
      var l1Words = Array.prototype.slice.call(el("02-svaret-l1").children);
      var l2Words = Array.prototype.slice.call(el("02-svaret-l2").children);
      var fig = el("02-svaret-fig");
      var figText = el("02-svaret-fig-text");
      var num = figText; // digits are the figure's own text node; "kr" is its ::after
      var rule = el("02-svaret-rule");
      var sub = el("02-svaret-sub");
      var fine = el("02-svaret-fine");

      var CQ = 1080 / 100; // 1cqw / 1cqh in px on the 1080x1080 canvas

      // Swedish thousands grouping: 5000 -> "5 000". Integers only.
      var fmt = function (value) {
        var n = Math.round(value);
        if (n < 1000) return String(n);
        var rest = n % 1000;
        return Math.floor(n / 1000) + " " + (rest < 10 ? "00" : rest < 100 ? "0" : "") + rest;
      };

      var tl = gsap.timeline({ paused: true });

      // ---- Ground: slow push-in on the misty course plate (whole shot) ----
      tl.fromTo(bgImg, { scale: 1 }, { scale: 1.07, duration: DURATION, ease: "none" }, 0);

      // ---- Text entrance helper: soft rise + blur-to-sharp, per word ----
      var riseIn = function (words, at, stagger) {
        tl.fromTo(
          words,
          { yPercent: 42 },
          { yPercent: 0, duration: 1.1, ease: "expo.out", stagger: stagger },
          at,
        );
        tl.fromTo(
          words,
          { opacity: 0, filter: "blur(14px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "power2.out", stagger: stagger },
          at,
        );
      };

      // ---- Scene 1 (0.000): "Det kan hen." ----
      riseIn(l1Words, 0, B / 4);

      // ---- Scene 2 (1.091): "Med friskvårdsbidraget." ----
      riseIn(l2Words, T_LINE2, B / 4);

      // ---- Scene 3 (2.182): scale-swap — headline steps up + shrinks, figure arrives ----
      tl.fromTo(
        head,
        { y: 0, scale: 1, opacity: 1 },
        { y: -8.5 * CQ, scale: 0.78, opacity: 0.92, duration: 2 * B, ease: "power3.inOut" },
        T_SWAP,
      );

      // counting-dynamic-scale: value + scale share timing and ease
      var COUNT_DUR = T_LAND - T_SWAP; // 1.4545s
      // gentle ease-out: digits keep ticking right up to the 3.636s impact
      var COUNT_EASE = "power1.out";
      var START_SCALE = 0.5;
      var counter = { value: 0 };
      tl.fromTo(
        counter,
        { value: 0 },
        {
          value: 5000,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            num.textContent = fmt(counter.value);
          },
        },
        T_SWAP,
      );
      tl.fromTo(
        fig,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        T_SWAP,
      );
      // incoming of the swap: blur-to-sharp, sits above the outgoing headline
      tl.fromTo(
        fig,
        { opacity: 0, filter: "blur(18px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.62, ease: "power2.out" },
        T_SWAP,
      );

      // ---- Scene 4 (3.636): landing — gold rule draws, light lifts, subline rises ----
      tl.fromTo(
        rule,
        { scaleX: 0 },
        { scaleX: 1, duration: T_SUB - T_LAND, ease: "power3.out" },
        T_LAND,
      );
      tl.fromTo(scrim, { opacity: 1 }, { opacity: 0.84, duration: 0.12, ease: "power2.out" }, T_LAND);
      tl.fromTo(
        scrim,
        { opacity: 0.84 },
        { opacity: 1, duration: 1.1, ease: "sine.inOut", immediateRender: false },
        T_LAND + 0.12,
      );
      tl.fromTo(
        sub,
        { opacity: 0, yPercent: 60, filter: "blur(8px)" },
        { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        T_SUB,
      );

      // ---- Scene 5 (4.364): one gold specular sweep through the figure (text-shimmer) ----
      tl.fromTo(
        figText,
        { backgroundPosition: "90% 50%" },
        { backgroundPosition: "10% 50%", duration: 0.9, ease: "sine.inOut" },
        T_SHINE,
      );

      // ---- 4.727: small print, then hold ----
      tl.fromTo(
        fine,
        { opacity: 0, y: 0.8 * CQ },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        T_FINE,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["02-svaret"] = tl;
    })();
  </script>
