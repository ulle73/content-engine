  <script>
    (function () {
      // Music grid: 165 BPM -> one beat = 60/165 s (0.3636s). Every cue sits on it.
      var BEAT = 60 / 165;

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.000-1.091s): photo pull-back settle + label/headline ----
      // Photo: slightly oversized -> at rest by 2.0s (front-half pull-back), then still.
      tl.fromTo(
        "#f03-vad-det-tacker-photo",
        { scale: 1.1 },
        { scale: 1, duration: 2.0, ease: "power2.out" },
        0
      );

      // Gold hairline draws, gold label rises blur-to-sharp (half-beat in).
      tl.fromTo(
        "#f03-vad-det-tacker-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.85, ease: "expo.out" },
        BEAT * 0.5
      );
      tl.fromTo(
        "#f03-vad-det-tacker-label",
        { opacity: 0, y: 14, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" },
        BEAT * 0.5
      );

      // Headline: soft rise + blur-to-sharp per word, sixteenth-note cascade from beat 1.
      var WORDS = [
        "#f03-vad-det-tacker-w1",
        "#f03-vad-det-tacker-w2",
        "#f03-vad-det-tacker-w3",
        "#f03-vad-det-tacker-w4"
      ];
      WORDS.forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { opacity: 0, y: 44, filter: "blur(12px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" },
          BEAT + i * (BEAT / 4)
        );
      });

      // ---- Scene 2 (1.091-2.182s): four chips assemble, one per beat ----
      // dynamic-content-sequencing: the item TIMELINE is pre-computed once at build
      // (beats 3,4,5,6 -> 1.091 / 1.455 / 1.818 / 2.182s, the click-soft SFX cues);
      // items accumulate (co-resident), so each entry is an entrance, never a swap.
      var CHIPS = [
        { chip: "#f03-vad-det-tacker-chip-1", check: "#f03-vad-det-tacker-check-1", beat: 3 },
        { chip: "#f03-vad-det-tacker-chip-2", check: "#f03-vad-det-tacker-check-2", beat: 4 },
        { chip: "#f03-vad-det-tacker-chip-3", check: "#f03-vad-det-tacker-check-3", beat: 5 },
        { chip: "#f03-vad-det-tacker-chip-4", check: "#f03-vad-det-tacker-check-4", beat: 6 }
      ].map(function (entry) {
        return { chip: entry.chip, check: entry.check, start: entry.beat * BEAT };
      });

      CHIPS.forEach(function (entry) {
        // short rise + fade, no overshoot — the fade is quick so the chip reads solid
        // on the click; the rise settles a little longer underneath it.
        tl.fromTo(
          entry.chip,
          { opacity: 0 },
          { opacity: 1, duration: 0.24, ease: "power2.out" },
          entry.start
        );
        tl.fromTo(
          entry.chip,
          { y: 26 },
          { y: 0, duration: 0.65, ease: "expo.out" },
          entry.start
        );
        // gold check draws in on the off-beat after its chip lands
        tl.fromTo(
          entry.check,
          { strokeDashoffset: 1.1 },
          { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
          entry.start + BEAT * 0.5
        );
      });

      // ---- Scene 3 (2.182-4.364s): hold the full read still; photo at rest ----
      // (no exit — the root transition is the exit)

      window.__timelines = window.__timelines || {};
      window.__timelines["03-vad-det-tacker"] = tl;
    })();
  </script>
