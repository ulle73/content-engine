  <script>
    (function () {
      var COMP_ID = "04-klubbar";
      var root = document.querySelector('[data-composition-id="04-klubbar"]');
      function byId(id) { return root.querySelector('[id="' + id + '"]'); }
      function byClass(c) { return Array.prototype.slice.call(root.querySelectorAll('[class~="' + c + '"]')); }

      // Music grid: 165 BPM -> one beat = 0.3636s. Swaps every 4 beats.
      var BEAT = 60 / 165;
      var DUR = 16 * BEAT;                                  // 5.818s
      var SWAPS = [0, 4 * BEAT, 8 * BEAT, 12 * BEAT];       // 0 · 1.455 · 2.909 · 4.364
      var CLUBS = ["Bro Hof Slott", "Halmstad GK", "Falsterbo GK", "Österåker GK"];

      var photos = [byId("f04-klubbar-photo-1"), byId("f04-klubbar-photo-2"), byId("f04-klubbar-photo-3"), byId("f04-klubbar-photo-4")];
      var chars = byClass("f04-klubbar-ch");
      var words = byClass("f04-klubbar-w");
      var rule = byId("f04-klubbar-rule");
      var tag = byId("f04-klubbar-tag");
      var tagRule = byId("f04-klubbar-tagrule");
      var tagText = byId("f04-klubbar-tagtext");

      var DISSOLVE = BEAT;      // ~0.36s cross-dissolve per swap
      var PEAK_BLUR = 12;       // full-frame photo blur at the swap midpoint

      var tl = gsap.timeline({ paused: true });

      // ---------------- Photo cycle (scale-swap-transition, cross-dissolve flavour) ----------------
      // Photo 1 — opening plate: soft focus-pull + 106% -> 100% settle under the root crossfade.
      tl.fromTo(photos[0], { scale: 1.06 }, { scale: 1, duration: SWAPS[1], ease: "power3.out" }, 0);
      tl.fromTo(photos[0], { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 0);

      for (var i = 1; i < photos.length; i++) {
        var T = SWAPS[i];
        var settle = (i < photos.length - 1 ? SWAPS[i + 1] : DUR - 0.06) - T;
        var incoming = photos[i];
        var outgoing = photos[i - 1];

        // outgoing recedes out of focus underneath (incoming sits above it in z-order)
        tl.fromTo(outgoing,
          { filter: "blur(0px)" },
          { filter: "blur(" + PEAK_BLUR + "px)", duration: DISSOLVE, ease: "power2.in", immediateRender: false },
          T);

        // incoming dissolves in over one beat, sharpening as it arrives
        tl.fromTo(incoming, { opacity: 0 }, { opacity: 1, duration: DISSOLVE, ease: "power1.inOut" }, T);
        tl.fromTo(incoming,
          { filter: "blur(" + PEAK_BLUR + "px)" },
          { filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
          T);
        // ...and settles 106% -> 100% across its own 4-beat window
        tl.fromTo(incoming, { scale: 1.06 }, { scale: 1, duration: settle, ease: "power3.out" }, T);
      }

      // ---------------- Scene 1 — the anchor lands, then PINS ----------------
      // "300+" — blur-to-sharp, per glyph; gold "+" lands last.
      tl.fromTo(chars,
        { opacity: 0, y: 34, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out", stagger: 0.07 },
        0);

      // "golfklubbar i hela Sverige" — one beat later, word by word.
      tl.fromTo(words,
        { opacity: 0, y: 18, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out", stagger: 0.06 },
        BEAT);

      // Name-tag slides in on beat 2 (lower-left, above the caption band).
      var TAG_IN = 2 * BEAT; // 0.727
      tl.fromTo(tag,
        { x: -22, opacity: 0, clipPath: "inset(0% 100% 0% 0%)" },
        { x: 0, opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "expo.out" },
        TAG_IN);
      tl.fromTo(tagRule, { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, TAG_IN);
      tl.fromTo(tagText,
        { opacity: 0, x: -10, filter: "blur(6px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
        TAG_IN + 0.12);

      // ---------------- Scene 2 — name-tag token swap (discrete-text-sequence) ----------------
      var SEQUENCE = CLUBS.map(function (name, k) { return { t: SWAPS[k], text: name }; });
      function textAt(time) {
        for (var k = SEQUENCE.length - 1; k >= 0; k--) {
          if (time >= SEQUENCE[k].t) return SEQUENCE[k].text;
        }
        return SEQUENCE[0].text;
      }
      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var s = textAt(driver.t);
          if (tagText.textContent !== s) tagText.textContent = s;
        }
      }, 0);

      // On each swap beat: the text hard-cuts (above) and settles a few px into place,
      // while the gold left rule re-draws — a crisp tick on the beat, never a smear.
      for (var j = 1; j < SWAPS.length; j++) {
        tl.fromTo(tagText, { x: -8 }, { x: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, SWAPS[j]);
        tl.fromTo(tagRule, { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, SWAPS[j]);
      }

      // ---------------- Resolve — a gold hairline quietly joins the pinned lockup ----------------
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, 13 * BEAT);

      window.__timelines[COMP_ID] = tl;
    })();
  </script>
