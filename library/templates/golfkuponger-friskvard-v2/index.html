<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="motion-blur.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #01170F; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #01170F; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* film finish: vignette + animated grain (seek-safe jitter below) */
      #fx-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 90;
        background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, rgba(0, 10, 6, 0.55) 100%); }
      #fx-grain { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 100; }
      #fx-grain-tex { position: absolute; left: -25%; top: -25%; width: 150%; height: 150%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 300px 300px; opacity: 0.11; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-fmt="9x16" data-start="0" data-duration="25.0" data-width="1080" data-height="1920" data-fps="30">
      <div id="el-s1-hook" class="scene" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html" data-start="0.0" data-duration="3.00" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="el-s2-turn" class="scene" data-composition-id="s2-turn" data-composition-src="compositions/s2-turn.html" data-start="3.0" data-duration="4.00" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="el-s3-product" class="scene" data-composition-id="s3-product" data-composition-src="compositions/s3-product.html" data-start="7.0" data-duration="6.00" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="el-s4-portals" class="scene" data-composition-id="s4-portals" data-composition-src="compositions/s4-portals.html" data-start="13.0" data-duration="3.00" data-track-index="3" data-width="1080" data-height="1920"></div>
      <div id="el-s5-proof" class="scene" data-composition-id="s5-proof" data-composition-src="compositions/s5-proof.html" data-start="16.0" data-duration="5.00" data-track-index="4" data-width="1080" data-height="1920"></div>
      <div id="el-s6-cta" class="scene" data-composition-id="s6-cta" data-composition-src="compositions/s6-cta.html" data-start="21.0" data-duration="4.00" data-track-index="5" data-width="1080" data-height="1920"></div>
      <audio id="music" data-timeline-role="music" src="assets/soundtrack.wav" data-start="0" data-duration="25.0" data-track-index="20" data-volume="1"></audio>
      <div id="fx-vignette"></div>
      <div id="fx-grain"><div id="fx-grain-tex"></div></div>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        // deterministic film-grain jitter, 24 positions per second (hash of the index, no Math.random)
        const step = 1 / 24;
        for (let i = 0; i * step < 25.0; i++) {
          const x = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
          const y = Math.abs(Math.sin(i * 78.233) * 12543.1234) % 1;
          tl.set("#fx-grain-tex", { x: (x - 0.5) * 240, y: (y - 0.5) * 240 }, i * step);
        }
        tl.to({}, { duration: 25.0 }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
