<!doctype html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Playfair Display'; src: url("assets/fonts/playfair-500.woff2") format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: 'Playfair Display'; src: url("assets/fonts/playfair-500-italic.woff2") format('woff2'); font-weight: 500; font-style: italic; font-display: block; }
        @font-face { font-family: 'Inter'; src: url("assets/fonts/inter-600.woff2") format('woff2'); font-weight: 600; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #01170F; }
        #s6-in { position: absolute; inset: 0; }
        #s6-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 55% at 50% 38%, #0E4A33 0%, #062B1D 52%, #01170F 100%); }
        #s6-leak { position: absolute; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; border-radius: 50%; pointer-events: none;
          background: radial-gradient(closest-side, rgba(242, 200, 110, 0.32), rgba(214, 165, 54, 0.12) 50%, rgba(214, 165, 54, 0) 100%); }
        .s6-mote { position: absolute; border-radius: 50%; background: #F2D27A; box-shadow: 0 0 12px 3px rgba(242, 210, 122, 0.6); }
        #s6-cam { position: absolute; inset: 0; }
        #s6-emb { position: absolute; left: 50%; }
        #s6-embglow { position: absolute; left: -45%; top: -45%; width: 190%; height: 190%; border-radius: 50%; opacity: 0;
          background: radial-gradient(closest-side, rgba(255, 236, 180, 0.7), rgba(214, 165, 54, 0.22) 35%, rgba(214, 165, 54, 0) 70%); mix-blend-mode: screen; }
        /* specular glint running through the emblem's own gold (masked by the logo alpha) */
        #s6-glint { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
          -webkit-mask-image: url("assets/golfkuponger-logo.png"); mask-image: url("assets/golfkuponger-logo.png");
          -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
          background: linear-gradient(115deg, rgba(255, 255, 255, 0) 38%, rgba(255, 250, 225, 0.95) 50%, rgba(255, 255, 255, 0) 62%);
          background-size: 300% 100%; background-position: 100% 0; }
        #s6-emb img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #s6-word { position: absolute; left: 50%; display: block; }
        #s6-head { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Playfair Display', serif; font-weight: 500;
          color: #F8F4EC; line-height: 1.02; letter-spacing: -0.015em; white-space: nowrap; }
        #s6-head em { font-style: italic; color: #E9C46A; }
        .s6-m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.04em 0.12em; }
        .s6-w { display: inline-block; }
        #s6-url { position: absolute; left: 50%; display: flex; align-items: center; justify-content: center; border-radius: 999px;
          border: 3px solid #D6A536; background: rgba(1, 23, 15, 0.55); box-shadow: 0 0 40px rgba(214, 165, 54, 0.3); }
        #s6-urltext { color: #F2D27A; font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
          background: linear-gradient(100deg, #D6A536 0%, #F2D27A 40%, #FFF6DA 50%, #F2D27A 60%, #D6A536 100%); background-size: 280% 100%;
          background-position: 100% 0; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        #s6-sheen { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #s6-sheen i { position: absolute; top: -10%; left: -40%; width: 22%; height: 120%; display: block; transform: rotate(14deg);
          background: linear-gradient(90deg, rgba(255, 250, 230, 0), rgba(255, 250, 230, 0.55), rgba(255, 250, 230, 0)); mix-blend-mode: screen; }
        #s6-whiteout { position: absolute; inset: 0; background: #01170F; opacity: 0; pointer-events: none; }
      </style>

      <div id="root" data-composition-id="s6-cta" data-width="1080" data-height="1920" data-duration="4">
        <div id="s6-in">
          <div id="s6-bg"></div>
          <div id="s6-leak"></div>
          <div id="s6-motes"></div>
          <div id="s6-cam">
            <div id="s6-emb"><div id="s6-embglow"></div><img src="assets/golfkuponger-logo.png" alt=""><div id="s6-glint"></div></div>
            <img id="s6-word" src="assets/golfkuponger-loggan02-2026-04-10-cropped.png" alt="">
            <div id="s6-head"><span class="s6-m"><span class="s6-w">Låt chefen</span></span> <span class="s6-m"><span class="s6-w"><em>bjuda.</em></span></span></div>
            <div id="s6-url"><span id="s6-urltext">golfkuponger.se</span></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s6-cta"]');
          const $ = (s) => root.querySelector(s);
          const FMT = (root.closest('[data-fmt]') || { dataset: {} }).dataset.fmt || '9x16';
          const L = {
            '9x16': { H: 1920, ey: 700, es: 640, wy: 1110, ww: 760, hy: 1300, hs: 130, uy: 1590, uw: 740, uh: 132, us: 66 },
            '4x5':  { H: 1350, ey: 340, es: 420, wy: 610, ww: 600, hy: 770, hs: 104, uy: 990, uw: 620, uh: 112, us: 54 },
            '1x1':  { H: 1080, ey: 250, es: 330, wy: 460, ww: 520, hy: 590, hs: 90, uy: 800, uw: 560, uh: 100, us: 48 },
          }[FMT];
          Object.assign($('#s6-emb').style, { width: L.es + 'px', height: L.es + 'px', marginLeft: -L.es / 2 + 'px', top: (L.ey - L.es / 2) + 'px' });
          Object.assign($('#s6-word').style, { width: L.ww + 'px', marginLeft: -L.ww / 2 + 'px', top: L.wy + 'px' });
          Object.assign($('#s6-head').style, { top: L.hy + 'px', fontSize: L.hs + 'px' });
          Object.assign($('#s6-url').style, { top: L.uy + 'px', width: L.uw + 'px', height: L.uh + 'px', marginLeft: -L.uw / 2 + 'px' });
          $('#s6-urltext').style.fontSize = L.us + 'px';
          $('#s6-leak').style.left = '540px'; $('#s6-leak').style.top = L.ey + 'px';
          $('#s6-cam').style.transformOrigin = '50% ' + L.ey + 'px';
          // deterministic gold motes
          const motes = [];
          const hsh = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          for (let i = 0; i < 26; i++) {
            const m = document.createElement('div'); m.className = 's6-mote';
            const sz = 3 + hsh(i) * 7;
            Object.assign(m.style, { width: sz + 'px', height: sz + 'px', left: hsh(i + 50) * 1080 + 'px', top: hsh(i + 90) * L.H + 'px', opacity: (0.25 + hsh(i + 7) * 0.6).toFixed(2) });
            $('#s6-motes').appendChild(m); motes.push(m);
          }

          const tl = gsap.timeline({ paused: true });
          const REVEAL = 1.0;   // 22.00
          // whip in from the right (matches s5's whip out)
          tl.fromTo('#s6-in', { x: 1300, filter: 'blur(18px)' }, { x: 0, filter: 'blur(0px)', duration: 0.32, ease: 'power3.out' }, 0);
          tl.fromTo('#s6-leak', { x: 260, y: -120, scale: 0.9 }, { x: -200, y: 90, scale: 1.15, duration: 4, ease: 'sine.inOut' }, 0);
          motes.forEach((m, i) => tl.fromTo(m, { y: 0, x: 0 }, { y: -(60 + hsh(i + 3) * 160), x: (hsh(i + 11) - 0.5) * 80, duration: 4, ease: 'none' }, 0));
          tl.fromTo('#s6-cam', { scale: 1.0 }, { scale: 1.045, duration: 4, ease: 'power1.inOut' }, 0);

          // emblem: present but blurred and oversized, drifting — resolves exactly on 22.00
          tl.fromTo('#s6-emb img', { filter: 'blur(26px)', scale: 1.16, opacity: 0.85 }, { filter: 'blur(20px)', scale: 1.2, opacity: 0.9, duration: REVEAL, ease: 'none' }, 0);
          tl.to('#s6-emb img', { filter: 'blur(0px)', scale: 1.0, opacity: 1, duration: 0.6, ease: 'power3.out' }, REVEAL);
          // while blurred the emblem turns in space and snaps square on the reveal
          tl.fromTo('#s6-emb', { rotationY: -38, transformPerspective: 1400 }, { rotationY: 0, duration: 1.15, ease: 'power3.inOut' }, 0.1);
          tl.fromTo('#s6-embglow', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.1, duration: 0.18, ease: 'power2.out', immediateRender: false }, REVEAL);
          tl.to('#s6-embglow', { opacity: 0.25, scale: 1.0, duration: 1.2, ease: 'power2.out' }, REVEAL + 0.18);
          tl.set('#s6-embglow', { opacity: 0 }, 0);
          tl.fromTo('#s6-glint', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 0.7, ease: 'power2.inOut' }, REVEAL + 0.05);
          tl.fromTo('#s6-glint', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 0.8, ease: 'power2.inOut', immediateRender: false }, 3.0);
          // wordmark wipes on 22.50
          tl.fromTo('#s6-word', { clipPath: 'inset(0% 100% 0% 0%)', x: -20 }, { clipPath: 'inset(0% 0% 0% 0%)', x: 0, duration: 0.55, ease: 'power3.out' }, 1.5);
          // headline 23.00
          root.querySelectorAll('.s6-w').forEach((w, i) => tl.fromTo(w, { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: 'expo.out' }, 2.0 + i * 0.25));
          // url pill 23.50, shimmer on the final chord 24.00
          tl.fromTo('#s6-url', { opacity: 0, scale: 0.8, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: 'back.out(1.8)' }, 2.5);
          tl.fromTo('#s6-urltext', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 0.8, ease: 'power2.inOut' }, 3.0);
          tl.fromTo('#s6-url', { boxShadow: '0 0 40px rgba(214,165,54,0.3)' }, { boxShadow: '0 0 90px rgba(242,210,122,0.85)', duration: 0.2, ease: 'power2.out', immediateRender: false }, 3.0);
          tl.to('#s6-url', { boxShadow: '0 0 50px rgba(214,165,54,0.4)', duration: 0.8, ease: 'power2.out' }, 3.2);

          window.__timelines['s6-cta'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
