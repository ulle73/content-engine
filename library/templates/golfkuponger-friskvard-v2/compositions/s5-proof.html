<!doctype html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Anton'; src: url("assets/fonts/anton.woff2") format('woff2'); font-weight: 400; font-display: block; }
        @font-face { font-family: 'Inter'; src: url("assets/fonts/inter-600.woff2") format('woff2'); font-weight: 600; font-display: block; }
        @font-face { font-family: 'Inter'; src: url("assets/fonts/inter-700.woff2") format('woff2'); font-weight: 700; font-display: block; }
        @font-face { font-family: 'Playfair Display'; src: url("assets/fonts/playfair-500-italic.woff2") format('woff2'); font-weight: 500; font-style: italic; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #01170F; }
        #s5-whip { position: absolute; inset: 0; }
        .s5-ph { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
        .s5-ph img { position: absolute; top: 50%; left: 50%; display: block; }
        #s5-scrim { position: absolute; inset: 0; pointer-events: none;
          background: linear-gradient(180deg, rgba(1, 23, 15, 0.72) 0%, rgba(1, 23, 15, 0.35) 30%, rgba(1, 23, 15, 0) 48%, rgba(1, 23, 15, 0) 70%, rgba(1, 23, 15, 0.6) 100%); }
        #s5-fig { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Anton', sans-serif; line-height: 0.92; white-space: nowrap; }
        #s5-num { position: relative; display: inline-block; }
        #s5-num .ext { color: #8A6114; --d: 22;
          text-shadow:
            calc(var(--d) * 0.15px) calc(var(--d) * 0.2px) 0 #0d4630, calc(var(--d) * 0.3px) calc(var(--d) * 0.4px) 0 #0b3f2b,
            calc(var(--d) * 0.45px) calc(var(--d) * 0.6px) 0 #093524, calc(var(--d) * 0.6px) calc(var(--d) * 0.8px) 0 #072f20,
            calc(var(--d) * 0.75px) calc(var(--d) * 1.0px) 0 #052619, calc(var(--d) * 0.9px) calc(var(--d) * 1.2px) 0 #031d13,
            calc(var(--d) * 1.05px) calc(var(--d) * 1.4px) 0 #02170f, calc(var(--d) * 1.6px) calc(var(--d) * 2.4px) calc(var(--d) * 1.4px) rgba(0, 10, 5, 0.6); }
        #s5-num .face { position: absolute; left: 0; top: 0; background: linear-gradient(100deg, #C8922A 0%, #F2D27A 38%, #FFF1C4 50%, #F2D27A 62%, #C8922A 100%);
          background-size: 260% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        #s5-sub { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Inter', sans-serif; font-weight: 700; color: #F8F4EC;
          letter-spacing: 0.34em; text-transform: uppercase; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); }
        #s5-sverige { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
          color: #F8F4EC; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55); }
        #s5-tag { position: absolute; display: flex; align-items: center; height: 92px; padding: 0 40px 0 34px; border-radius: 0 14px 14px 0;
          background: rgba(1, 23, 15, 0.86); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4); }
        #s5-tagrule { position: absolute; left: 0; top: 0; width: 7px; height: 100%; background: #D6A536; transform-origin: 50% 100%; }
        #s5-tagpin { width: 20px; height: 20px; border-radius: 50%; background: #D6A536; margin-right: 22px; box-shadow: 0 0 14px rgba(214, 165, 54, 0.8); }
        .s5-name { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 46px; letter-spacing: 0.13em; text-transform: uppercase; color: #F8F4EC; white-space: nowrap; }
        .s5-name + .s5-name { display: none; }
        #s5-flare { position: absolute; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; opacity: 0; pointer-events: none;
          background: radial-gradient(closest-side, rgba(255, 252, 235, 1) 0%, rgba(255, 220, 150, 0.7) 22%, rgba(214, 165, 54, 0.25) 50%, rgba(214, 165, 54, 0) 100%); mix-blend-mode: screen; }
        #s5-streak { position: absolute; left: -10%; width: 120%; height: 26px; margin-top: -13px; opacity: 0; pointer-events: none;
          background: radial-gradient(closest-side, rgba(255, 250, 230, 1), rgba(255, 210, 120, 0.4) 60%, rgba(255, 210, 120, 0)); mix-blend-mode: screen; }
        .s5-ring { position: absolute; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%; opacity: 0; pointer-events: none;
          border: 6px solid rgba(255, 230, 170, 0.9); box-shadow: 0 0 40px rgba(255, 210, 120, 0.7), inset 0 0 30px rgba(255, 210, 120, 0.5); }
        #s5-white { position: absolute; inset: 0; background: #FFF6E2; pointer-events: none; }
      </style>

      <div id="root" data-composition-id="s5-proof" data-width="1080" data-height="1920" data-duration="5">
        <div id="s5-whip">
          <div class="s5-ph" id="s5-p0"><img src="assets/klubb-bro-hof-slott-g.jpg" alt=""></div>
          <div class="s5-ph" id="s5-p1"><img src="assets/klubb-halmstad-gk-g.jpg" alt=""></div>
          <div class="s5-ph" id="s5-p2"><img src="assets/klubb-falsterbo-gk-g.jpg" alt=""></div>
          <div class="s5-ph" id="s5-p3"><img src="assets/klubb-osteraker-gk-g.jpg" alt=""></div>
          <div class="s5-ph" id="s5-p4"><img src="assets/hero-skogsbana-g.jpg" alt=""></div>
          <div id="s5-scrim"></div>
          <div id="s5-flare"></div>
          <div id="s5-streak"></div>
          <div class="s5-ring" id="s5-r1"></div>
          <div class="s5-ring" id="s5-r2"></div>
          <div id="s5-fig"><span id="s5-num" data-layout-allow-overlap data-layout-allow-occlusion data-hf-motion-blur='{"samplesPerFrame": 16}'><span class="ext" data-layout-allow-overlap data-layout-allow-occlusion>300+</span><span class="face" id="s5-face" data-layout-allow-overlap data-layout-allow-occlusion>300+</span></span></div>
          <div id="s5-sub">golfklubbar</div>
          <div id="s5-sverige">i hela Sverige</div>
          <div id="s5-tag"><div id="s5-tagrule"></div><div id="s5-tagpin"></div><span class="s5-name" id="s5-name">Bro Hof Slott</span></div>
        </div>
        <div id="s5-white"></div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s5-proof"]');
          const $ = (s) => root.querySelector(s);
          const FMT = (root.closest('[data-fmt]') || { dataset: {} }).dataset.fmt || '9x16';
          const L = {
            '9x16': { H: 1920, fig: 250, fs: 360, sub: 600, ss: 52, sv: 1480, svs: 104, tag: 1700, fy: 760 },
            '4x5':  { H: 1350, fig: 90,  fs: 300, sub: 380, ss: 44, sv: 1000, svs: 88, tag: 1200, fy: 560 },
            '1x1':  { H: 1080, fig: 50,  fs: 250, sub: 300, ss: 38, sv: 800,  svs: 76, tag: 960, fy: 450 },
          }[FMT];
          // photos: cover the frame with 14% headroom for the zoom moves; focal x per photo
          const FOCAL = [0.42, 0.55, 0.62, 0.20, 0.5];
          const ph = [0, 1, 2, 3, 4].map((i) => $('#s5-p' + i));
          ph.forEach((p, i) => {
            const im = p.querySelector('img'); const h = L.H * 1.14; const w = h * 3344 / 1882;
            const maxShift = (w - 1080) / 2; const shift = Math.max(-maxShift, Math.min(maxShift, (0.5 - FOCAL[i]) * w));
            Object.assign(im.style, { width: w + 'px', height: h + 'px', marginLeft: (-w / 2 + shift) + 'px', marginTop: -h / 2 + 'px' });
          });
          $('#s5-fig').style.top = L.fig + 'px'; $('#s5-fig').style.fontSize = L.fs + 'px';
          $('#s5-sub').style.top = L.sub + 'px'; $('#s5-sub').style.fontSize = L.ss + 'px';
          $('#s5-sverige').style.top = L.sv + 'px'; $('#s5-sverige').style.fontSize = L.svs + 'px';
          Object.assign($('#s5-tag').style, { left: '0px', top: L.tag + 'px' });
          ['#s5-flare', '#s5-r1', '#s5-r2'].forEach((s) => { $(s).style.left = '540px'; $(s).style.top = L.fy + 'px'; });
          $('#s5-streak').style.top = L.fy + 'px';

          const tl = gsap.timeline({ paused: true });
          const SW = [0, 1, 2, 3, 4];                                   // 16.0 17.0 18.0 19.0 20.0 (bars + half bars)
          const NAMES = ['Bro Hof Slott', 'Halmstad GK', 'Falsterbo GK', 'Österåker GK', null];
          // opening: the dive's white opens on the drop
          tl.fromTo('#s5-white', { opacity: 0.9 }, { opacity: 0, duration: 0.2, ease: 'power2.out' }, 0);

          // photo swaps — HARD switch with tl.set at exactly SW[i]; the name tag text switches in the SAME set
          // time, so photo and tag can never drift apart (v1 bug: tag led the photo by one swap)
          ph.forEach((p, i) => {
            tl.set(p, { opacity: 0 }, 0);
            tl.set(p, { opacity: 1 }, SW[i]);
            if (i > 0) tl.set(ph[i - 1], { opacity: 0 }, SW[i]);
            const im = p.querySelector('img');
            // zoom-punch arrival (alternating direction = whip feel), then a slow settle; kick on the off-beat
            const dir = i % 2 ? 1 : -1;
            tl.fromTo(im, { scale: 1.28, x: dir * 220, filter: 'blur(14px) brightness(1.25)' },
              { scale: 1.06, x: 0, filter: 'blur(0px) brightness(1)', duration: 0.32, ease: 'expo.out', immediateRender: i === 0 }, SW[i]);
            tl.to(im, { scale: 1.0, duration: 0.68, ease: 'power1.out' }, SW[i] + 0.32);
            if (i < 4) {
              tl.to(im, { scale: 1.035, duration: 0.06, ease: 'power2.out' }, SW[i] + 0.5);
              tl.to(im, { scale: 1.0, duration: 0.4, ease: 'power2.out' }, SW[i] + 0.56);
            }
          });
          const name = $('#s5-name');
          NAMES.forEach((n, i) => { if (n) tl.set(name, { textContent: n }, SW[i]); });

          // 300+ slams on the drop and then stays planted
          tl.fromTo('#s5-num', { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.1, ease: 'power3.in' }, 0);
          tl.fromTo('#s5-num .ext', { '--d': 60 }, { '--d': 22, duration: 0.6, ease: 'power3.out' }, 0.16);
          tl.fromTo('#s5-sub', { opacity: 0, y: 24, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'expo.out' }, 0.5);
          tl.fromTo('#s5-face', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 0.6, ease: 'power2.inOut' }, 1.0);
          // a beat-kick on the number every bar keeps it alive
          [1, 2, 3].forEach((b) => { tl.to('#s5-num', { scale: 1.06, duration: 0.05, ease: 'power2.out' }, b); tl.to('#s5-num', { scale: 1, duration: 0.35, ease: 'power2.out' }, b + 0.05); });

          // name tag: slides in once at 0.5, the gold rule redraws on every swap
          tl.fromTo('#s5-tag', { x: -520 }, { x: 0, duration: 0.5, ease: 'expo.out' }, 0.25);
          [1, 2, 3].forEach((b) => tl.fromTo('#s5-tagrule', { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: 'expo.out', immediateRender: false }, SW[b]));
          [1, 2, 3].forEach((b) => tl.fromTo('#s5-name', { x: -18, opacity: 0.2 }, { x: 0, opacity: 1, duration: 0.25, ease: 'expo.out', immediateRender: false }, SW[b]));
          tl.to('#s5-tag', { x: -620, duration: 0.3, ease: 'power3.in' }, 3.82);

          // 4.00 (20.00) flare shockwave on the last swap, "i hela Sverige"
          tl.fromTo('#s5-flare', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.12, ease: 'power2.out', immediateRender: false }, 4.0);
          tl.to('#s5-flare', { opacity: 0, scale: 1.25, duration: 0.8, ease: 'power2.out' }, 4.12);
          tl.fromTo('#s5-streak', { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1.1, duration: 0.14, ease: 'power2.out', immediateRender: false }, 4.0);
          tl.to('#s5-streak', { opacity: 0, duration: 0.6, ease: 'power2.out' }, 4.14);
          tl.fromTo('#s5-r1', { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 3.2, duration: 0.7, ease: 'power2.out', immediateRender: false }, 4.0);
          tl.fromTo('#s5-r2', { opacity: 0.7, scale: 0.3 }, { opacity: 0, scale: 4.4, duration: 0.95, ease: 'power2.out', immediateRender: false }, 4.08);
          tl.set(['#s5-r1', '#s5-r2'], { opacity: 0 }, 0);
          tl.fromTo('#s5-sverige', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, 4.1);

          // 4.72–5.00 whip-pan out to the left (s6 opens with the matching whip from the right)
          tl.to('#s5-whip', { x: -1300, filter: 'blur(18px)', duration: 0.28, ease: 'power3.in' }, 4.72);

          window.__timelines['s5-proof'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
