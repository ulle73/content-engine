<!doctype html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Playfair Display'; src: url("assets/fonts/playfair-500-italic.woff2") format('woff2'); font-weight: 500; font-style: italic; font-display: block; }
        @font-face { font-family: 'Playfair Display'; src: url("assets/fonts/playfair-600.woff2") format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: 'Inter'; src: url("assets/fonts/inter-600.woff2") format('woff2'); font-weight: 600; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #01170F; }
        #s2-bg { position: absolute; inset: 0;
          background: radial-gradient(ellipse 80% 60% at 50% 52%, #0E4A33 0%, #073C2B 35%, #02200F 70%, #01170F 100%); }
        /* halftone field (nextphase.motiongraphics.device-orb-countup, recoloured gold) */
        #s2-dots { position: absolute; inset: -10%; pointer-events: none;
          background-image: radial-gradient(rgba(214, 165, 54, 0.9) 2.6px, transparent 3px); background-size: 42px 42px;
          -webkit-mask-image: radial-gradient(52% 40% at 50% 52%, transparent 30%, #000 62%, transparent 92%);
          mask-image: radial-gradient(52% 40% at 50% 52%, transparent 30%, #000 62%, transparent 92%); }
        #s2-cam { position: absolute; inset: 0; transform-origin: 50% 52%; }
        #s2-head { position: absolute; left: 0; right: 0; text-align: center; transform-origin: 50% 50%; font-family: 'Playfair Display', serif;
          font-style: italic; font-weight: 500; color: #F8F4EC; line-height: 1.05; letter-spacing: -0.01em; }
        .s2-mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.06em 0.12em; }
        .s2-w { display: inline-block; }
        .s2-gold { color: #E9C46A; }
        #s2-label { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600;
          letter-spacing: 0.32em; text-transform: uppercase; color: #E9C46A; }
        #s2-orbwrap { position: absolute; left: 50%; }
        #s2-glow { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(242, 200, 110, 0.55) 0%, rgba(214, 165, 54, 0.22) 45%, rgba(214, 165, 54, 0) 100%); }
        #s2-orb { position: absolute; inset: 0; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: radial-gradient(circle at 36% 28%, #FFF4D2 0%, #F4D584 16%, #DDAE45 40%, #A9781E 70%, #5A3C08 100%);
          box-shadow: inset 0 14px 40px -6px rgba(255, 255, 255, 0.85), inset 0 -40px 70px rgba(50, 30, 0, 0.6),
                      0 0 80px rgba(214, 165, 54, 0.55), 0 0 200px rgba(214, 165, 54, 0.3); }
        #s2-spec { position: absolute; left: 16%; top: 9%; width: 38%; height: 22%; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0)); transform: rotate(-24deg); }
        #s2-num { position: relative; font-family: 'Playfair Display', serif; font-weight: 600; color: #01170F; line-height: 1;
          letter-spacing: -0.02em; font-feature-settings: "lnum" 1, "tnum" 1; white-space: nowrap;
          text-shadow: 0 2px 0 rgba(255, 240, 200, 0.45); }
        #s2-unit { position: relative; font-family: 'Inter', sans-serif; font-weight: 600; color: #073C2B; letter-spacing: 0.26em;
          text-transform: uppercase; margin-top: 0.6em; }
        #s2-sheen { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
        #s2-sheen i { position: absolute; top: -20%; left: -60%; width: 40%; height: 140%; display: block;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0)); transform: rotate(18deg); }
        .s2-ring { position: absolute; left: 50%; border-radius: 50%; border: 6px solid rgba(255, 226, 150, 0.9);
          box-shadow: 0 0 40px rgba(255, 210, 120, 0.7); opacity: 0; }
        #s2-open { position: absolute; inset: 0; background: #FFF6E2; pointer-events: none; }
        #s2-leak { position: absolute; left: -50%; top: -40%; width: 200%; height: 180%; pointer-events: none;
          background: radial-gradient(closest-side, rgba(255, 250, 235, 1) 0%, rgba(255, 214, 140, 0.95) 30%, rgba(214, 165, 54, 0.6) 55%, rgba(214, 165, 54, 0) 75%);
          filter: blur(20px); }
        #s2-cover { position: absolute; inset: 0; background: #D6A536; opacity: 0; pointer-events: none; }
      </style>

      <div id="root" data-composition-id="s2-turn" data-width="1080" data-height="1920" data-duration="4">
        <div id="s2-bg"></div>
        <div id="s2-dots"></div>
        <div id="s2-cam" data-layout-allow-overflow>
          <div id="s2-head"><span class="s2-mask"><span class="s2-w">Med</span></span> <span class="s2-mask"><span class="s2-w s2-gold">friskvårdsbidraget.</span></span></div>
          <div id="s2-label">Upp till</div>
          <div class="s2-ring" id="s2-ring1"></div>
          <div class="s2-ring" id="s2-ring2"></div>
          <div id="s2-orbwrap">
            <div id="s2-glow" data-layout-allow-overflow></div>
            <div id="s2-orb">
              <div id="s2-spec"></div>
              <div id="s2-num">0</div>
              <div id="s2-unit">kr / år</div>
              <div id="s2-sheen"><i></i></div>
            </div>
          </div>
        </div>
        <div id="s2-leak"></div>
        <div id="s2-open"></div>
        <div id="s2-cover"></div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s2-turn"]');
          const $ = (s) => root.querySelector(s);
          const FMT = (root.closest('[data-fmt]') || { dataset: {} }).dataset.fmt || '9x16';
          const L = {
            '9x16': { head: 300, hs: 96, orb: 800, oy: 1060, label: 520, ls: 46, num: 224, unit: 38 },
            '4x5':  { head: 120, hs: 80, orb: 640, oy: 770, label: 300, ls: 38, num: 180, unit: 32 },
            '1x1':  { head: 64, hs: 70, orb: 540, oy: 620, label: 228, ls: 32, num: 150, unit: 28 },
          }[FMT];
          const head = $('#s2-head'); head.style.top = L.head + 'px'; head.style.fontSize = L.hs + 'px';
          const lab = $('#s2-label'); lab.style.top = L.label + 'px'; lab.style.fontSize = L.ls + 'px';
          const ow = $('#s2-orbwrap');
          Object.assign(ow.style, { width: L.orb + 'px', height: L.orb + 'px', marginLeft: -L.orb / 2 + 'px', top: (L.oy - L.orb / 2) + 'px' });
          root.querySelectorAll('.s2-ring').forEach((r) => Object.assign(r.style, { width: L.orb + 'px', height: L.orb + 'px', marginLeft: -L.orb / 2 + 'px', top: (L.oy - L.orb / 2) + 'px' }));
          $('#s2-num').style.fontSize = L.num + 'px';
          $('#s2-unit').style.fontSize = L.unit + 'px';
          $('#s2-cam').style.transformOrigin = '50% ' + L.oy + 'px';

          const tl = gsap.timeline({ paused: true });
          const LAND = 3.0;   // global 6.00 — downbeat of bar 4

          // flash-through second half: white-gold opens, leak core slides off to the left
          tl.fromTo('#s2-open', { opacity: 1 }, { opacity: 0, duration: 0.32, ease: 'power2.out' }, 0);
          tl.fromTo('#s2-leak', { opacity: 1, x: 0, scale: 1.25 }, { opacity: 0, x: -520, scale: 1.5, duration: 0.6, ease: 'power2.out' }, 0);
          // slow camera drift so nothing is ever frozen
          tl.fromTo('#s2-cam', { scale: 1.04 }, { scale: 1.0, duration: 3.6, ease: 'power1.out' }, 0);

          // headline: words rise out of their masks on the 8ths (3.00 / 3.25)
          const ws = root.querySelectorAll('.s2-w');
          ws.forEach((w, i) => tl.fromTo(w, { yPercent: 110, rotation: 4 }, { yPercent: 0, rotation: 0, duration: 0.55, ease: 'expo.out' }, 0.06 + i * 0.25));
          // the line is born big in the middle of the frame, then rises to its slot as the orb arrives (4.00)
          const midY = L.oy - L.orb * 0.36 - L.head - L.hs * 0.6;
          tl.fromTo('#s2-head', { y: midY, scale: 1.0 }, { y: midY, scale: 1.0, duration: 0.01 }, 0);
          tl.fromTo('#s2-head', { y: midY - 30 }, { y: midY + 10, duration: 0.82, ease: 'none', immediateRender: false }, 0.02);
          tl.to('#s2-head', { y: 0, duration: 0.6, ease: 'expo.inOut' }, 0.86);

          // the orb is born on 1.0 (global 4.00) and grows while the number counts
          tl.fromTo('#s2-orbwrap', { scale: 0.08, opacity: 0 }, { scale: 0.86, opacity: 1, duration: 1.0, ease: 'expo.out' }, 0.95);
          tl.to('#s2-orbwrap', { scale: 0.96, duration: 1.05, ease: 'power1.in' }, 1.95);
          tl.fromTo('#s2-dots', { opacity: 0.12, scale: 0.85 }, { opacity: 0.18, scale: 0.9, duration: 1.0, ease: 'none' }, 0);
          tl.to('#s2-dots', { opacity: 0.35, scale: 1, duration: 1.4, ease: 'expo.out' }, 1.1);
          tl.fromTo('#s2-label', { opacity: 0, y: 24, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'expo.out' }, 1.5);
          tl.fromTo('#s2-unit', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' }, LAND);

          // count 0 -> 5 000, lands exactly on LAND (swedish thin-space thousands)
          const num = $('#s2-num');
          const c = { v: 0 };
          const fmt = (v) => { const n = Math.round(v); return n >= 1000 ? Math.floor(n / 1000) + ' ' + String(n % 1000).padStart(3, '0') : String(n); };
          tl.fromTo(c, { v: 0 }, { v: 5000, duration: LAND - 1.0, ease: 'power2.in', onUpdate: () => { num.textContent = fmt(c.v); } }, 1.0);
          tl.set(num, { textContent: '5 000' }, LAND);

          // LAND: punch, rings, glow burst, dots flare, sheen
          tl.fromTo('#s2-orbwrap', { scale: 1.12 }, { scale: 1.0, duration: 0.7, ease: 'elastic.out(1, 0.45)', immediateRender: false }, LAND);
          tl.fromTo('#s2-glow', { scale: 1, opacity: 1 }, { scale: 1.6, opacity: 0.55, duration: 0.25, ease: 'power2.out', immediateRender: false }, LAND);
          tl.to('#s2-glow', { scale: 1.15, opacity: 1, duration: 0.8, ease: 'power2.out' }, LAND + 0.25);
          tl.fromTo('#s2-ring1', { scale: 1, opacity: 0.95 }, { scale: 2.1, opacity: 0, duration: 0.75, ease: 'power2.out', immediateRender: false }, LAND);
          tl.fromTo('#s2-ring2', { scale: 1, opacity: 0.6 }, { scale: 2.8, opacity: 0, duration: 1.0, ease: 'power2.out', immediateRender: false }, LAND + 0.08);
          tl.fromTo('#s2-dots', { opacity: 0.85 }, { opacity: 0.35, duration: 0.9, ease: 'power2.out', immediateRender: false }, LAND);
          tl.fromTo('#s2-sheen i', { xPercent: 0 }, { xPercent: 520, duration: 0.6, ease: 'power2.inOut' }, LAND + 0.05);

          // exit (global 6.75–7.00): camera dives into the gold — s3 opens on the same gold
          tl.to(['#s2-num', '#s2-unit', '#s2-head', '#s2-label'], { opacity: 0, duration: 0.14, ease: 'power1.in' }, 3.7);
          tl.to('#s2-cam', { scale: 7, duration: 0.3, ease: 'power3.in' }, 3.7);
          tl.fromTo('#s2-cover', { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'none' }, 3.88);

          window.__timelines['s2-turn'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
