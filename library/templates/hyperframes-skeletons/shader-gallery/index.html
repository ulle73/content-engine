<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <!-- Shadergalleri: alla 14 HyperShader-övergångar från HyperFrames docs/guides/claude-design-hyperframes.md §4
         (@hyperframes/shader-transitions, MIT). En scen per färg, 2,4 s per scen, övergång 0,8 s mitt på scengränsen.
         Scen N visar namnet på shadern som förde in den. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/shader-transitions/dist/index.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0b0b10; }
      .scene { position: absolute; top: 0; left: 0; width: 1080px; height: 1080px; overflow: hidden; }
      .scene-content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
      .clip { }
      .orb { position: absolute; top: 160px; width: 520px; height: 520px; border-radius: 50%; opacity: 0.9; }
      .num { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 380px; line-height: 0.9; letter-spacing: -0.05em; }
      .rule { width: 120px; height: 8px; border-radius: 4px; }
      .lbl { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 46px; letter-spacing: 0.04em; }
      #g01{background-color:#0b0b10;color:#f4f3f8} #g01 .orb{left:500px;background:radial-gradient(circle, #8b7bff 0%, #8b7bff00 68%)} #g01 .lbl{color:#8b7bff} #g01 .rule{background:#8b7bff}
      #g02{background-color:#ffb547;color:#1a1206} #g02 .orb{left:60px;background:radial-gradient(circle, #1a1206 0%, #1a120600 68%)} #g02 .lbl{color:#1a1206} #g02 .rule{background:#1a1206}

      #g05{background-color:#1b1035;color:#ffffff} #g05 .orb{left:500px;background:radial-gradient(circle, #ff5ccd 0%, #ff5ccd00 68%)} #g05 .lbl{color:#ff5ccd} #g05 .rule{background:#ff5ccd}
      #g06{background-color:#e8f0ff;color:#0b1a3a} #g06 .orb{left:60px;background:radial-gradient(circle, #2d5bff 0%, #2d5bff00 68%)} #g06 .lbl{color:#2d5bff} #g06 .rule{background:#2d5bff}
      #g07{background-color:#2a0f0f;color:#ffe9e0} #g07 .orb{left:500px;background:radial-gradient(circle, #ff6a2b 0%, #ff6a2b00 68%)} #g07 .lbl{color:#ff6a2b} #g07 .rule{background:#ff6a2b}

      #g10{background-color:#071a2a;color:#dff3ff} #g10 .orb{left:60px;background:radial-gradient(circle, #38bdf8 0%, #38bdf800 68%)} #g10 .lbl{color:#38bdf8} #g10 .rule{background:#38bdf8}

      #g15{background-color:#0a0a0d;color:#f5f5f7} #g15 .orb{left:500px;background:radial-gradient(circle, #7c6cff 0%, #7c6cff00 68%)} #g15 .lbl{color:#7c6cff} #g15 .rule{background:#7c6cff}
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-width="1080" data-height="1080" data-start="0" data-duration="36">
      <div class="scene clip" id="g01" data-start="0.0" data-duration="2.4" data-track-index="0">

        <div class="scene-content">

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.set("#g01", { opacity: 1 }, 0);
      // Kontinuerlig drift i varje scen (inga entréer — då syns båda scenerna helt under övergången)
      tl.to("#g01-orb", { y: 60, scale: 1.12, duration: 2.4, ease: "none" }, 0.0);
      tl.to("#g01-num", { scale: 1.06, duration: 2.4, ease: "none" }, 0.0);
      tl.to("#g02-orb", { y: -60, scale: 1.12, duration: 2.4, ease: "none" }, 2.4);
      tl.to("#g02-num", { scale: 1.06, duration: 2.4, ease: "none" }, 2.4);
      tl.to("#g03-orb", { y: 60, scale: 1.12, duration: 2.4, ease: "none" }, 4.8);
      tl.to("#g03-num", { scale: 1.06, duration: 2.4, ease: "none" }, 4.8);
      tl.to("#g04-orb", { y: -60, scale: 1.12, duration: 2.4, ease: "none" }, 7.2);
      tl.to("#g04-num", { scale: 1.06, duration: 2.4, ease: "none" }, 7.2);
      tl.to("#g05-orb", { y: 60, scale: 1.12, duration: 2.4, ease: "none" }, 9.6);
      tl.to("#g05-num", { scale: 1.06, duration: 2.4, ease: "none" }, 9.6);
      tl.to("#g06-orb", { y: -60, scale: 1.12, duration: 2.4, ease: "none" }, 12.0);
      tl.to("#g06-num", { scale: 1.06, duration: 2.4, ease: "none" }, 12.0);
      tl.to("#g07-orb", { y: 60, scale: 1.12, duration: 2.4, ease: "none" }, 14.4);
      tl.to("#g07-num", { scale: 1.06, duration: 2.4, ease: "none" }, 14.4);
      tl.to("#g08-orb", { y: -60, scale: 1.12, duration: 2.4, ease: "none" }, 16.8);
      tl.to("#g08-num", { scale: 1.06, duration: 2.4, ease: "none" }, 16.8);
      tl.to("#g09-orb", { y: 60, scale: 1.12, duration: 2.4, ease: "none" }, 19.2);
      tl.to("#g09-num", { scale: 1.06, duration: 2.4, ease: "none" }, 19.2);
      tl.to("#g10-orb", { y: -60, scale: 1.12, duration: 2.4, ease: "none" }, 21.6);
      tl.to("#g10-num", { scale: 1.06, duration: 2.4, ease: "none" }, 21.6);
      tl.to("#g11-orb", { y: 60, scale: 1.12, duration: 2.4, ease: "none" }, 24.0);

      tl.to("#g12-num", { scale: 1.06, duration: 2.4, ease: "none" }, 26.4);
      tl.to("#g13-orb", { y: 60, scale: 1.12, duration: 2.4, ease: "none" }, 28.8);
      tl.to("#g13-num", { scale: 1.06, duration: 2.4, ease: "none" }, 28.8);
      tl.to("#g14-orb", { y: -60, scale: 1.12, duration: 2.4, ease: "none" }, 31.2);
      tl.to("#g14-num", { scale: 1.06, duration: 2.4, ease: "none" }, 31.2);

      tl.to("#g15-num", { scale: 1.06, duration: 2.4, ease: "none" }, 33.6);
      window.HyperShader.init({
        bgColor: "#0b0b10",
        accentColor: "#8b7bff",
        scenes: ["g01", "g02", "g03", "g04", "g05", "g06", "g07", "g08", "g09", "g10", "g11", "g12", "g13", "g14", "g15"],
        timeline: tl,
        transitions: [
          { time: 2.0, shader: "domain-warp", duration: 0.8 },
          { time: 4.4, shader: "ridged-burn", duration: 0.8 },
          { time: 6.8, shader: "whip-pan", duration: 0.8 },
          { time: 9.2, shader: "sdf-iris", duration: 0.8 },

          { time: 14.0, shader: "gravitational-lens", duration: 0.8 },
          { time: 16.4, shader: "cinematic-zoom", duration: 0.8 },
          { time: 18.8, shader: "chromatic-split", duration: 0.8 },
          { time: 21.2, shader: "swirl-vortex", duration: 0.8 },
