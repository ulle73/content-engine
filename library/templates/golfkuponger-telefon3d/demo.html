<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<title>3D-telefonen – demo</title>
<!-- three.js: filmer kör lokalt (npm i three@0.180.0 och importmap mot ./node_modules); demon hämtar samma version från jsDelivr -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>html,body{margin:0;background:#06231c}canvas{display:block}</style>
</head><body>
<canvas id="film"></canvas>
<script>
// ?format=9x16|16x9|4x5  ?skarm=<bild>  ?t=<sekund> (stillbild)
const Q = new URLSearchParams(location.search);
const FORMAT = { '9x16': [1080, 1920], '16x9': [1920, 1080], '4x5': [1080, 1350] }[Q.get('format') || '9x16'];
const [W, H] = FORMAT;
window.T3_STORLEK = { W, H };
const film = document.getElementById('film'); film.width = W; film.height = H;
const X = film.getContext('2d');
let SKARMBILD = null;
if (Q.get('skarm')) { SKARMBILD = new Image(); SKARMBILD.src = Q.get('skarm'); }

// skärmen: ritas i T3.skarmDuk (620×1325) – här en enkel Golfkuponger-skärm om ingen bild anges
function ritaSkarm(g, w, h) {
  if (SKARMBILD && SKARMBILD.complete) { g.drawImage(SKARMBILD, 0, 0, w, h); return; }
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0b3b2e'); gr.addColorStop(1, '#06231c');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#d8b25c'; g.font = '700 46px Georgia, serif'; g.textAlign = 'center';
  g.fillText('Golfkuponger', w / 2, h * 0.2);
  g.fillStyle = '#f4efe2'; g.font = '600 92px Georgia, serif'; g.fillText('2 000 kr', w / 2, h * 0.44);
  g.font = '400 34px Arial, sans-serif'; g.fillStyle = '#cfe3d9'; g.fillText('Saldo · 300+ golfklubbar', w / 2, h * 0.5);
  g.fillStyle = '#d8b25c'; g.beginPath(); g.roundRect(w * 0.15, h * 0.62, w * 0.7, 96, 48); g.fill();
  g.fillStyle = '#06231c'; g.font = '700 38px Arial, sans-serif'; g.fillText('Betala greenfee', w / 2, h * 0.62 + 61);
}

// en rörelse: långsam produktfilmsdrift + ett varv runt längdaxeln mitt i (se README "Rörelser")
const TAU = Math.PI * 2, eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function vrid(t) {
  let ry = 0.35 * Math.sin(TAU * t / 8) - 0.25, rx = 0.06 + 0.04 * Math.sin(TAU * t / 11), rz = 0.03 * Math.sin(TAU * t / 9);
  const k = Math.min(1, Math.max(0, (t - 3.5) / 1.2));
  if (k > 0 && k < 1) ry += TAU * eIO(k);
  return { rx, ry, rz };
}

window.renderAt = (t) => {
  const bg = X.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.5, Math.hypot(W, H) / 2);
  bg.addColorStop(0, '#0f4a39'); bg.addColorStop(1, '#03140f'); X.fillStyle = bg; X.fillRect(0, 0, W, H);
  const T3 = window.T3; if (!T3) return;
  ritaSkarm(T3.skarmDuk.getContext('2d'), T3.SKARM.w, T3.SKARM.h);
  const bredd = Math.min(W, H) * 0.42;                 // telefonens bredd i px
  const hojd = bredd * 150 / 71.9;
  const lage = { x: W / 2, y: H / 2 - hojd / 2, w: bredd };
  X.drawImage(T3.rita(lage, vrid(t)), 0, 0);
};
window.klar = new Promise(ok => { const v = () => window.T3 ? ok(true) : setTimeout(v, 25); v(); });
window.klar.then(() => {
  if (Q.has('t')) { window.renderAt(parseFloat(Q.get('t'))); document.title = 'klar'; return; }
  const t0 = performance.now(); const loop = () => { window.renderAt((performance.now() - t0) / 1000 % 8); requestAnimationFrame(loop); }; loop();
});
</script>
<script type="module" src="telefon3d.js"></script>
</body></html>
