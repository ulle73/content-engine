{% firstof request.user.first_name request.user.username "U" as user_label %}
<header class="app-topbar">
  <a class="company-switch" href="{% url 'dashboard' %}">
    <strong>{{ workspace.name }}</strong>
    <span>Byt företag</span>
  </a>
  <div class="topbar-actions">
    <span class="topbar-user" aria-label="Inloggad användare">
      <span class="topbar-user-avatar" aria-hidden="true">{{ user_label|slice:":1"|upper }}</span>
    </span>
    <form class="logout-form" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="logout-button" type="submit">Logga ut</button></form>
  </div>
</header>
