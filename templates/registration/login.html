{% extends 'base.html' %}
{% block title %}Logga in · Content Engine{% endblock %}
{% block content %}
<main id="main-content" tabindex="-1" class="auth-shell">
  <section class="auth-card">
    <div class="auth-brand">CE</div>
    <span class="editorial-eyebrow">Content Engine</span>
    <h1>Välkommen tillbaka</h1>
    <p class="intro">Logga in för att fortsätta till dina arbetsytor, insikter och innehållsutkast.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="button" type="submit">Logga in</button></form>
  </section>
</main>
{% endblock %}
