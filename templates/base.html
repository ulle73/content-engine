<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Content Engine{% endblock %}</title>
  <style>
    :root {--text-primary:#172a22;--text-secondary:#56645c;--border:#d9e2dc;--surface-primary:#fff;font-family:system-ui,sans-serif;color:var(--text-primary);background:#f4f7f3}
    * {box-sizing:border-box} body {margin:0} a {color:#176444} p {line-height:1.6} h1 {letter-spacing:-.025em}
    .topbar {display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:18px 28px;background:#fff;border-bottom:1px solid var(--border)}
    .topbar nav {display:flex;align-items:center;gap:24px;flex-wrap:wrap}.topbar .logo {font-weight:750;text-decoration:none;font-size:20px}
    .topbar button {border:0;background:none;color:#176444;cursor:pointer;font:inherit;text-decoration:underline}
    .engine {max-width:1100px;margin:0 auto;padding:32px 24px}.engine.narrow {max-width:620px}
    .engine h1 {font-size:30px;font-weight:650;margin-bottom:8px}.engine h2 {font-size:20px;font-weight:600;margin:0 0 14px}
    .intro,.small {color:var(--text-secondary)}.small,.helptext {font-size:14px}.helptext {display:block;color:var(--text-secondary);margin-top:8px}
    .box {border:1px solid var(--border);border-radius:12px;padding:24px;margin:18px 0;background:#fff}
    .engine label {display:block;font-weight:600;margin:18px 0 6px}.engine input,.engine textarea {width:100%;border:1px solid #a7b9ac;border-radius:6px;padding:10px;background:#fff;font:inherit}
    .engine button,.action {display:inline-block;border:0;border-radius:7px;background:#176444;color:white;padding:11px 18px;margin-top:12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
    .engine nav {display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px}.ideas {display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    .idea {padding:18px;border:1px solid var(--border);border-radius:10px}.idea h3 {font-size:18px}.idea p {margin:10px 0}
    blockquote {border-left:3px solid #176444;padding-left:12px;color:var(--text-secondary);font-size:14px}.errorlist {color:#b42318}
    details summary {cursor:pointer;font-weight:600}.notice {max-width:1052px;margin:18px auto;padding:16px 24px;border:1px solid #a9c8b4;background:#e9f5ed;border-radius:8px}.notice.error {background:#fff0ed;border-color:#dfb2a8}
    :focus-visible {outline:3px solid #5f9872;outline-offset:3px}
    @media(max-width:600px) {.engine {padding:20px 14px}.box {padding:18px}.topbar {padding:16px}.engine h1 {font-size:26px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="logo" href="{% url 'dashboard' %}">Content Engine</a>
  {% if user.is_authenticated %}<nav><a href="{% url 'dashboard' %}">Mina företag</a><a href="https://platform.postiz.com" target="_blank" rel="noopener">Öppna Postiz ↗</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Logga ut</button></form></nav>{% endif %}</header>
  {% for message in messages %}<div class="notice {{ message.tags }}" role="status">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
